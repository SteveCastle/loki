    get:
      tags:
        - People and Faces
      operationId: listPersonFaces
      summary: List a person's faces for review, least typical first.
      description: >-
        Each face carries a `typicality` score: cosine similarity to the group center. The center is
        the mean of the user-confirmed faces when the person has any (a confirmed face is measured
        against the other confirmed faces), otherwise the mean of all the person's faces excluding
        the face itself. Faces are sorted by ascending typicality so outliers come first.
      x-access: read
