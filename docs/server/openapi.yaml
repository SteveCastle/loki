      x-access: admin
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '405':
          description: Not GET. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: The scheduler has not been started. Plain text `scheduler not running`.
          content:
            text/plain:
              schema:
                type: string
  /api/scheduler/mode:
    post:
      tags:
        - Auto Scheduler
      operationId: setSchedulerMode
      summary: Turn the scheduler on (`auto`) or off for this server session.
      description: >-
        Applies immediately. Turning it off pauses a running scheduled job. Either direction cancels
        a forced run. The mode is not persisted across restarts.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - 'off'
                    - auto
            example:
              mode: auto
      responses:
        '200':
          description: Status after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '400':
          description: Invalid JSON, or `mode` is not `off` or `auto`. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Not POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: The scheduler has not been started. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/scheduler/run:
    post:
      tags:
        - Auto Scheduler
      operationId: forceSchedulerRun
      summary: Start or resume the scheduled job now, ignoring idle signals until it completes.
      description: Also clears a manual hold (a scheduled job the user paused by hand). No request body.
      x-access: admin
      responses:
        '200':
          description: Status after the forced tick.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '405':
          description: Not POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: The scheduler has not been started. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/onboarding/state:
    get:
      tags:
        - Onboarding
