  /api/scenes/{id}/layers/{lid}/versions/{n}/loop:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
      - name: 'n'
        in: path
        required: true
        description: Zero-based index into the layer's `versions`; a non-integer answers 400 (`bad version`).
        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: loopSceneVersion
      summary: Add a seamless-loop copy of a motion version.
      description: >
        Served by `/api/scenes/{id}/layers/{lid}/versions/{n}/{action}` with

        `action` = `loop`. Runs synchronously (ffmpeg) and appends the loop as a

        new active version (without the source's roto).


        - `crossfade` dissolves the end into the start (up to a second, never more than a quarter of
        the clip).

        - `natural` finds the best loop inside the clip and hides its seam with a short dissolve.

        - `boomerang` plays forward then backward.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - crossfade
                    - natural
                    - boomerang
              required:
                - kind
            example:
              kind: crossfade
      responses:
        '200':
          description: The scene with the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: >-
            `n` not an integer, unknown or missing `kind` (`unknown loop kind ...`), or ffmpeg
            failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene, or `lid`/`n` is not a motion version.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/boomerang:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
      - name: 'n'
        in: path
        required: true
        description: Zero-based index into the layer's `versions`; a non-integer answers 400 (`bad version`).
        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: boomerangSceneVersion
      summary: Add a boomerang loop of a motion version.
      description: Same as `loop` with `kind` = `boomerang`. No body.
      x-access: admin
      responses:
        '200':
          description: The scene with the new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
