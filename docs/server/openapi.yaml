  /config:
    get:
      tags:
        - HTML Pages
      operationId: configPage
      summary: Configuration editor page.
      description: Renders the Config page from the config file. S3 credentials are redacted in the page.
      x-access: admin
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Browser without a session. Redirects to `/login` (or `/setup`).
        '500':
          description: Config could not be loaded or the template failed. Plain text.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - System
      operationId: updateConfig
      summary: Merge settings into the configuration, save it and apply it.
      description: >
        Not a full replacement: the server starts from its in-memory configuration and overwrites
        only the fields below, mostly only when they are present and non-empty (strings) or positive
        (numbers), so partial posts are safe. Exceptions:


        - `dbPath` is required on every call.

        - `onnxModelPath`, `onnxLabelsPath`, `onnxConfigPath` and `onnxOrtSharedLibPath` are
        assigned unconditionally, so omitting them clears them.

        - Pointer-style fields (`transcriptionLanguage`, `transcriptionVadFilter`,
        `transcriptionInitialPrompt`, `transcriptionHotwords`, `transcriptionVocalExtract`,
        `allowPublicAccess`, `defaultStartPath`) and the arrays `byoFaceModels` and `roots` apply
        whenever present, including empty values; omitted means unchanged.

        - Secret fields equal to `<redacted>` keep the stored value; storage roots posted with
        `<redacted>` credentials recover them from the stored root with the same
        bucket+endpoint+prefix, else the same label.


        Keys not accepted here (for example `engines`, `swipeFeed`, `reshootModels`, `dreamModel`,
        `autoProcessOps`, `setupComplete`, `jwtSecret`) are ignored. After saving, the server
        switches databases if `dbPath` changed (clearing the `auth_token` cookie, since users and
        keys live in the library database), rebuilds the embedding or face index in the background
        when the active model changed, rebuilds storage backends, and re-applies concurrency caps. A
        `port` change takes effect on restart.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
            example:
              dbPath: C:\ProgramData\Lowkey Media Server\media.db
              embeddingModel: siglip2-base-patch16-224
              allowPublicAccess: false
      responses:
        '200':
          description: Saved and applied.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - configPath
                  - activeDBPath
                  - changed
                  - dbChanged
                  - logoutRequired
                  - storageWarnings
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  configPath:
                    type: string
                    description: Path of the config file written.
                  activeDBPath:
                    type: string
                  changed:
                    type: boolean
                    description: Whether any configuration value differs from before.
                  dbChanged:
                    type: boolean
                  logoutRequired:
                    type: boolean
                    description: Equal to `dbChanged`; the session cookie was cleared.
                  storageWarnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Storage backends that failed to initialise, a default root that fell back to
                      another, or a note that `LOWKEY_ROOTS`/`LOWKEY_ROOT_*` environment variables
                      override the saved roots.
              example:
                status: ok
                configPath: C:\ProgramData\Lowkey Media Server\config.json
                activeDBPath: C:\ProgramData\Lowkey Media Server\media.db
                changed: true
                dbChanged: false
                logoutRequired: false
                storageWarnings: []
        '400':
          description: '`bad json`, or `dbPath cannot be empty`. Plain text.'
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than GET or POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Config file could not be saved, or the database switch failed. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /:
    get:
      tags:
