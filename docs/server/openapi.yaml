    MediaQueryRequest:
      type: object
      description: >-
        Body of `POST /api/media/query`. There is no paging, limit or cursor; the full result is
        returned.
      properties:
        mode:
          type: string
          enum:
            - AND
            - OR
          default: AND
          description: >-
            Connector for predicates without their own `join`. Anything other than exactly `OR`
            means `AND`.
        predicates:
          type: array
          items:
            $ref: '#/components/schemas/MediaQueryPredicate'
          description: Evaluated left to right. Missing or empty returns the whole library.
    MediaQueryPredicate:
      type: object
      description: >
        One filter or ranking term. `value` semantics by `type`:

        - `tag`: exact tag label; the item has that tag.

        - `category`: exact category label; the item has any tag in that category.

        - `path`, `description`, `hash`: substring match (`LIKE '%value%'`, case-insensitive for
        ASCII; `%` and `_` in the value are wildcards).

        - `orientation`: `landscape`, `portrait` or `square` (case-insensitive), comparing stored
        width and height. Items without dimensions never match an include and are kept by an
        exclude. Other values match nothing.

        - `faces`: only `ungrouped`: items with at least one detected face and no face assigned to a
        person. Other values match nothing.

        - `dupe`: a duplicate group id (active, non-excluded members of that group), `pending`
        (members of pending groups) or `any`/`all` (every grouped item, dismissed groups included).
        Other values match nothing.

        - `similar` (visual): a library media path; ranks by image-embedding similarity to it,
        embedding the file on the fly if it has no vector.

        - `visual` (visual): free text; text-to-image search.

        - `clip` (visual): an image as a base64 data URL (`data:image/png;base64,...`) or bare
        base64; image-to-image search.

        - `face` (visual): a library media path or an image data URL; face-identity search, one hit
        per media item. Ignores `text` and `nodes`.


        For an exclude of a "matches nothing" value (unknown orientation, faces or dupe value, or a
        visual predicate with no hits), nothing is removed.
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - tag
            - category
            - path
            - description
            - hash
            - orientation
            - faces
            - dupe
            - similar
            - visual
            - clip
            - face
        value:
          type: string
          description: Operand; meaning depends on `type`. An empty value removes the predicate from the query.
        exclude:
          type: boolean
          default: false
          description: Negate the predicate (`NOT EXISTS`, `NOT LIKE`, `NOT IN`).
        join:
          type: string
          enum:
            - AND
            - OR
            - ''
          description: >-
            Connector to the running result of the predicates before it. Missing, empty or any other
            value falls back to `mode`. Ignored on the first predicate.
        text:
          type: string
          description: >-
            Legacy blend, `similar` and `clip` only. Free text mixed into the image query as one
            combined vector. Without `nodes` it is a two-way image/text blend; with `nodes` it is
            folded in as one more text term weighted by `textWeight`.
        textWeight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: >-
            Share of `text` in the blend, clamped to 0 to 1 (0 = pure image, 1 = pure text). Missing
            means 0.5.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/MediaQueryBlendNode'
          description: >-
            Composite similarity for `similar`, `clip` and `visual`. The predicate's own `value` is
            the base term with weight 1; each node adds a signed weighted term. Nodes with weight 0
            are skipped.
        blendMode:
          type: string
          enum:
            - blend
            - shared
            - ''
          default: blend
          description: >-
            How a predicate with `nodes` is scored. `blend` (or empty, or any value other than
            `shared`) combines all terms into one centroid vector. `shared` scores candidates
            against every positive term at once (must match all), finding what the positive terms
            have in common.
    MediaQueryBlendNode:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - image
            - clip
            - text
          description: >-
            `image` = a library media path, `clip` = an image data URL or base64, `text` = free
            text. Any other kind fails the query with `500`.
        value:
          type: string
          description: Path, data URL or text. Blank `text` nodes are skipped.
        weight:
          type: number
          minimum: 0
          maximum: 1
          description: Magnitude, clamped to 0 to 1. Missing means 1; 0 drops the node.
        negative:
          type: boolean
          default: false
          description: Subtract this term, steering results away from it.
    MediaListItem:
      type: object
      description: >-
        One item in a list result. Nullable database columns are omitted when NULL (a real zero is
        still sent).
      required:
        - path
        - mtimeMs
      properties:
        path:
          type: string
          description: Media path.
        mtimeMs:
          type: integer
          description: >-
            The driving tag assignment's `created_at` (milliseconds) when a tag predicate drives the
            row, otherwise `0`. Not the file's modification time.
        elo:
          type: number
          description: Battle Mode rating.
        battles:
