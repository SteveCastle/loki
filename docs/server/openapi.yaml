  /api/faces/{id}/assign:
    post:
      tags:
        - People and Faces
      operationId: assignFace
      summary: Assign a face to a person (confirmed).
      description: >-
        Records a user assignment. Choose the target in one of three ways:


        - `personId`: an existing person.

        - `name` (with no `personId`): the person with that name (the `_cluster`-suffixed form also
        matches) is reused, or created when none exists.

        - `newPerson: true` (with no `personId` or `name`): a new auto-named `Unknown #N` person
        seeded by this face.


        A newly created person gets this face as its cover. Broadcasts a `people-updated` event on
        `/stream`.
      x-access: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Face id (positive integer).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  type: integer
                  format: int64
                  description: Existing person id. Takes precedence when non-zero.
                name:
                  type: string
                  description: Person name to reuse or create (trimmed).
                newPerson:
                  type: boolean
                  description: Mint a new auto-named person when neither `personId` nor `name` is given.
            example:
              name: Ada
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  faceId:
                    type: integer
                    format: int64
                  personId:
                    type: integer
                    format: int64
                    description: The person the face now belongs to.
                  created:
                    type: boolean
                    description: >-
                      True when a new person was created for this assignment (its only face becomes
                      the cover).
                  name:
                    type: string
                    description: >-
                      The name used when assigning by `name` / `newPerson`; empty when assigned by
                      `personId`.
                required:
                  - faceId
                  - personId
                  - created
                  - name
              example:
                faceId: 5120
                personId: 12
                created: false
                name: Ada
        '400':
          description: >-
            Invalid face id, invalid JSON, or none of `personId`, `name`, `newPerson` given. The
            body is `{"error": "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No face or no person with that id. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
