  /stream:
    get:
      tags:
        - Real-Time Events
      operationId: streamEvents
      summary: Server-Sent Events feed of job and library changes.
      description: >
        Opens a `text/event-stream` (`Cache-Control: no-cache`, `Access-Control-Allow-Origin: *`,
        never compressed). The route is registered **without** the auth middleware, so it is open to
        anyone who can reach the port regardless of the Allow Public Access setting; it carries job
        metadata and job output lines.


        On connect the server first sends one unnamed message (a plain `message` event) whose data
        is `StreamConnectedEvent`. A comment line `: keep-alive` follows every 30 seconds. Then, for
        each broadcast, `event: <name>` plus `data: <JSON>`:


        - `create`, `update`, `delete`: a job was added (including copies), changed state, or was
        removed or cleared. Data: `JobListEvent`. For `delete` only `job.id` is meaningful; every
        other field is a zero value.

        - `stdout-<jobId>`: one log line from that job. Data: `StdoutEvent`.

        - `progress`: item progress of a job (throttled to about 4 per second per job; the first and
        final updates always go out). Data: `ProgressEvent`.

        - `people-updated`: person groupings changed (face clustering finished a model, or a manual
        People edit). Data: `PeopleUpdatedEvent`; `models` is empty for manual edits. Refetch
        people.

        - `duplicates-updated`: duplicate-candidate groups changed (the find-duplicates task, or a
        manual review action). Data: `DuplicatesUpdatedEvent`; counts are `0` for manual actions.
        Refetch duplicates.

        - `media-updated`: the save task overwrote these files in place; bust caches. Data:
        `MediaPathsEvent`.

        - `media-created`: the save task wrote these new files. Data: `MediaPathsEvent`.

        - `scheduler`: the auto scheduler changed mode, state, reason or job. Data:
        `SchedulerEvent`.

        - `stats`: library statistics changed (coalesced; at most one per second). Data:
        `StatsEvent`, the same object as `GET /api/stats`.


        At most 5000 concurrent connections are accepted. Connections that see no traffic for about
        two minutes are reaped (keep-alives count as traffic).
      x-access: public
      security: []
      responses:
        '200':
          description: The event stream. It stays open until the client disconnects or the server shuts down.
          content:
            text/event-stream:
              schema:
                description: >-
                  Server-Sent Events. Each frame carries an event name and one line of JSON data;
                  the data is one of these payloads, chosen by the event name as described above.
                oneOf:
                  - $ref: '#/components/schemas/StreamConnectedEvent'
                  - $ref: '#/components/schemas/JobListEvent'
                  - $ref: '#/components/schemas/StdoutEvent'
                  - $ref: '#/components/schemas/ProgressEvent'
                  - $ref: '#/components/schemas/PeopleUpdatedEvent'
                  - $ref: '#/components/schemas/DuplicatesUpdatedEvent'
                  - $ref: '#/components/schemas/MediaPathsEvent'
                  - $ref: '#/components/schemas/SchedulerEvent'
                  - $ref: '#/components/schemas/StatsEvent'
              example: >
                data: {"type":"connected","msg":"SSE connection established"}


                event: progress

                data:
                {"updateType":"progress","id":"3f0c8f5e-6a0e-4c41-9a7a-2f1f3d0b8c11","done":3,"total":10}


                event: stdout-3f0c8f5e-6a0e-4c41-9a7a-2f1f3d0b8c11

                data: {"updateType":"stdout","line":"processed D:/photos/a.jpg"}


                : keep-alive
        '500':
          description: The response writer cannot stream (`Streaming unsupported`).
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: >-
            The 5000-connection limit is reached (`Server at capacity, please try again later`).
            Rejections are counted as `rejected_connections` in `GET /health`.
          content:
            text/plain:
              schema:
                type: string
  /api/media/query:
    post:
      tags:
        - Media Library
      operationId: queryMedia
      summary: Run a composable predicate query, with optional similarity ranking.
      description: >
        The main library query. Predicates are combined left to right: the first predicate with a
        non-empty `value` is the base, and each later one is connected to the running result by its
        own `join`, or by `mode` when `join` is missing or not `AND`/`OR`. The expression is
        parenthesised left-associatively, so `a OR b AND c` means `(a OR b) AND c`. Predicates with
        an empty `value` are ignored. With no usable predicates the whole library is returned.


        The four *visual* types (`similar`, `visual`, `clip`, `face`) are resolved through the
        embedding index into a candidate set of at most 1000 paths, which then takes part in the
        boolean expression like any other predicate. When every connector is `AND` and the query
        mixes visual and non-visual predicates, evaluation is filter-first: the non-visual
        predicates run first and similarity is scored only inside that set, so the result is the top
        1000 most similar items *within* the filter. If that filter matches nothing, the model is
        not called at all.


        Ordering:

        - Without a visual predicate the server emits no `ORDER BY`; the order is whatever SQLite
        returns (the viewer sorts client side). Every item omits `score`.

        - With a visual predicate every item carries `score` and items are sorted by it, highest
        first. When several visual predicates match the same item the highest score is kept; items
        that matched only a non-visual branch of an `OR` get score `0`.


        An unknown predicate `type` produces invalid SQL and a `500`.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQueryRequest'
            examples:
              filters:
                summary: Tag, exclusion and path filters
                value:
                  mode: AND
                  predicates:
                    - type: tag
                      value: sunset
                    - type: tag
                      value: blurry
                      exclude: true
                    - type: path
                      value: /2024/
                    - type: orientation
                      value: landscape
                      join: OR
              similarBlend:
                summary: Similarity with a composite blend, inside a tag
                value:
                  mode: AND
                  predicates:
                    - type: tag
                      value: beach
                    - type: similar
                      value: D:/photos/x.jpg
                      blendMode: blend
                      nodes:
                        - kind: text
                          value: at night
                          weight: 0.5
                        - kind: text
                          value: blurry
                          weight: 0.3
                          negative: true
                        - kind: image
                          value: D:/photos/y.jpg
                          weight: 0.7
      responses:
        '200':
          description: Matching items, streamed as one JSON array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaListItem'
              example:
                - path: D:/photos/a.jpg
                  mtimeMs: 0
                  elo: 1532.4
                  battles: 7
                  height: 1080
                  width: 1920
                  score: 0.83
                - path: D:/photos/b.jpg
                  mtimeMs: 0
                  height: 3000
                  width: 2000
                  score: 0.79
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            A similarity search failed (no embedding model, undecodable `clip` data URL, unknown
            blend node `kind`, no face in a `face` image), or the SQL query failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media:
    post:
      tags:
        - Media Library
      operationId: listMediaByTags
      summary: List items by tag intersection or union (predecessor of the predicate query).
      description: >
        With an empty or missing `tags` array, returns every item in the library ordered by path
        (tag fields are empty strings and `0`).


        With tags, `mode` (case-insensitive, default `EXCLUSIVE`) chooses the semantics:

        - `EXCLUSIVE`: items that carry every listed tag, one row per item, ordered by path. The tag
        fields come from one of the item's matching assignments.

        - Any other value: one row per matching tag *assignment*, ordered by path. An item carrying
        two of the tags, or one tag at several video timestamps, appears more than once.


        Only `POST` is handled. Any other method gets an empty `200` response with no body.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Tag labels to match exactly.
                mode:
                  type: string
                  description: >-
                    `EXCLUSIVE` (default) requires every tag; anything else (for example
                    `INCLUSIVE`) matches any tag.
            example:
              tags:
                - sunset
                - beach
              mode: EXCLUSIVE
      responses:
        '200':
          description: Matching items, streamed as one JSON array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaListItem'
              example:
                - path: D:/photos/a.jpg
                  mtimeMs: 1717171717000
                  elo: 1500
                  battles: 0
                  height: 1080
                  width: 1920
                  weight: 1
                  tagLabel: sunset
                  timeStamp: 0
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The query failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/search:
    post:
      tags:
        - Media Library
      operationId: searchMediaDescriptions
      summary: Substring search over item descriptions.
      description: >
        Returns every item whose `description` contains the given text (SQL `LIKE '%text%'`,
        case-insensitive for ASCII; `%` and `_` in the text act as wildcards). Ordered by path. An
        empty description matches every item that has a non-NULL description.


        `tags` and `filteringMode` are accepted in the body but ignored.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Text to look for in item descriptions.
                tags:
                  type: array
                  items:
                    type: string
                  description: Accepted for compatibility; ignored.
                filteringMode:
                  type: string
                  description: Accepted for compatibility; ignored.
            example:
              description: red car
      responses:
        '200':
          description: Matching items, streamed as one JSON array. Tag fields are empty strings and `0`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaListItem'
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The query failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/similar:
    get:
      tags:
        - Media Library
      operationId: findSimilarMedia
      summary: Items visually similar to a library item.
      description: >
        Ranks the library by cosine similarity to the item's embedding in the active embedding
        model. When the item has no stored vector it is embedded on the fly (and the vector is
        saved). The item itself is usually the top hit.


        The handler does not check the method.
      x-access: read
      parameters:
        - name: path
          in: query
          required: true
          description: Media path of the anchor item.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            Maximum hits. Values that are not a positive integer fall back to the default. No upper
            bound is enforced.
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        '200':
          description: Hits, best first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarHit'
              example:
                - path: D:/photos/x.jpg
                  score: 1
                - path: D:/photos/y.jpg
                  score: 0.91
        '400':
          description: '`path` is missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Embedding or search failed (for example no embedding model installed, or the file cannot
            be embedded).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/search/visual:
