          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/search/image:
    post:
      tags:
        - Media Library
      operationId: searchMediaByImage
      summary: Image-to-image search with an uploaded image.
      description: >
        The request body is the raw bytes of an image in any common format (no multipart, no JSON).
        Returns the 50 most similar items; the count is fixed.


        The handler does not check the method.
      x-access: read
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw image bytes, at most 32 MB.
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Up to 50 items, best first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMediaItem'
              example:
                - path: D:/photos/x.jpg
                  mtimeMs: 0
                  elo: 1500
                  battles: 2
                  height: 1080
                  width: 1920
                  score: 0.88
        '400':
          description: The body is empty or could not be read.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body is larger than 32 MB.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The image could not be embedded or the search failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/search/face:
    post:
      tags:
        - Media Library
      operationId: searchMediaByFace
      summary: Find media containing the person whose face is in an uploaded image.
      description: >
        The request body is the raw bytes of an image. Faces are detected in it and matched against
        stored face embeddings. `limit` counts *faces* searched; hits are then collapsed to one item
        per media path (best face wins), so the result can hold fewer items than `limit`.
      x-access: read
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Number of face hits to search. Non-positive or invalid values use the default; values
            above 500 are capped to 500.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw image bytes, at most 32 MB.
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Media items, best first, each with the best-matching face attached.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaceSearchItem'
              example:
                - path: D:/photos/x.jpg
                  mtimeMs: 0
                  height: 1080
                  width: 1920
                  score: 0.72
                  faceId: 4411
                  face:
                    x: 0.41
                    'y': 0.18
                    w: 0.12
                    h: 0.17
                    frameTs: 0
                    personId: 12
        '400':
          description: The body is empty or could not be read.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body is larger than 32 MB.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: No face was detected in the uploaded image.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Face detection or search failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/metadata:
    post:
      tags:
        - Media Library
      operationId: getMediaMetadata
      summary: Stored metadata for one item, plus any AI-generation text embedded in the file.
      description: >
        Reads the item's row (`width`, `height`, `size`, `description`, `transcript`, `hash`). A
        path with no row still answers `200` with the defaults. For local files the handler also
        extracts generator text chunks (for example a ComfyUI workflow or WebUI parameters) into
        `textChunks`.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/photos/x.png
      responses:
        '200':
          description: The item's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaMetadata'
              example:
                fileMetadata:
                  size: 2.41 MB
                  modified: ''
                  width: 1920
                  height: 1080
                hash: 9f2c1d0e
                description: A red car parked by the sea.
                textChunks:
                  parameters: 'a red car, sunset, Steps: 30'
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Anonymous caller and the path is outside every storage root and not a library row (or is
