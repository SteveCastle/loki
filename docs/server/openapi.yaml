      tags:
        - People and Faces
      operationId: curatePerson
      summary: Keep the listed faces, reject the rest.
      description: >-
        Whole-group review in one call: faces in `keepFaceIds` are locked as user assignments; every
        other face of the person is rejected (veto + cannot-links + unassign), with a permanent
        guarantee it never returns to this group. Broadcasts a `people-updated` event on `/stream`.
      x-access: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Person id (positive integer).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keepFaceIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Face ids to keep. An empty or missing list rejects every face of the person.
            example:
              keepFaceIds:
                - 4031
                - 4032
                - 4107
      responses:
        '200':
          description: Curated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  personId:
                    type: integer
                    format: int64
                  kept:
                    type: integer
                    description: Faces locked.
                  rejected:
                    type: integer
                    description: Faces rejected.
                required:
                  - personId
                  - kept
                  - rejected
              example:
                personId: 12
                kept: 3
                rejected: 2
        '400':
          description: >-
