      summary: Redraw where a still version's stitched seam still shows.
      description: |
        Queues a loki-dream inpaint of the band where the active still
        version's stitch seam still shows (its heal map), then merges only that
        band back; the result is a new version (`healed vN`). Needs a dream
        build: otherwise it answers 400. The version must be the active one and
        the layer stitched (`options.stitch` not false).
