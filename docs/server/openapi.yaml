        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: refinishSceneVersion
      summary: Redo a motion version's finish from the engine output.
      description: |
        Queues a `scene-lock` job over the version's raw `reshoot` output with
        the layer's current `lock` and `detail` options; the result arrives as a
        new version (`re-finished vN`). CPU only, no regeneration. No body.
