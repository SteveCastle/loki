            (loops and older versions cannot be re-finished).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene or layer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The layer already has 8 generations in flight.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/heal:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
