                  personId:
                    type: integer
                    format: int64
                  faces:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonReviewFace'
                required:
                  - personId
                  - faces
              example:
                personId: 12
                faces:
                  - id: 5120
                    path: D:/photos/group.jpg
                    frameTs: 0
                    detScore: 0.71
                    assignedBy: auto
                    typicality: 0.18
                  - id: 4031
                    path: D:/photos/ada-01.jpg
                    frameTs: 0
                    detScore: 0.93
                    assignedBy: user
                    typicality: 0.82
