          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        '400':
          description: Invalid JSON or `path` missing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No library item has this path.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The update failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/rating:
    post:
      tags:
        - Media Library
      operationId: readOrSetMediaRating
      summary: Read or update an item's rating counters.
      description: >
        Only fields present in the body are written; a body with just `path` reads. The response
        always reflects the row after the update.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Media path.
                elo:
                  type: number
                  description: New Elo rating.
                views:
                  type: integer
                  description: New view count.
                wins:
                  type: integer
                  description: New win count.
                losses:
                  type: integer
                  description: New loss count.
            example:
              path: D:/photos/x.jpg
              views: 12
      responses:
        '200':
          description: The item's current rating columns. Each is `null` when unset.
          content:
            application/json:
              schema:
                type: object
                required:
                  - path
                  - elo
                  - views
                  - wins
                  - losses
                properties:
                  path:
                    type: string
                  elo:
                    type:
                      - number
                      - 'null'
                  views:
                    type:
                      - integer
                      - 'null'
                  wins:
                    type:
                      - integer
                      - 'null'
                  losses:
                    type:
                      - integer
                      - 'null'
              example:
                path: D:/photos/x.jpg
                elo: 1532.4
                views: 12
                wins: 4
                losses: 3
        '400':
          description: Invalid JSON or `path` missing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No library item has this path.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/battle:
    post:
      tags:
        - Media Library
      operationId: recordMediaBattle
      summary: Record a Battle Mode vote and update both Elo ratings.
      description: >
        The Elo math runs server side in one transaction, and the vote is appended to the battle
        log. Ratings start at 1500. The K-factor depends on how many battles the item has fought: 48
        under 10, 24 under 30, 12 after that. A win adds 1 to the winner's `wins` and the loser's
        `losses`; a draw changes neither. `battles` is reset from the battle-log count. A path with
        no library row gets one created.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - winnerPath
                - loserPath
              properties:
                winnerPath:
                  type: string
                  description: Path of the item that won.
                loserPath:
                  type: string
                  description: Path of the item that lost. Must differ from `winnerPath`.
                outcome:
                  type: number
                  enum:
                    - 1
                    - 0.5
                  default: 1
                  description: The winner's score. `1` is a win, `0.5` a draw.
            example:
              winnerPath: D:/photos/a.jpg
              loserPath: D:/photos/b.jpg
      responses:
        '200':
          description: The new ratings and battle counts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - winnerPath
                  - winnerElo
                  - winnerMatches
                  - loserPath
                  - loserElo
                  - loserMatches
                properties:
                  winnerPath:
                    type: string
                  winnerElo:
                    type: number
                    description: Winner's rating after the vote.
                  winnerMatches:
                    type: integer
                    description: Winner's battle count including this one.
                  loserPath:
                    type: string
                  loserElo:
                    type: number
                  loserMatches:
                    type: integer
              example:
                winnerPath: D:/photos/a.jpg
                winnerElo: 1524
                winnerMatches: 1
                loserPath: D:/photos/b.jpg
                loserElo: 1476
                loserMatches: 1
        '400':
          description: Invalid JSON, a path missing, both paths equal, or `outcome` not `1` or `0.5`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/delete:
    post:
      tags:
        - Media Library
      operationId: deleteMediaItem
      summary: Remove an item from the library (the file is not touched).
      description: >
        Erases every database reference to the path: the media row, tag assignments, embeddings,
        faces and their curation assertions (vetoes, cannot-links), person cover pointers, face-scan
        markers and battle-log rows, and evicts the path from the in-memory vector and face indexes.
        The file on disk is never deleted. Identical to `/api/media/forget`.


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/photos/x.jpg
      responses:
        '200':
          description: Rows removed per table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaEraseResult'
              example:
                path: D:/photos/x.jpg
                media: 1
                tags: 4
                embeddings: 2
                faces: 1
                battles: 3
        '400':
          description: Invalid JSON or `path` empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/forget:
    post:
      tags:
        - Media Library
      operationId: forgetMediaItem
      summary: Erase every database reference to a path (the file is not touched).
      description: >
        Same implementation and response as `/api/media/delete`; meant for media the viewer can no
        longer load (file gone or unreachable).


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/photos/missing.jpg
      responses:
        '200':
          description: Rows removed per table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaEraseResult'
        '400':
          description: Invalid JSON or `path` empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/move:
    post:
      tags:
        - Media Library
      operationId: moveMediaPath
      summary: Re-point every database reference after moving a file or folder on disk.
      description: >
        The bookkeeping half of a move: the filesystem is never touched, the caller has already
        moved the file(s). All references are rewritten in one transaction: `media.path`,
        `media_tag_by_category.media_path`, `media_embedding.media_path`, `face.media_path`,
        `face_scan.media_path`, `battle.winner_path`, `battle.loser_path`,
        `duplicate_member.media_path` and `duplicate_group.anchor_path`. Tables that do not exist in
        the library are skipped (their key is absent from `rows`).


        `from` and `to` are trimmed of whitespace and trailing `/` or `\`. With `prefix`, both are
        folders and every item under `from` moves under `to` keeping its sub-path. Matching is
        segment-aligned (`/a/foo` never drags `/a/foobar`) and case-sensitive.


        With `dryRun` the whole move runs and is rolled back, so the counts are exactly what a real
        run would change.


        If any destination path already belongs to another library item that is not itself moving,
        nothing changes and the answer is `409`. This check also applies to dry runs.


        After a real move the vector and face indexes are re-keyed for the paths listed in `paths`.
        When `truncated` is true only the first 100 were re-keyed; rebuild the index to refresh the
        rest.


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  description: Current path (or folder with `prefix`). Required.
                to:
                  type: string
                  description: >-
                    New path (or folder with `prefix`). Required, must differ from `from`, and with
                    `prefix` must not be inside `from`.
                prefix:
                  type: boolean
                  default: false
                  description: Treat `from` and `to` as folders and move the whole subtree.
                dryRun:
                  type: boolean
                  default: false
                  description: Compute the result and roll back.
            example:
              from: C:/pics/2023
              to: D:/archive/2023
              prefix: true
              dryRun: true
      responses:
        '200':
          description: What the move changed (or would change, for a dry run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaMoveResult'
              example:
                from: C:/pics/2023
                to: D:/archive/2023
                prefix: true
                dryRun: true
                items: 2
                rows:
                  media.path: 2
                  media_tag_by_category.media_path: 9
                  media_embedding.media_path: 2
                  face.media_path: 1
                  face_scan.media_path: 2
                  battle.winner_path: 0
                  battle.loser_path: 0
                  duplicate_member.media_path: 0
                  duplicate_group.anchor_path: 0
                total: 16
                paths:
                  - from: C:/pics/2023/a.jpg
                    to: D:/archive/2023/a.jpg
                  - from: C:/pics/2023/b.jpg
                    to: D:/archive/2023/b.jpg
        '400':
          description: >-
            Invalid JSON, `from` or `to` empty, both the same, `to` inside `from` with `prefix`, or
            a database error during the move.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            One or more destination paths already belong to another library item. Nothing was
            changed. Unlike the other errors, this body is sent as `application/json`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - conflicts
                properties:
                  error:
                    type: string
                    description: Human-readable message naming the first conflicts.
                  conflicts:
                    type: array
                    items:
                      type: string
                    description: Every destination path that is already taken.
              example:
                error: 'destination already exists in the library: D:/archive/2023/a.jpg'
                conflicts:
                  - D:/archive/2023/a.jpg
  /api/media/merge-metadata:
    post:
      tags:
        - Media Library
      operationId: mergeMediaMetadata
      summary: Merge several items into the first one, then delete the others.
      description: >
        The first non-blank path is the target; every other distinct path is a source. The merge is
        additive: tag rows and per-model embedding rows the target lacks are copied in (the target's
        own rows win), an empty transcript is filled from the first source that has one, and that
        source's `.vtt` sidecar is moved next to the target. The sources are then **deleted from
        disk** (plus leftover sidecars) and every database reference to them is erased. `s3://`
        sources and files that fail to delete keep their file and rows and are listed in `failed`.


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paths
              properties:
                paths:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  description: >-
                    Target first, then the sources. Blank entries and repeats of the target are
                    skipped.
            example:
              paths:
                - D:/photos/keep.jpg
                - D:/photos/dupe1.jpg
                - D:/photos/dupe2.jpg
      responses:
        '200':
          description: What the merge changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaMergeResult'
              example:
                target: D:/photos/keep.jpg
                sources:
                  - D:/photos/dupe1.jpg
                  - D:/photos/dupe2.jpg
                tags: 3
                embeddings: 0
                transcript: false
                transcriptFile: ''
                deleted:
                  - D:/photos/dupe1.jpg
                  - D:/photos/dupe2.jpg
                failed: null
                facesRemoved: 0
        '400':
          description: Invalid JSON, or no target plus at least one source.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: A database error before anything was deleted.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/assign-person:
    post:
      tags:
        - Media Library
      operationId: assignMediaToPerson
      summary: Assign a face in a media item to a person, or found a new person from it.
      description: >
        Assigns **one** face of the item: when the item has several faces, the one most similar to
        the person's existing faces wins; for a person with no faces yet (always the case with
        `newPerson`) the largest face wins. The item is face-scanned on the fly when it has no
        stored faces yet.


        With `newPerson: true` a new person is created (named `name`, or the next automatic
        "Unknown" name) only after a face has been found, so a face-less item never leaves an empty
        group behind; `setCover` is then implied. The assignment is recorded as a user action.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Media path. Required.
                personId:
                  type: integer
                  description: Existing person id. Required unless `newPerson` is true.
                setCover:
                  type: boolean
                  default: false
                  description: Also make the chosen face the person's cover crop.
                newPerson:
                  type: boolean
                  default: false
                  description: Create a new person seeded by this item's face.
                name:
                  type: string
                  description: Name for the new person (with `newPerson`). Blank picks an automatic name.
            examples:
              existing:
                value:
                  path: D:/photos/x.jpg
                  personId: 12
                  setCover: true
              newPerson:
                value:
                  path: D:/photos/x.jpg
                  newPerson: true
                  name: Alex
      responses:
        '200':
          description: The face that was assigned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - faceId
                  - personId
                  - faces
                  - setCover
                  - created
                  - name
                properties:
                  faceId:
                    type: integer
                    description: Id of the assigned face.
                  personId:
                    type: integer
                    description: The person it was assigned to (the new id with `newPerson`).
                  faces:
                    type: integer
                    description: Number of faces found in the item.
                  setCover:
                    type: boolean
                    description: Whether the face became the cover.
                  created:
                    type: boolean
                    description: True when a new person was created.
                  name:
                    type: string
                    description: The new person's name; empty when assigning to an existing person.
              example:
                faceId: 4411
                personId: 31
                faces: 2
                setCover: true
                created: true
                name: Alex
        '400':
          description: >-
            Invalid JSON, `path` empty, or neither a positive `personId` nor `newPerson`; also
            person-creation or assignment errors whose message says something is already so,
            required, or must be.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`personId` does not exist.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: No face was detected in the media item.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Face scan or database failure.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/reject-person:
    post:
      tags:
        - Media Library
      operationId: rejectPersonFromMedia
      summary: Reject every face of a person on one media item.
      description: >
        The inverse of assign-person: each of the person's faces on the item gets a permanent veto
        plus cannot-links and is unassigned, so the group actually loses those faces. Used by the
        Electron viewer when a person tag is removed from an item. The person is identified by
        `personId`, or by display `name` when `personId` is missing or not positive.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Media path. Required.
                personId:
                  type: integer
                  description: Person id. Required unless `name` is given.
                name:
                  type: string
                  description: Person display name, used when `personId` is not given.
            example:
              path: D:/photos/x.jpg
              personId: 12
      responses:
        '200':
          description: The faces that were rejected (possibly none).
          content:
            application/json:
              schema:
                type: object
                required:
                  - personId
                  - rejectedFaceIds
                properties:
                  personId:
                    type: integer
                  rejectedFaceIds:
                    type:
                      - array
                      - 'null'
                    items:
                      type: integer
                    description: Ids of the rejected faces. May be `null` when nothing was rejected.
              example:
                personId: 12
                rejectedFaceIds:
                  - 4411
        '400':
          description: Invalid JSON, `path` empty, or neither `personId` nor `name`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No person has the given `name`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/thumbnails:
    post:
      tags:
        - Media Library
      operationId: listMediaThumbnails
      summary: Recorded thumbnail files of one item.
      description: >
        Looks at the item's `thumbnail_path_600` and `thumbnail_path_1200` columns and reports each
        one that is set, with whether the file exists on local disk and its size. The 100 px cache
        is not reported. `s3://` thumbnails always report `exists: false`.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/photos/x.jpg
      responses:
        '200':
          description: Zero, one or two entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - cache
                    - path
                    - exists
                    - size
                  properties:
                    cache:
                      type: string
                      enum:
                        - thumbnail_path_600
                        - thumbnail_path_1200
                    path:
                      type: string
                      description: Thumbnail file path on the server.
                    exists:
                      type: boolean
                      description: Whether the file is on local disk.
                    size:
                      type: integer
                      description: File size in bytes; `0` when missing.
              example:
                - cache: thumbnail_path_600
                  path: C:\ProgramData\Lowkey Media Server\thumbnail_path_600\3b5d...e1
                  exists: true
                  size: 48211
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/thumbnails/regenerate:
    post:
      tags:
        - Media Library
      operationId: regenerateMediaThumbnail
      summary: Delete and regenerate one thumbnail of a local item.
      description: >
        Removes the cached file at the deterministic cache path, generates a new one, stores it in
        the item's column and returns its path. Only local media is supported (there is no S3
        branch). An unrecognised `cache` is treated as `thumbnail_path_600`.


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Media path.
                cache:
                  $ref: '#/components/schemas/ThumbnailCache'
                timeStamp:
                  type: number
                  default: 0
                  description: Video frame time in seconds.
            example:
              path: D:/videos/clip.mp4
              cache: thumbnail_path_1200
              timeStamp: 30
      responses:
        '200':
          description: The new thumbnail's path on the server, as a JSON string.
          content:
            application/json:
              schema:
                type: string
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: No database configured, or generation failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /media/file:
    get:
      tags:
        - File Serving
      operationId: getMediaFile
      summary: Serve a media file.
      description: >
        - Local files stream through `http.ServeFile` with `Range` support, no size limit,
        `Content-Type` from the extension (unknown extensions are `application/octet-stream`),
        `Content-Length`, `Cache-Control: public, max-age=3600` and an `ETag` of the form
        `"<name>-<size>-<mtime>"`. A matching `If-None-Match` answers `304`.

        - HEIC/HEIF files, which browsers cannot decode, are served as a cached JPEG rendering
        instead.

        - `s3://` paths answer `302` to a presigned URL.

        - `http(s)://` paths (admins only) are proxied through an SSRF-safe client: only the remote
        `Content-Type`, `Content-Length`, `Cache-Control` and `ETag` are copied (default
        `Cache-Control: public, max-age=1800`), and bodies are cut at 100 MB.
      x-access: read
      parameters:
        - name: path
          in: query
          required: true
          description: >-
            Absolute local path, `s3://` URL, or `http(s)://` URL. Percent-encode it; `+` is not
            decoded as a space.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: Byte range, for local files.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: An `ETag` from a previous response.
          schema:
            type: string
      responses:
        '200':
          description: The file bytes.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a `Range` request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: '`s3://` path: redirect to a presigned URL.'
          headers:
            Location:
              schema:
                type: string
        '304':
          description: '`If-None-Match` matched the current `ETag`.'
        '400':
          description: >-
            `path` missing, empty or badly encoded, a local path that is not absolute, a directory,
            or an invalid remote URL.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: >-
            Anonymous caller and the path is outside every storage root and not a library row, or is
            an `http(s)://` URL.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Local file not found, or no storage backend for the `s3://` path.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not `GET`.
          content:
            text/plain:
              schema:
                type: string
        '413':
          description: Remote (`http(s)://`) file larger than 100 MB according to its `Content-Length`.
          content:
            text/plain:
              schema:
                type: string
        '415':
          description: HEIC conversion failed.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The file could not be stat'ed, or a presigned URL could not be generated.
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: >-
            The remote URL could not be fetched. A remote non-200 status is passed through with a
            plain-text body.
          content:
            text/plain:
              schema:
                type: string
  /media/thumbnail:
    get:
      tags:
        - File Serving
      operationId: getMediaThumbnail
      summary: Serve a thumbnail image, generating it on first request.
      description: >
        Lookup order: a thumbnail recorded in the item's `cache` column (an existing `s3://` object
        is answered with a `302` to a presigned URL), then for `s3://` media generation into the
        bucket followed by a `302`, then for local media the recorded file, the deterministic cache
        path, and finally generation (throttled). Generated paths are stored on the item's row.


        Local thumbnails are sent with `Cache-Control: public, max-age=86400, immutable` and an
        `ETag` of `"<file name>-<size>"`; a matching `If-None-Match` answers `304`, and `Range` is
        supported. Video thumbnails are short `.mp4` clips (`video/mp4`). Image thumbnails are PNG
        data in extensionless files, so they are labelled `application/octet-stream`.
      x-access: read
      parameters:
        - name: path
          in: query
          required: true
          description: >-
            Media path (absolute local path or `s3://` URL). Read from the raw query string like
            `/media/file`.
          schema:
            type: string
        - name: cache
          in: query
          required: false
          description: Thumbnail size column. Any other value means `thumbnail_path_600`.
          schema:
            $ref: '#/components/schemas/ThumbnailCache'
        - name: ts
          in: query
          required: false
          description: >-
            Video frame time in seconds. Invalid values are ignored. A non-zero value gets its own
            cache file.
          schema:
            type: number
            default: 0
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thumbnail bytes.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '302':
          description: S3 media or an S3 thumbnail; redirect to a presigned URL.
          headers:
            Location:
              schema:
                type: string
        '304':
          description: '`If-None-Match` matched.'
        '400':
          description: '`path` missing, empty or badly encoded, or an `s3://` path whose root is not S3 storage.'
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: >-
            Anonymous caller and the local path is outside every configured storage root. (Unlike
            `/media/file`, a library row outside the roots is not enough.)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Source file not found, or no storage backend for the `s3://` path.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not `GET`.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: No database configured, generation failed, or a presigned URL could not be generated.
          content:
            text/plain:
              schema:
                type: string
  /media/hls:
    get:
      tags:
        - File Serving
      operationId: getHlsStatus
      summary: HLS rendition status for a video, starting the transcode if needed.
      description: >
        Renditions are a stream-copy (no re-encode) VOD HLS stream with 6-second MPEG-TS segments,
        cached under the server's data directory keyed by the SHA-256 of `path`. One ffmpeg runs at
        a time; other requests queue.


        Without `check=true`, a video that is neither cached nor in progress starts generating and
        the response is `processing` with the probed `duration`. Poll until `ready`, then load `url`
        in an HLS player. A failed generation is reported once as `error` and its partial output
        removed; the next request starts again.


        Responses carry `Access-Control-Allow-Origin: *`.
      x-access: read
      parameters:
        - name: path
          in: query
          required: true
          description: Media path of the video.
          schema:
            type: string
        - name: check
          in: query
          required: false
          description: '`true` reports `idle` instead of starting a transcode when nothing is cached.'
          schema:
            type: string
            enum:
              - 'true'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HlsStatus'
              examples:
                ready:
                  value:
                    status: ready
                    url: /media/hls/6f1c...9a/master.m3u8
                processing:
                  value:
                    status: processing
                    progress: 0.45
                started:
                  value:
                    status: processing
                    duration: 120.5
                idle:
                  value:
                    status: idle
        '400':
          description: '`path` is missing.'
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Anonymous caller and the path is outside every configured storage root.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than `GET` or `DELETE`.
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - File Serving
      operationId: clearHlsCache
      summary: Delete cached HLS renditions.
      description: >
        With `path`, removes that video's renditions; without it, removes the entire HLS cache. The
        route is `read`, but this method always needs admin credentials when Allow Public Access is
        on (anonymous callers get `401` JSON).
      x-access: admin
      parameters:
        - name: path
          in: query
          required: false
          description: Media path whose renditions to delete. Omit to clear everything.
          schema:
            type: string
      responses:
        '204':
          description: Deleted (also when nothing was cached).
        '401':
          description: Allow Public Access is on and the caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
  /media/hls/{hash}/{file}:
    get:
      tags:
        - File Serving
      operationId: getHlsMasterPlaylist
      summary: Serve a top-level HLS playlist from the cache.
      description: >
        Served by the `/media/hls/` prefix route. `{hash}` is the cache key from the `url` returned
        by `GET /media/hls`. The file must match `master.m3u8` or `stream.m3u8` at this level
        (segment names pass validation too, but are served with the playlist content type). Supports
        `Range`; carries `Access-Control-Allow-Origin: *`.
      x-access: read
      parameters:
        - name: hash
          in: path
          required: true
          description: Lowercase hex cache key.
          schema:
            type: string
            pattern: ^[0-9a-f]+$
        - name: file
          in: path
          required: true
          description: '`master.m3u8` or `stream.m3u8`.'
          schema:
            type: string
            pattern: ^(master|stream)\.m3u8$|^segment_\d{3,}\.ts$
      responses:
        '200':
          description: The playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '400':
          description: Invalid hash or file name, or a path with the wrong number of segments.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not in the cache.
          content:
            text/plain:
              schema:
                type: string
  /media/hls/{hash}/{preset}/{file}:
    get:
      tags:
        - File Serving
      operationId: getHlsRenditionFile
      summary: Serve a rendition playlist or segment from the cache.
      description: >
        Served by the `/media/hls/` prefix route. Normally reached through the master playlist. The
        server currently only generates the `passthrough` preset. `.ts` files are sent as
        `video/MP2T`, playlists as `application/vnd.apple.mpegurl`. Supports `Range`; carries
        `Access-Control-Allow-Origin: *`.
      x-access: read
      parameters:
        - name: hash
          in: path
          required: true
          description: Lowercase hex cache key.
          schema:
            type: string
            pattern: ^[0-9a-f]+$
        - name: preset
          in: path
          required: true
          description: Rendition name.
          schema:
            type: string
            enum:
              - passthrough
              - 480p
              - 720p
              - 1080p
        - name: file
          in: path
          required: true
          description: '`stream.m3u8` or `segment_NNN.ts` (three or more digits).'
          schema:
            type: string
            pattern: ^(master|stream)\.m3u8$|^segment_\d{3,}\.ts$
      responses:
        '200':
          description: Playlist or segment bytes.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/MP2T:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid hash, preset or file name.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not in the cache.
          content:
            text/plain:
              schema:
                type: string
  /media/facecrop:
    get:
      tags:
        - File Serving
      operationId: getFaceCrop
      summary: JPEG crop of one detected face.
      description: >
        Decodes the face's source media (for a video, the same midpoint frame the face scan used;
        the stored 600 px thumbnail is a last resort), cuts out the face box with a 35% margin, and
        scales it so the longer edge is `size`. Sent with `Cache-Control: private, max-age=86400` (a
        face id's crop never changes; rescans mint new ids). JPEG quality 88.
      x-access: read
      parameters:
        - name: id
          in: query
          required: true
          description: Face id.
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: Longer edge in pixels. Values outside 32 to 1024, or not a number, use the default.
          schema:
            type: integer
            default: 160
            minimum: 32
            maximum: 1024
      responses:
        '200':
          description: The crop.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: '`id` missing or not an integer.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Anonymous caller and the face's media is outside every storage root and not a library
            row.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No face with this id, or its media (and thumbnail) cannot be decoded.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: The method is not `GET`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The database failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy:
    get:
      tags:
        - Taxonomy
      operationId: getTaxonomy
      summary: Every category with all of its tags.
      description: >
        Returns an **object keyed by category label** (not an array), in the same shape as the
        desktop app's taxonomy. Keys are inserted in category weight order, and each category's tags
        are ordered by tag weight. On large libraries this is a big payload; the web client loads
        `/api/taxonomy/categories` and then `/api/taxonomy/tags?category=` per category instead. The
        method is not checked.
      x-access: read
      responses:
        '200':
          description: Map of category label to category.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TaxonomyCategory'
              example:
                People:
                  label: People
                  weight: 0
                  tagViewMode: card
                  tags:
                    - label: Alice
                      category: People
                      weight: 0
                    - label: Bob
                      category: People
                      weight: 1
                Places:
                  label: Places
                  weight: 1
                  tagViewMode: list
                  tags: []
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy/categories:
    get:
      tags:
        - Taxonomy
      operationId: listCategories
      summary: The category list, without tags.
      description: >-
        Ordered by weight. Pairs with `/api/taxonomy/tags?category=` so a client can load tags one
        category at a time. The method is not checked.
      x-access: read
      responses:
        '200':
          description: Categories in weight order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
              example:
                - label: People
                  weight: 0
                  description: ''
                  tagViewMode: card
                  tagGrouping: 'on'
                - label: Suggested
                  weight: 5
                  description: Autotagger output
                  tagViewMode: list
                  tagGrouping: 'off'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy/tags:
    get:
      tags:
        - Taxonomy
      operationId: listTaxonomyTags
      summary: Tags in one category, or every tag.
      description: >
        With `category`, returns that category's tags ordered by weight, each with its `group`.
        Without it, returns every tag in the library ordered by category then weight, in the thin
        shape without `group` (this is the search index on first focus and can be hundreds of
        thousands of rows). `excludeCategory` applies only to the all-tags form. The method is not
        checked.
      x-access: read
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Return only this category's tags (adds `group` to each row).
        - name: excludeCategory
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated category labels to leave out of the all-tags list (the command palette
            passes `Suggested`). Tags with no category are always included. Ignored when `category`
            is set.
      responses:
        '200':
          description: Tag rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyTag'
              example:
                - label: Alice
                  category: People
                  weight: 0
                  group: Family
                - label: Bob
                  category: People
                  weight: 1
                  group: null
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy/tag:
    get:
      tags:
        - Taxonomy
      operationId: getTag
      summary: Full detail for a single tag.
      description: >-
        Includes the description, preview thumbnail and group that the bulk tag lists leave out. The
        method is not checked.
      x-access: read
      parameters:
        - name: label
          in: query
          required: true
          schema:
            type: string
          description: Tag label.
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDetail'
              example:
                label: Alice
                category: People
                weight: 0
                description: My sister
                thumbnail_path_600: D:\Library\.thumbnails\abc_600.webp
                group: Family
        '400':
          description: '`label` missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No tag with that label.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy/category-count:
    get:
      tags:
        - Taxonomy
      operationId: getCategoryMediaCount
      summary: Number of distinct media items tagged in a category.
      description: >-
        Returns a **bare JSON integer**. Counting the huge autotagger category exactly can take tens
        of seconds, so pass `cap` when an approximate "at least N" is enough. Database errors are
        not reported (the count is `0`). The method is not checked.
      x-access: read
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Category label. Missing or unknown yields `0`.
        - name: cap
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Stop counting at this many items. Non-numeric or non-positive values count exactly.
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                type: integer
              example: 1342
  /api/tags/list:
    get:
      tags:
        - Taxonomy
      operationId: listTagsWithCounts
      summary: Every tag with its usage count.
      description: >-
        Ordered by category label then tag label. `media_count` counts distinct media paths carrying
        the tag (including paths whose media row no longer exists). Rows that fail to scan are
        skipped.
      x-access: read
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Only this category's tags.
      responses:
        '200':
          description: Tags with counts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
              example:
                tags:
                  - label: Alice
                    category: People
                    weight: 0
                    media_count: 212
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/count:
    post:
      tags:
        - Taxonomy
      operationId: countTagMedia
      summary: Number of distinct media items carrying a tag.
      description: The method is not checked. Database errors are not reported (the count is `0`).
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelBody'
            example:
              label: Alice
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
              example:
                count: 212
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/preview:
    post:
      tags:
        - Taxonomy
      operationId: getTagPreview
      summary: The tag's preview thumbnail path.
      description: >-
        Returns a **bare JSON string** (the stored `thumbnail_path_600`) or `null` when the tag has
        no preview or does not exist. Fetch the image through the media endpoints. The method is not
        checked.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelBody'
            example:
              label: Alice
      responses:
        '200':
          description: Thumbnail path or null.
          content:
            application/json:
              schema:
                type:
                  - string
                  - 'null'
              example: D:\Library\.thumbnails\abc_600.webp
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags:
    post:
      tags:
        - Taxonomy
      operationId: createTag
      summary: Create a tag.
      description: >-
        Inserts the tag as given; no field is validated. A label that already exists fails with
        `500` (unique constraint).
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: New tag label.
                categoryLabel:
                  type: string
                  description: Category to file it under.
                weight:
                  type: number
                  description: Sort weight within the category. Default `0`.
            example:
              label: Alice
              categoryLabel: People
              weight: 3
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                properties:
                  label:
                    type: string
              example:
                label: Alice
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Insert failed (for example the label already exists).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Taxonomy
      operationId: deleteTag
      summary: Delete a tag and all of its assignments.
      description: >-
        When `categoryLabel` is given and the tag lives in a different category the request is
        refused with `409`, so a client working from a stale view cannot delete a tag it thinks
        lives elsewhere. Deleting a tag that does not exist succeeds with `assignments` `0`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Tag to delete.
                categoryLabel:
                  type: string
                  description: Optional guard; must match the tag's category.
            example:
              label: Alice
              categoryLabel: People
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                  - assignments
                properties:
                  label:
                    type: string
                  assignments:
                    type: integer
                    description: Number of assignment rows removed.
              example:
                label: Alice
                assignments: 212
        '400':
          description: Body is not valid JSON or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The tag belongs to a different category than `categoryLabel`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/rename:
    put:
      tags:
        - Taxonomy
      operationId: renameTag
      summary: Rename a tag.
      description: Renames the tag and its assignments in one transaction. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBody'
            example:
              label: Alice
              newLabel: Alice Smith
      responses:
        '200':
          description: Renamed (also when no tag matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`newLabel` is already taken; nothing changed.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/move:
    put:
      tags:
        - Taxonomy
      operationId: moveTag
      summary: Move a tag to another category.
      description: >-
        The tag's assignments move with it, and the tag leaves its tag group (groups belong to a
        category). The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Tag to move.
                categoryLabel:
                  type: string
                  description: Destination category.
            example:
              label: Alice
              categoryLabel: Family
      responses:
        '200':
          description: Moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Unique-constraint conflict; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database error (for example a destination category that does not exist); nothing
            changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/order:
    put:
      tags:
        - Taxonomy
      operationId: orderTags
      summary: Set tag order by assigning ascending weights.
      description: >-
        The tag at index `i` of `labels` gets weight `i`. Tags not listed keep their weight. The
        method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels:
                  type: array
                  items:
                    type: string
                  description: Tag labels in the desired order.
            example:
              labels:
                - Bob
                - Alice
                - Carol
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/weight:
    put:
      tags:
        - Taxonomy
      operationId: setTagWeight
      summary: Set one tag's sort weight.
      description: Database errors are not reported. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightBody'
            example:
              label: Alice
              weight: 2.5
      responses:
        '200':
          description: Updated (also when no tag matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/timestamp:
    put:
      tags:
        - Taxonomy
      operationId: moveTagTimestamp
      summary: Move a timestamped assignment to a new time.
      description: >-
        Updates the assignment of `tagLabel` on `mediaPath` whose time is exactly `oldTimestamp`.
        Database errors are not reported.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaPath:
                  type: string
                tagLabel:
                  type: string
                oldTimestamp:
                  type: number
                  description: Current time in seconds.
                newTimestamp:
                  type: number
                  description: New time in seconds.
            example:
              mediaPath: D:\Videos\clip.mp4
              tagLabel: Alice
              oldTimestamp: 12.5
              newTimestamp: 14
      responses:
        '200':
          description: Updated (also when nothing matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Taxonomy
      operationId: removeTagTimestamp
      summary: Remove the timestamp from a timestamped assignment.
      description: >-
        If the item already has an untimed (`0`) assignment of the tag, the timestamped one is
        deleted. Otherwise the timestamped assignment is turned into the untimed one (its time
        becomes `0`), so the item stays tagged. Database errors are not reported.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaPath:
                  type: string
                tagLabel:
                  type: string
                timestamp:
                  type: number
                  description: Time in seconds of the assignment to change.
            example:
              mediaPath: D:\Videos\clip.mp4
              tagLabel: Alice
              timestamp: 12.5
      responses:
        '200':
          description: Done (also when nothing matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    post:
      tags:
        - Taxonomy
      operationId: createCategory
      summary: Create a category.
      description: No field is validated. A label that already exists fails with `500` (unique constraint).
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: New category label.
                weight:
                  type: number
                  description: Sort weight. Default `0`.
            example:
              label: Places
              weight: 4
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                properties:
                  label:
                    type: string
              example:
                label: Places
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Insert failed (for example the label already exists).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Taxonomy
      operationId: deleteCategory
      summary: Delete a category with its tags, tag groups and their assignments.
      description: >
        Removes, in one transaction, the assignments of every tag filed under the category (plus
        leftover assignments labelled with the category whose tag no longer exists, but never
        assignments of a tag that now lives in another category), the tags, the category's tag
        groups and the category itself. Responds with what was removed, counted inside the same
        transaction; `GET /api/categories/impact` returns the same numbers without deleting.
        Deleting a category that does not exist succeeds with `exists: false` and zero counts.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Category to delete.
            example:
              label: Suggested
      responses:
        '200':
          description: Deleted; what was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImpact'
              example:
                label: Suggested
                exists: true
                tags: 1800
                groups: 0
                assignments: 92000
                media: 41000
        '400':
          description: Body is not valid JSON or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Unique-constraint conflict; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories/impact:
    get:
      tags:
        - Taxonomy
      operationId: getCategoryDeleteImpact
      summary: What deleting a category would remove, without removing it.
      description: Same counts `DELETE /api/categories` returns. The method is not checked.
      x-access: read
      parameters:
        - name: label
          in: query
          required: true
          schema:
            type: string
          description: Category label.
      responses:
        '200':
          description: Impact counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImpact'
              example:
                label: Suggested
                exists: true
                tags: 1800
                groups: 0
                assignments: 92000
                media: 41000
        '400':
          description: '`label` missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories/rename:
    put:
      tags:
        - Taxonomy
      operationId: renameCategory
      summary: Rename a category.
      description: >-
        Renames the category and re-points its tags, tag groups and assignments in one transaction.
        The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBody'
            example:
              label: Places
              newLabel: Locations
      responses:
        '200':
          description: Renamed (also when no category matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`newLabel` is already taken; nothing changed.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories/tag-view-mode:
    put:
      tags:
        - Taxonomy
      operationId: setCategoryTagViewMode
      summary: Set how the viewer lists a category's tags.
      description: >-
        `mode` is stored as given (the viewer uses `card` and `list`; an unset mode reads back as
        `card`). The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Category label.
                mode:
                  type: string
                  description: View mode, normally `card` or `list`.
            example:
              label: People
              mode: list
      responses:
        '200':
          description: Updated (also when no category matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/assignments:
    post:
      tags:
        - Taxonomy
      operationId: createAssignments
      summary: Tag one or many media items.
      description: >
        - `mediaPaths` takes precedence; `mediaPath` is used only when `mediaPaths` is empty.

        - The assignment is always filed under the tag's own category. Naming a different category
        than the tag's is a `409`.

        - A tag that does not exist yet is created at the end of `categoryLabel`, which must name an
        existing category (`400` otherwise, or when `categoryLabel` is omitted).

        - Existing identical assignments (same path, tag and timestamp) are left alone. New ones get
        ascending weights after the tag's current assignment count.

        - With `applyTagPreview`, the first item's 600px thumbnail (generated if needed) becomes the
        tag's preview image. A thumbnail failure is only logged.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tagLabel
              properties:
                mediaPaths:
                  type: array
                  items:
                    type: string
                  description: Items to tag. One of `mediaPaths` or `mediaPath` is required.
                mediaPath:
                  type: string
                  description: Single item to tag, used when `mediaPaths` is empty.
                tagLabel:
                  type: string
                  description: Tag to assign.
                categoryLabel:
                  type: string
                  description: The tag's category. Required only when the tag does not exist yet.
                timeStamp:
                  type: number
                  description: Video time in seconds. Default `0` (untimed).
                applyTagPreview:
                  type: boolean
                  description: Make the first item the tag's preview image. Default `false`.
            example:
              mediaPaths:
                - D:\Photos\a.jpg
                - D:\Photos\b.jpg
              tagLabel: Alice
              categoryLabel: People
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: >-
            Body is not valid JSON; no path or no `tagLabel`; the tag does not exist and
            `categoryLabel` is missing or names a category that does not exist.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The tag belongs to a different category than `categoryLabel`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing was assigned.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Taxonomy
      operationId: deleteAssignments
      summary: Remove a tag from one or many media items.
      description: >
        - `mediaPaths` takes precedence over `mediaPath`.

        - A non-zero `tag.time_stamp` removes only the assignment at that time. A `time_stamp` of
        `0` (or omitted) removes **every** assignment of the tag on the item, timed or not.

        - If the tag is a person's name and an item no longer carries it at any timestamp, that
        person's faces on the item are rejected (vetoed) so clustering cannot put them back.

        - Nothing is validated and database errors are not reported.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaPaths:
                  type: array
                  items:
                    type: string
                  description: Items to untag.
                mediaPath:
                  type: string
                  description: Single item, used when `mediaPaths` is empty.
                tag:
                  type: object
                  properties:
                    tag_label:
                      type: string
                      description: Tag to remove.
                    time_stamp:
                      type: number
                      description: >-
                        Time in seconds of the one assignment to remove; `0` removes all of the
                        tag's assignments on the item.
            example:
              mediaPath: D:\Videos\clip.mp4
              tag:
                tag_label: Alice
                time_stamp: 12.5
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/assignments/weight:
    put:
      tags:
        - Taxonomy
      operationId: setAssignmentWeight
      summary: Set the weight of an assignment.
      description: >-
        A non-zero `mediaTimeStamp` targets the assignment at that time; `0` or omitted updates
        every assignment of the tag on the item. Database errors are not reported. The method is not
        checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaPath:
                  type: string
                tagLabel:
                  type: string
                weight:
                  type: number
                mediaTimeStamp:
                  type: number
                  description: Time in seconds of the assignment; default `0`.
            example:
              mediaPath: D:\Photos\a.jpg
              tagLabel: Alice
              weight: 0
      responses:
        '200':
          description: Updated (also when nothing matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/taxonomy/groups:
    get:
      tags:
        - Tag Groups
      operationId: listTagGroups
      summary: A category's tag groups in order.
      description: >-
        Ordered by weight, then label. Without `category` the result is an empty array. The method
        is not checked.
      x-access: read
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Category label.
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagGroup'
              example:
                - label: Family
                  weight: 1
                  hidden: false
                  viewMode: null
                - label: Work
                  weight: 2
                  hidden: true
                  viewMode: list
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tag-groups:
    post:
      tags:
        - Tag Groups
      operationId: createTagGroup
      summary: Create a tag group.
      description: >-
        The group goes to the end of the category's list. Creating a group that already exists is a
        no-op that still succeeds.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagGroupRef'
            example:
              categoryLabel: People
              label: Family
      responses:
        '200':
          description: Created (or already present).
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                properties:
                  label:
                    type: string
              example:
                label: Family
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Tag Groups
      operationId: deleteTagGroup
      summary: Delete a tag group; its tags become ungrouped.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagGroupRef'
            example:
              categoryLabel: People
              label: Family
      responses:
        '200':
          description: Deleted (also when no group matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Unique-constraint conflict; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tag-groups/rename:
    put:
      tags:
        - Tag Groups
      operationId: renameTagGroup
      summary: Rename a tag group.
      description: >-
        Renames the group and re-points its tags in one transaction. An empty `newLabel`, or one
        equal to `label`, is a no-op that succeeds. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TagGroupRef'
                - type: object
                  properties:
                    newLabel:
                      type: string
                      description: New group label.
            example:
              categoryLabel: People
              label: Family
              newLabel: Relatives
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A group with `newLabel` already exists in the category; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tag-groups/weight:
    put:
      tags:
        - Tag Groups
      operationId: setTagGroupWeight
      summary: Set a tag group's sort weight.
      description: The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TagGroupRef'
                - type: object
                  properties:
                    weight:
                      type: number
                      description: Sort weight. Default `0`.
            example:
              categoryLabel: People
              label: Family
              weight: 0
      responses:
        '200':
          description: Updated (also when no group matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tag-groups/hidden:
    put:
      tags:
        - Tag Groups
      operationId: setTagGroupHidden
      summary: Hide or show a tag group.
      description: >-
        A hidden group is left out of the taxonomy panel unless the viewer chooses to show hidden
        groups. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TagGroupRef'
                - type: object
                  properties:
                    hidden:
                      type: boolean
                      description: Default `false` (shows the group).
            example:
              categoryLabel: People
              label: Work
              hidden: true
      responses:
        '200':
          description: Updated (also when no group matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tag-groups/view-mode:
    put:
      tags:
        - Tag Groups
      operationId: setTagGroupViewMode
      summary: Override the category's tag view mode for one group.
      description: >-
        `card` or `list` sets the override; any other value (normally `""`) clears it so the group
        follows the category. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TagGroupRef'
                - type: object
                  properties:
                    viewMode:
                      type: string
                      description: '`card`, `list`, or anything else to clear.'
            example:
              categoryLabel: People
              label: Work
              viewMode: list
      responses:
        '200':
          description: Updated (also when no group matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, or `categoryLabel` or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tags/group:
    put:
      tags:
        - Tag Groups
      operationId: setTagGroup
      summary: Put a tag in a group, or ungroup it.
      description: >-
        An empty `groupLabel` ungroups the tag. A group that does not yet exist in the tag's
        category is created at the end of its list, so a grouped tag always has a group to render
        under. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Tag label.
                groupLabel:
                  type: string
                  description: Group within the tag's category; empty ungroups.
            example:
              label: Alice
              groupLabel: Family
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON, `label` is empty, or the tag has no category to group under.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No tag with that label.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Unique-constraint conflict; nothing changed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories/tag-grouping:
    put:
      tags:
        - Tag Groups
      operationId: setCategoryTagGrouping
      summary: Turn tag grouping on or off for a category.
      description: >-
        `off` turns grouping off; any other value turns it on. Groups and group labels are kept
        either way. The method is not checked.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  description: Category label.
                mode:
                  type: string
                  description: '`off`, or anything else for on.'
            example:
              label: People
              mode: 'off'
      responses:
        '200':
          description: Updated (also when no category matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body is not valid JSON or `label` is empty.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/index/status:
    get:
      tags:
        - Embeddings Index
      operationId: getIndexStatus
      summary: In-memory index state and per-model storage statistics.
      x-access: admin
      responses:
        '200':
          description: Index status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatus'
              example:
                index:
                  installed: true
                  model: siglip2-base-patch16-224
                  vectors: 51234
                active_model: siglip2-base-patch16-224
                media_total: 52000
                missing_active_model: 766
                orphaned: 12
                embeddings:
                  - model: siglip2-base-patch16-224
                    count: 51234
                    dim: 768
                    bytes: 157390848
                total_count: 51234
                total_bytes: 157390848
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/index/models:
    get:
      tags:
        - Embeddings Index
      operationId: listEmbedModels
      summary: The embedding model registry.
      x-access: admin
      responses:
        '200':
          description: Models.
          content:
            application/json:
              schema:
                type: object
                required:
                  - models
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmbedModelInfo'
              example:
                models:
                  - id: siglip2-base-patch16-224
                    display_name: SigLIP 2 base (multimodal — image + text)
                    dim: 768
                    multimodal: true
                    active: true
                    indexed: true
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/index/rebuild:
    post:
      tags:
        - Embeddings Index
      operationId: rebuildIndex
      summary: Rebuild the in-memory index for the active model.
      description: >-
        Reloads every stored vector of the active embedding model into a fresh index and swaps it
        in. Blocks until done.
      x-access: admin
      responses:
        '200':
          description: Rebuilt.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - model
                  - vectors
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  model:
                    type: string
                    description: Active model id.
                  vectors:
                    type: integer
                    description: Vectors in the new index.
              example:
                status: ok
                model: siglip2-base-patch16-224
                vectors: 51234
        '405':
          description: Method other than POST.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Loading vectors failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/index/missing:
    get:
      tags:
        - Embeddings Index
      operationId: listMissingEmbeddings
      summary: Media items without an embedding for a model.
      x-access: admin
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Model id from the registry. Default the active model.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 100
          description: >-
            Paths to return, sorted by path. Values above 10000 are clamped; `0` returns only the
            count.
      responses:
        '200':
          description: Missing items.
          content:
            application/json:
              schema:
                type: object
                required:
                  - model
                  - total_missing
                  - paths
                properties:
                  model:
                    type: string
                  total_missing:
                    type: integer
                    description: All items lacking an embedding, regardless of `limit`.
                  paths:
                    type: array
                    items:
                      type: string
              example:
                model: siglip2-base-patch16-224
                total_missing: 766
                paths:
                  - D:\Photos\new1.jpg
        '400':
          description: Unknown `model`, or `limit` is not a non-negative integer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/embeddings:
    get:
      tags:
        - Embeddings Index
      operationId: getEmbeddings
      summary: Stored embedding rows for one media item.
      description: One row per model unless `model` is given. Rows that fail to scan are skipped.
      x-access: admin
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Media path.
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Only this model's row.
        - name: vector
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
          description: '`true` includes the decoded float vector in each row.'
      responses:
        '200':
          description: Embedding rows.
          content:
            application/json:
              schema:
                type: object
                required:
                  - path
                  - embeddings
                properties:
                  path:
                    type: string
                  embeddings:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredEmbeddingRow'
              example:
                path: D:\Photos\a.jpg
                embeddings:
                  - model: siglip2-base-patch16-224
                    dim: 768
                    created_at: 0
        '400':
          description: '`path` missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET or DELETE (checked after `path`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Embeddings Index
      operationId: deleteEmbeddings
      summary: Delete stored embedding rows for one media item.
      description: >-
        Deletes every model's row, or only `model`'s. The path is also dropped from the live index
        when the indexed model's vector is among those deleted.
      x-access: admin
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Media path.
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Only this model's row.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    description: Rows removed.
              example:
                deleted: 2
        '400':
          description: '`path` missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/embeddings/prune:
    post:
      tags:
        - Embeddings Index
      operationId: pruneEmbeddings
      summary: Delete embeddings whose media row is gone.
      description: >-
        Removes orphaned rows (for every model) left by out-of-band deletions and drops those paths
        from the live index.
      x-access: admin
      responses:
        '200':
          description: Pruned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pruned_rows
                  - pruned_paths
                properties:
                  pruned_rows:
                    type: integer
                    description: Embedding rows deleted.
                  pruned_paths:
                    type: integer
                    description: Distinct media paths they belonged to.
              example:
                pruned_rows: 24
                pruned_paths: 12
        '405':
          description: Method other than POST.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/embeddings/all:
    delete:
      tags:
        - Embeddings Index
      operationId: wipeAllEmbeddings
      summary: Delete every stored embedding, for all models.
      description: >-
        Also clears the in-memory index. Not undoable, though re-running the embed task rebuilds
        everything. Requires `confirm=true`.
      x-access: admin
      parameters:
        - name: confirm
          in: query
          required: true
          schema:
            type: string
            enum:
              - 'true'
          description: Must be `true`.
      responses:
        '200':
          description: Wiped.
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                properties:
                  deleted:
                    type: integer
                    description: Rows removed.
              example:
                deleted: 102468
        '400':
          description: '`confirm=true` missing.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than DELETE.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/people:
    get:
      tags:
        - People and Faces
      operationId: listPeople
      summary: List every person.
      description: >-
        Returns every person with face and media counts, most faces first. Always an array (empty
        when there are no people).
      x-access: read
      responses:
        '200':
          description: All people.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
              example:
                - id: 12
                  name: Ada
                  coverFaceId: 4031
                  faceCount: 87
                  mediaCount: 64
                  lockedCount: 20
                  createdAt: 1761900000
                  models: buffalo_l
                - id: 13
                  name: 'Unknown #4'
                  faceCount: 6
                  mediaCount: 6
                  lockedCount: 0
                  createdAt: 1761900500
                  models: buffalo_l
        '405':
          description: >-
            Method other than GET or POST. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database or internal failure. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - People and Faces
      operationId: createPerson
      summary: Create an empty named person.
      description: >-
        The route is registered read-level, so the write is re-checked: while Allow Public Access is
        on an admin credential is required (401 JSON otherwise). With public access off the normal
        login requirement already applies. Broadcasts a `people-updated` event on `/stream`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Person name; trimmed. Must be non-empty and not already used by another person.
              required:
                - name
            example:
              name: Ada
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    description: New person id.
                  name:
                    type: string
                    description: >-
                      The trimmed requested name. The stored name may carry a `_cluster` suffix when
                      a non-People tag already owns the plain name; this field does not reflect
                      that.
                required:
                  - id
                  - name
              example:
                id: 14
                name: Ada
        '400':
          description: >-
            Body is not valid JSON, the name is empty, or a person with that name already exists.
