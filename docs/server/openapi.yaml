              schema:
                type: string
  /job/{id}/cancel:
    post:
      tags:
        - Jobs
      operationId: cancelJob
      summary: Cancel a job.
      description: >
        Cancels a `pending`, `in_progress` or `paused` job: its context is cancelled and its state
        becomes `cancelled` immediately. A running task keeps its concurrency slots until it
        actually returns. Dependents of the job are not cancelled.


        The handler ignores the queue's result, so it answers `200` even when the id does not exist
        or the job is already in a terminal state (nothing changes in those cases).
      x-access: admin
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Always `Job cancelled successfully`.
          content:
            text/plain:
              schema:
                type: string
              example: Job cancelled successfully
        '401':
          description: Missing or invalid credential (API-style request).
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST (`Use POST`).
          content:
            text/plain:
              schema:
                type: string
  /job/{id}/pause:
    post:
      tags:
        - Jobs
      operationId: pauseJob
      summary: Pause a job.
      description: >
        A `pending` job becomes `paused` at once. For an `in_progress` job a pause is requested: the
        task finishes the item it is working on, then the job parks in `paused` with its progress
        kept. Tasks that do not poll for pause requests run to completion.
      x-access: admin
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Pause applied or requested (`Job pause requested`).
          content:
            text/plain:
              schema:
                type: string
              example: Job pause requested
        '400':
          description: Unknown id (`job not found`) or the job is not pending or in progress.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential (API-style request).
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST (`Use POST`).
          content:
            text/plain:
              schema:
                type: string
  /job/{id}/resume:
    post:
      tags:
        - Jobs
      operationId: resumeJob
      summary: Resume a paused job.
      description: >
        Returns a `paused` job to `pending` so it is claimed again. The task re-resolves its input
        and skips items it already processed.
      x-access: admin
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Job re-queued (`Job resumed`).
          content:
            text/plain:
              schema:
                type: string
              example: Job resumed
        '400':
          description: Unknown id (`job not found`) or the job is not paused.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential (API-style request).
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST (`Use POST`).
          content:
            text/plain:
              schema:
                type: string
  /job/{id}/copy:
