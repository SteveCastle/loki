      operationId: getSceneVersionMotionMap
      summary: Where a motion version moves.
      description: Returns a PNG whose alpha is motion, covering the version's region. No body.
      x-access: admin
      responses:
        '200':
          description: The motion map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneRegionMap'
        '400':
          description: '`n` not an integer, or the map could not be computed.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene, or `lid`/`n` is not a motion version.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/track:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
      - name: 'n'
        in: path
        required: true
        description: Zero-based index into the layer's `versions`; a non-integer answers 400 (`bad version`).
        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: trackSceneVersion
      summary: Queue the roto (tracked matte) of a motion version.
      description: |
        Queues a GPU-bucketed `scene-track` job (loki-segment) that writes one
        matte per clip frame plus an alpha webm for the stage; the export then
        multiplies the layer mask by the matte. Re-tracking cancels a pending or
        running track of the same version. The state appears on the version's
        `track`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompts:
                  type: array
                  description: >-
                    loki-segment `--prompts` entries, in clip pixels: `{obj, frame, text}`, `{obj,
                    frame, points: [[x, y, 1|0]]}` or `{obj, frame, box: [x, y, w, h]}`. Must be a
                    non-empty array.
                  items:
                    type: object
              required:
                - prompts
            example:
              prompts:
                - obj: 1
                  frame: 0
                  points:
                    - - 320
                      - 240
                      - 1
      responses:
        '200':
          description: The scene with the version's `track` pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: >-
            `n` not an integer, bad JSON, empty `prompts` (`pick what to track first`), or not a
            motion version.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene or layer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/matte:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
      - name: 'n'
        in: path
        required: true
        description: Zero-based index into the layer's `versions`; a non-integer answers 400 (`bad version`).
        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: getSceneVersionMatteFrame
      summary: One frame of a version's roto matte.
      x-access: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                frame:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Clip frame index (negative becomes 0).
      responses:
        '200':
          description: The matte frame as a mask piece, in clip pixels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mask:
                    type: string
                    description: PNG data URL (white, alpha = kept) covering `rect`.
                  rect:
                    $ref: '#/components/schemas/SceneRect'
                  width:
                    type: integer
                    description: Clip width in pixels.
                  height:
                    type: integer
                    description: Clip height in pixels.
                required:
                  - mask
                  - rect
                  - width
                  - height
        '400':
          description: >-
            `n` not an integer, the version has no completed roto (`vN has no roto yet`), or the
            frame file is missing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene, layer or version.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/untrack:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
      - name: 'n'
        in: path
        required: true
        description: Zero-based index into the layer's `versions`; a non-integer answers 400 (`bad version`).
        schema:
          type: integer
          minimum: 0
    post:
      tags:
        - Scenes
      operationId: untrackSceneVersion
      summary: Remove a version's roto.
      description: Cancels the track job if it runs and deletes the matte folder and preview video. No body.
      x-access: admin
      responses:
        '200':
          description: The scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: '`n` not an integer.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene, layer or version.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/deps/status:
    get:
      tags:
        - Dependencies
      operationId: getDepsStatus
      summary: State of every bundled binary, optional tool and downloadable model.
      description: |
        Reads cached snapshots only and never starts an install or spawns a
        detection subprocess, so it is cheap to poll. Items come in this
        order: bundled, then optional, then manifest models and tools (Dream
        models are left out unless the server was built with the Dream
        feature).

        For a model or tool with a tracked install in this server run,
        `state` is the install's state and `detail` is the install progress
        object. A model the user supplied themselves (a loki-* engine or
        third-party tool on `PATH`, weights next to such an engine, or a
        configured faster-whisper path) reports `state: installed`,
        `source: user` and `detail: {"source":"path"}`.
      x-access: public
      responses:
        '200':
          description: Every dependency.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepStatusItem'
              example:
                - id: ffmpeg
                  category: bundled
                  name: FFmpeg
                  state: ready
                  version: ffmpeg version 8.0 Copyright (c) 2000-2025 the FFmpeg developers
                  path: C:\Program Files\Lowkey Media Server\ffmpeg.exe
                - id: yt-dlp
                  category: optional
                  name: yt-dlp
                  feature: Import from YouTube & video sites
                  description: Video downloader. Required to import from YouTube, Twitch, and many other sites.
                  state: not_installed
                  detail:
                    description: >-
                      Video downloader. Required to import from YouTube, Twitch, and many other
                      sites.
                    commands:
                      - os: windows
                        label: winget
                        command: winget install yt-dlp
                    docs_url: https://github.com/yt-dlp/yt-dlp#installation
                - id: siglip2-base-patch16-224
                  category: model
                  name: SigLIP 2 base patch16 224
                  feature: Visual similarity search
                  description: Find visually similar images and search your library by text. ...
                  state: downloading
                  size_bytes: 1505518412
                  detail:
                    id: siglip2-base-patch16-224
                    state: downloading
                    current_file: image_model.onnx
                    bytes_done: 104857600
                    bytes_total: 371000000
                    started_at: '2026-10-31T10:00:00Z'
                    updated_at: '2026-10-31T10:00:12Z'
  /api/deps/models/progress:
    get:
      tags:
        - Dependencies
      operationId: streamModelProgress
      summary: Server-Sent Events stream of model install progress.
      description: |
        On connect the server sends one event for every install tracked in
        this server run (any state, including finished ones), then one event
        per state change of any install. Each event is a bare `data:` line
        holding a `ModelInstall` JSON object (no `event:` or `id:` fields).
        A comment line `: ping` is sent every 15 seconds to keep the
        connection open. Events are dropped, not queued, for a client that
        falls more than 16 updates behind, so treat the stream as "latest
        state" and re-read `GET /api/deps/status` after reconnecting.
      x-access: public
      responses:
        '200':
          description: The event stream; stays open until the client disconnects.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  `data: <ModelInstall JSON>` events separated by blank lines, plus `: ping`
                  comments.
              example: >
                data:
                {"id":"yunet","state":"downloading","current_file":"model.onnx","bytes_done":131072,"bytes_total":232589,"started_at":"2026-10-31T10:00:00Z","updated_at":"2026-10-31T10:00:01Z"}


                : ping


                data:
                {"id":"yunet","state":"installed","current_file":"model.onnx","bytes_done":232589,"bytes_total":232589,"started_at":"2026-10-31T10:00:00Z","updated_at":"2026-10-31T10:00:02Z"}
        '500':
          description: The response writer cannot stream. Plain-text `streaming unsupported`.
          content:
            text/plain:
              schema:
                type: string
  /api/deps/models/{id}/download:
    post:
      tags:
        - Dependencies
      operationId: downloadModel
      summary: Start downloading a model or tool.
      description: |
        Starts the install in the background and returns at once. If an
        install of this id is already queued or running, that install is
        returned and no second download starts. Follow progress on
        `GET /api/deps/models/progress`. No request body.
      x-access: public
      parameters:
        - $ref: '#/components/parameters/DepModelId'
      responses:
        '200':
          description: |
            Already installed. The body is the tracked install object when
            one exists in this server run, otherwise `{"state":"installed"}`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ModelInstall'
                  - type: object
                    properties:
                      state:
                        type: string
                        enum:
                          - installed
                    required:
                      - state
              example:
                state: installed
        '202':
          description: Install started (or already in progress); the current progress object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInstall'
              example:
                id: faster-whisper
                state: queued
                bytes_done: 0
                bytes_total: 0
                started_at: '2026-10-31T10:00:00Z'
                updated_at: '2026-10-31T10:00:00Z'
        '401':
          $ref: '#/components/responses/DepsUnauthorized'
        '404':
          description: Unknown model id (`unknown model id "<id>"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/deps/models/{id}/cancel:
    post:
      tags:
        - Dependencies
      operationId: cancelModelDownload
      summary: Cancel an in-flight model install.
      description: |
        Cancels the install's context; the install then moves to
        `cancelled`, which is reported on the progress stream. No request
        body.
      x-access: public
      parameters:
        - $ref: '#/components/parameters/DepModelId'
      responses:
        '202':
          description: Cancellation requested. Empty body.
        '401':
          $ref: '#/components/responses/DepsUnauthorized'
        '404':
          description: No active install for this id (`no active install for "<id>"`), including unknown ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/deps/models/{id}/verify:
    post:
      tags:
        - Dependencies
      operationId: verifyModel
      summary: Check the files of an installed model or tool.
      description: |
        For a managed download, every file for this OS is SHA-256 checked
        against the manifest; a file that was extracted from an archive is
        only checked for presence (the checksum covers the discarded
        archive). For a copy the user supplied themselves (see
        `GET /api/deps/status`), only presence and, where the manifest knows
        it, size are checked, and `source`, `location` and `note` are set.
        The result is always `200`; problems are reported per file. No
        request body.
      x-access: public
      parameters:
        - $ref: '#/components/parameters/DepModelId'
      responses:
        '200':
          description: Per-file results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVerifyResult'
              example:
                id: wd-eva02-large-tagger-v3
                files:
                  model.onnx: ok
                  selected_tags.csv: ok
                  config.json: missing
        '401':
          $ref: '#/components/responses/DepsUnauthorized'
        '404':
          description: Unknown model id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/deps/models/{id}:
    delete:
      tags:
        - Dependencies
      operationId: deleteModel
      summary: Delete a downloaded model or tool.
      description: |
        Removes the model's managed folder under `deps/models` and rebuilds
        the installed/missing cache. A missing folder is not an error. Copies
        the user supplied themselves are never touched (they do not live in
        the managed folder). An in-flight install is not cancelled first.
      x-access: public
      parameters:
        - $ref: '#/components/parameters/DepModelId'
      responses:
        '204':
          description: Deleted (or nothing was there). Empty body.
        '401':
          $ref: '#/components/responses/DepsUnauthorized'
        '404':
          description: Unknown model id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The folder could not be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/settings:
    get:
      tags:
        - Settings and Session
      operationId: getSettings
      summary: The whole settings object.
      x-access: read
      responses:
        '200':
          description: Settings (empty object after a restart).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags:
        - Settings and Session
      operationId: putSettings
      summary: Set one setting or merge several.
      description: >
        If the body has a string `key` property it is a single update: `settings[key] = value`.
        Otherwise every property of the body is merged into the settings. A batch that happens to
        contain a string `key` property is therefore treated as a single update. Requires a
        credential even when Allow Public Access is on. Methods other than GET and PUT answer `200`
        with an empty body.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  description: Single setting.
                  required:
                    - key
                  properties:
                    key:
                      type: string
                    value:
                      description: Any JSON value.
                - type: object
                  description: Batch of settings to merge.
                  additionalProperties: true
              description: >-
                A body with a string `key` sets that one setting to `value`; any other object is
                merged key by key.
            examples:
              single:
                value:
                  key: theme
                  value: dark
              batch:
                value:
                  theme: dark
                  volume: 0.8
      responses:
        '200':
          description: Saved. Body is `{}`.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body is not a JSON object. Body `{"error":"bad request"}` sent as `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Allow Public Access is on and the request has no valid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/session:
    get:
      tags:
        - Settings and Session
      operationId: getSession
      summary: The whole session object.
      x-access: read
      responses:
        '200':
          description: Session (empty object after a restart or database switch).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags:
        - Settings and Session
      operationId: mergeSession
      summary: Merge an object into the session.
      description: >-
        Requires a credential even when Allow Public Access is on. Methods other than GET, PUT and
        DELETE answer `200` with an empty body.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              query: tag:sunset
              cursor: 12
      responses:
        '200':
          description: Merged. Body is `{}`.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body is not a JSON object. Body `{"error":"bad request"}` sent as `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Allow Public Access is on and the request has no valid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Settings and Session
      operationId: clearSession
      summary: Clear the whole session.
      description: Requires a credential even when Allow Public Access is on.
      x-access: read
      responses:
        '200':
          description: Cleared. Body is `{}`.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Allow Public Access is on and the request has no valid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/session/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: >-
          Session key. Registered as the prefix `/api/session/`; everything after it (slashes
          included) is the key. An empty key (`/api/session/`) addresses the whole session. The key
          `keys` is unreachable here because `/api/session/keys` is its own route.
        schema:
          type: string
    get:
      tags:
        - Settings and Session
      operationId: getSessionValue
      summary: One session value.
      x-access: read
      responses:
        '200':
          description: >-
            The stored JSON value, `null` when the key is not set, or the whole session object when
            the key is empty.
          content:
            application/json:
              schema: {}
    put:
      tags:
        - Settings and Session
      operationId: putSessionValue
      summary: Set one session value to the request body.
      description: >-
        The body is any JSON value. With an empty key the body must be an object and is merged into
        the session. Requires a credential even when Allow Public Access is on. Methods other than
        GET and PUT (including DELETE) answer `200` with an empty body and change nothing.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
            example: tag:sunset
      responses:
        '200':
          description: Saved. Body is `{}`.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body is not valid JSON. Body `{"error":"bad request"}` sent as `text/plain`.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Allow Public Access is on and the request has no valid credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/session/keys:
    post:
      tags:
        - Settings and Session
      operationId: deleteSessionKeys
      summary: Delete the named keys from the session.
      description: >-
        The handler does not check the method; any method with this body behaves the same. POST is
        what clients send.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keys
              properties:
                keys:
                  type: array
                  items:
                    type: string
            example:
              keys:
                - library
                - previous
      responses:
        '200':
          description: Deleted. Body is `{}`.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body is not valid JSON. Body `{"error":"bad request"}` sent as `text/plain`.
          content:
            text/plain:
              schema:
                type: string
  /api/scheduler:
    get:
      tags:
        - Auto Scheduler
      operationId: getSchedulerStatus
      summary: Current scheduler status.
