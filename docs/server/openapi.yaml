                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Allow Public Access is on and the request carries no admin credential (anonymous
            visitors may read but not write here).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
        '404':
          description: >-
            No duplicate group with that id. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database or internal failure. The body is `{"error": "..."}` but is sent with
