        workflows, the DAG is **not validated** and node ids are used **as the job ids** verbatim (a
        node with an empty `id` gets a generated UUID, but then nothing can depend on it). Node ids
        must therefore be globally unique across the queue; a clash fails the request part way,
        leaving earlier nodes queued. A dependency on an id that never becomes a completed job
        leaves the dependent pending forever.
