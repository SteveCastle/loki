  /api/people/{id}:
    delete:
      tags:
        - People and Faces
      operationId: deletePerson
      summary: Delete a person.
      description: >-
        Removes the person and their People-category tag rows. By default the faces are kept
        (unassigned, free to re-cluster) and the dissolved membership is recorded as a group ban so
        the same group does not simply re-form on the next clustering pass.


        - `deleteFaces=true` deletes the face rows too (and drops them from the search index); they
        stay gone until their media is rescanned. No ban is recorded in this mode.

        - `ban=false` skips recording the ban.


        Only `DELETE` is accepted on this path. Broadcasts a `people-updated` event on `/stream`.
      x-access: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Person id (positive integer).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: deleteFaces
          in: query
          required: false
          description: Exactly `true` also deletes the person's faces. Any other value is ignored.
          schema:
            type: string
            enum:
              - 'true'
        - name: ban
          in: query
          required: false
          description: Exactly `false` skips recording the group ban. Ignored when `deleteFaces=true`.
          schema:
            type: string
            enum:
              - 'false'
      responses:
        '200':
          description: >-
            Deleted. With `deleteFaces=true` the body is `{deleted, facesDeleted}`; otherwise
            `{deleted, banned}`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Faces kept
                    properties:
                      deleted:
                        type: integer
                        format: int64
                        description: The deleted person id.
                      banned:
                        type: integer
                        description: Faces recorded in the group ban (0 with `ban=false`).
                    required:
                      - deleted
                      - banned
                  - type: object
                    title: Faces deleted
                    properties:
                      deleted:
                        type: integer
                        format: int64
                        description: The deleted person id.
                      facesDeleted:
                        type: integer
                        description: Face rows deleted.
                    required:
                      - deleted
                      - facesDeleted
              example:
                deleted: 13
                banned: 6
        '400':
          description: >-
            Invalid person id. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No person with that id. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: >-
