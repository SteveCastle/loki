# Lowkey Media Server HTTP API - the source of truth for docs/server/api.html.
# Edit this file, then run: node scripts/build-api-docs.js
# media-server/openapi_coverage_test.go fails when a registered route is missing here.
openapi: 3.1.0
info:
  title: Lowkey Media Server HTTP API
  version: 2.37.0
  description: |
    Every endpoint served by Lowkey Media Server. Paths are relative to the
    server's address (port 10111 unless changed with `LOWKEY_PORT` or the
    `port` config key).
  license:
    name: MIT
    url: https://github.com/SteveCastle/loki/blob/master/LICENSE
servers:
  - url: http://localhost:10111
    description: Default local server
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A JWT from `POST /auth/login` or an `lk_` API key.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: An `lk_` API key.
    cookie:
      type: apiKey
      in: cookie
      name: auth_token
      description: The session cookie set by `POST /auth/login`.
  schemas:
    Error:
      type: object
      description: >-
        Error body returned by handlers written for the web client. Older handlers return a
        plain-text message instead.
      properties:
        error:
          type: string
          description: Human-readable message.
      required:
        - error
    JobState:
      type: string
      enum:
        - pending
        - in_progress
        - paused
        - completed
        - cancelled
        - error
      description: >-
        `completed`, `cancelled` and `error` are terminal. `paused` holds progress and can be
        resumed.
    Job:
      type: object
      description: A job in the queue.
      properties:
        id:
          type: string
          description: Job id (UUID).
        command:
          type: string
          description: Task id.
        arguments:
          type: array
          items:
            type: string
          description: Option tokens passed to the task.
        input:
          type: string
          description: The job input after workflow substitution.
        original_input:
          type: string
          description: The input as submitted.
        host:
          type: string
          description: Concurrency bucket the job runs in.
        resources:
          type: array
          items:
            type: string
          description: Additional concurrency buckets the job occupies.
        dependencies:
          type: array
          items:
            type: string
          description: Ids of jobs that must complete first.
        state:
          $ref: '#/components/schemas/JobState'
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          description: Zero time (`0001-01-01T00:00:00Z`) until claimed.
        completed_at:
          type: string
          format: date-time
        errored_at:
          type: string
          format: date-time
        output_files:
          type: array
          items:
            type: string
          description: Files the job registered for downstream workflow steps.
        source_files:
          type: array
          items:
            type: string
          description: Parallel to `output_files`; the source of each output.
        workflow_id:
          type: string
          description: Set when the job belongs to a workflow.
        progress_done:
          type: integer
        progress_total:
          type: integer
        interrupt_count:
          type: integer
          description: >-
            Times the job was found still in progress at server startup (its run died: crash, out of
            memory, unclean shutdown). After a capped number of auto-resumes the job is failed
            instead.
      required:
        - id
        - command
        - arguments
        - input
        - original_input
        - host
        - resources
        - dependencies
        - state
        - created_at
        - claimed_at
        - completed_at
        - errored_at
        - output_files
        - source_files
        - workflow_id
        - progress_done
        - progress_total
        - interrupt_count
    AuthUser:
      type: object
      description: A user account.
      required:
        - id
        - username
        - created_at
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
    APIKey:
      type: object
      description: An API key's metadata. The secret is never returned after creation.
      required:
        - id
        - username
        - name
        - prefix
        - created_at
        - last_used_at
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          description: User the key acts as.
        name:
          type: string
        prefix:
          type: string
          description: First 11 characters of the key (`lk_` + 8 hex).
        created_at:
          type: integer
          format: int64
          description: Unix seconds.
        last_used_at:
          type: integer
          format: int64
          description: Unix seconds; `0` if never used.
    HealthStatus:
      type: object
      required:
        - status
        - version
        - timestamp
        - stream
        - jobs
      properties:
        status:
          type: string
          enum:
            - healthy
          description: Always `healthy` when the server answers.
        version:
          type: string
          description: Server version.
        timestamp:
          type: integer
          format: int64
          description: Server time, Unix seconds.
        stream:
          type: object
          description: '`/stream` SSE statistics.'
          required:
            - active_connections
            - total_messages
            - max_connections
            - dropped_broadcasts
            - dropped_client_msgs
            - rejected_connections
          properties:
            active_connections:
              type: integer
            total_messages:
              type: integer
            max_connections:
              type: integer
            dropped_broadcasts:
              type: integer
            dropped_client_msgs:
              type: integer
            rejected_connections:
              type: integer
        jobs:
          type: object
          description: Job counts by state. Paused jobs are in `total` only.
          required:
            - total
            - pending
            - in_progress
            - completed
            - cancelled
            - error
          properties:
            total:
              type: integer
            pending:
              type: integer
            in_progress:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer
            error:
              type: integer
    SchedulerStatus:
      type: object
      description: Auto-scheduler status. Fields may be zero values before the first tick.
      required:
        - mode
        - forced
        - state
        - reason
        - done
        - total
        - ops
        - signals
      properties:
        mode:
          type: string
          enum:
            - 'off'
            - auto
        forced:
          type: boolean
          description: A one-shot forced run (`POST /api/scheduler/run`) is active.
        state:
          type: string
          enum:
            - disabled
            - waiting
            - running
            - yielding
            - complete
        reason:
          type: string
          description: Human-readable reason for the state, e.g. `the app is in use`, `session locked`.
        jobId:
          type: string
          description: The scheduled job's id, when there is one. Omitted otherwise.
        done:
          type: integer
          description: Items processed by the scheduled job.
        total:
          type: integer
          description: Items the scheduled job will process.
        ops:
          type: string
          description: >-
            Comma-separated per-item ops the job runs (default
            `hash,dimensions,describe,transcribe,autotag,embed,faces`).
        signals:
          type: object
          description: The idle signals behind the decision.
          required:
            - cpuPercent
            - sessionLocked
            - fullscreenBusy
            - onBattery
            - inputIdleSeconds
            - appQuietSeconds
          properties:
            cpuPercent:
              type: number
              description: Total system CPU percent; `-1` when unknown.
            sessionLocked:
              type: string
              enum:
                - 'yes'
                - 'no'
                - unknown
            fullscreenBusy:
              type: string
              enum:
                - 'yes'
                - 'no'
                - unknown
            onBattery:
              type: string
              enum:
                - 'yes'
                - 'no'
                - unknown
            inputIdleSeconds:
              type: number
              description: Seconds since the last keyboard/mouse input.
            appQuietSeconds:
              type: number
              description: Seconds since the last user-intent request to the server.
      example:
        mode: auto
        forced: false
        state: waiting
        reason: the app is in use
        done: 0
        total: 0
        ops: hash,dimensions,describe,transcribe,autotag,embed,faces
        signals:
          cpuPercent: 12.5
          sessionLocked: 'no'
          fullscreenBusy: 'no'
          onBattery: 'no'
          inputIdleSeconds: 3
          appQuietSeconds: 20
    StorageRoot:
      type: object
      description: A storage root (local folder or S3-compatible bucket).
      required:
        - type
        - label
      properties:
        type:
          type: string
          enum:
            - local
            - s3
        path:
          type: string
          description: Local filesystem path (`local`).
        label:
          type: string
          description: Display name.
        default:
          type: boolean
          description: Destination for uploads and downloads.
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        accessKey:
          type: string
          description: '`<redacted>` on read when set.'
        secretKey:
          type: string
          description: '`<redacted>` on read when set.'
        thumbnailPrefix:
          type: string
    ByoFaceModel:
      type: object
      description: A bring-your-own face recognizer (user-supplied ONNX file).
      required:
        - id
        - modelPath
        - dim
      properties:
        id:
          type: string
          description: Unique id; face vectors are keyed by it.
        name:
          type: string
        modelPath:
          type: string
          description: Absolute path to the ONNX file.
        dim:
          type: integer
          description: Embedding dimension.
        inputName:
          type: string
          description: Input tensor name (default `data`).
        outputName:
          type: string
          description: Output tensor name (default `fc1`).
        mean:
          type: array
          items:
            type: number
          description: Per-channel RGB mean on the 0..255 scale.
        std:
          type: array
          items:
            type: number
          description: Per-channel RGB std on the 0..255 scale.
    InferenceConcurrency:
      type: object
      description: Per-provider concurrency caps for vision inference.
      properties:
        ollama:
          type: integer
        runpod:
          type: integer
        lmstudio:
          type: integer
        llamacpp:
          type: integer
        strata:
          type: integer
    ServerConfig:
      type: object
      description: >-
        The server configuration as returned by `GET /api/config` (secrets redacted). Only commonly
        used keys are described; see the Config page for the meaning of each setting.
      properties:
        dbPath:
          type: string
          description: Active SQLite library database.
        port:
          type: integer
          description: HTTP port (default 10111).
        downloadPath:
          type: string
        extractorsPath:
          type: string
        inferenceProvider:
          type: string
          enum:
            - 'off'
            - ollama
            - runpod
            - lmstudio
            - llamacpp
            - strata
        ollamaBaseUrl:
          type: string
        ollamaModel:
          type: string
        describePrompt:
          type: string
        runpodEndpoint:
          type: string
        runpodApiKey:
          type: string
        lmstudioBaseUrl:
          type: string
        lmstudioModel:
          type: string
        lmstudioApiKey:
          type: string
        llamacppBaseUrl:
          type: string
        llamacppModel:
          type: string
        llamacppApiKey:
          type: string
        strataBaseUrl:
          type: string
        strataModel:
          type: string
        strataApiKey:
          type: string
        inferenceConcurrency:
          $ref: '#/components/schemas/InferenceConcurrency'
        autoProcessOps:
          type: string
          description: Comma-separated ops for the auto scheduler's job; empty = all.
        localComputeConcurrency:
          type: integer
        onnxTagger:
          type: object
          properties:
            modelPath:
              type: string
            labelsPath:
              type: string
            configPath:
              type: string
            ortSharedLibraryPath:
              type: string
            generalThreshold:
              type: number
            characterThreshold:
              type: number
        embeddingModel:
          type: string
        embeddingProvider:
          type: string
          enum:
            - cpu
            - directml
        embeddingPerformance:
          type: string
          enum:
            - low
            - balanced
            - max
            - custom
        embeddingWorkers:
          type: integer
        embeddingThreadsPerWorker:
          type: integer
        autotagModel:
          type: string
        autotagProvider:
          type: string
        autotagPerformance:
          type: string
        autotagWorkers:
          type: integer
        autotagThreadsPerWorker:
          type: integer
        faceModel:
          type: string
        faceProvider:
          type: string
        facePerformance:
          type: string
        faceWorkers:
          type: integer
        faceThreadsPerWorker:
          type: integer
        faceRouting:
          type: string
          enum:
            - auto
            - single
        faceClusterThresholdOffset:
          type: number
        faceClusterMinCluster:
          type: integer
        faceClusterMinQuality:
          type: number
        byoFaceModels:
          type: array
          items:
            $ref: '#/components/schemas/ByoFaceModel'
        onnxFileTimeoutSeconds:
          type: integer
          description: Per-file timeout for local ONNX tasks; `<= 0` disables.
        transcriptionProvider:
          type: string
        transcriptionModel:
          type: string
        transcriptionLanguage:
          type: string
        transcriptionVadFilter:
          type: boolean
        transcriptionInitialPrompt:
          type: string
        transcriptionHotwords:
          type: string
        transcriptionVocalExtract:
          type: boolean
        dreamModel:
          type: string
        reshootModels:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              label:
                type: string
              recipe:
                type: string
                enum:
                  - fast
                  - h3
        fasterWhisperPath:
          type: string
        discordToken:
          type: string
        jwtSecret:
          type: string
          description: Always `<redacted>` when set.
        setupComplete:
          type: boolean
        defaultStartPath:
          type: string
        allowPublicAccess:
          type: boolean
        swipeFeed:
          type: object
          additionalProperties: true
          description: Swipe For You feed tuning.
        engines:
          type: object
          description: GPU engine placement (see the GPU Engines section).
          properties:
            strategy:
              type: string
              enum:
                - local
                - pool
                - hybrid
            pools:
              type:
                - array
                - 'null'
              items:
                type: object
                additionalProperties: true
            routes:
              type:
                - object
                - 'null'
              additionalProperties:
                type: string
            fallback:
              type: boolean
            localOnly:
              type: boolean
        roots:
          type: array
          items:
            $ref: '#/components/schemas/StorageRoot'
        rootPaths:
          type: array
          items:
            type: string
      additionalProperties: true
    ConfigUpdateRequest:
      type: object
      description: >-
        Fields accepted by `POST /config`. Only `dbPath` is required; see the operation description
        for which fields are skipped when empty.
      required:
        - dbPath
      properties:
        dbPath:
          type: string
          description: Required, non-blank. A different value switches the library database.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Applied on restart. Out-of-range or 0 is ignored.
        downloadPath:
          type: string
        ollamaBaseUrl:
          type: string
        ollamaModel:
          type: string
        describePrompt:
          type: string
        inferenceProvider:
          type: string
          enum:
            - 'off'
            - ollama
            - runpod
            - lmstudio
            - llamacpp
            - strata
          description: Lower-cased.
        runpodEndpoint:
          type: string
        runpodApiKey:
          type: string
          description: '`<redacted>` keeps the stored key.'
        lmstudioBaseUrl:
          type: string
        lmstudioModel:
          type: string
        lmstudioApiKey:
          type: string
          description: '`<redacted>` keeps the stored key.'
        llamacppBaseUrl:
          type: string
        llamacppModel:
          type: string
        llamacppApiKey:
          type: string
          description: '`<redacted>` keeps the stored key.'
        strataBaseUrl:
          type: string
        strataModel:
          type: string
        strataApiKey:
          type: string
          description: '`<redacted>` keeps the stored key.'
        inferenceConcurrency:
          $ref: '#/components/schemas/InferenceConcurrency'
        localComputeConcurrency:
          type: integer
        onnxModelPath:
          type: string
          description: Always applied; omitting it clears it.
        onnxLabelsPath:
          type: string
          description: Always applied; omitting it clears it.
        onnxConfigPath:
          type: string
          description: Always applied; omitting it clears it.
        onnxOrtSharedLibPath:
          type: string
          description: Always applied; omitting it clears it.
        onnxGeneralThreshold:
          type: number
        onnxCharacterThreshold:
          type: number
        embeddingModel:
          type: string
        embeddingProvider:
          type: string
        embeddingPerformance:
          type: string
        embeddingWorkers:
          type: integer
        embeddingThreadsPerWorker:
          type: integer
        autotagModel:
          type: string
        autotagProvider:
          type: string
        autotagPerformance:
          type: string
        autotagWorkers:
          type: integer
        autotagThreadsPerWorker:
          type: integer
        onnxFileTimeoutSeconds:
          type: integer
          description: Non-zero values apply; negative disables the timeout.
        faceModel:
          type: string
        faceRouting:
          type: string
          enum:
            - auto
            - single
          description: Other values are ignored.
        faceProvider:
          type: string
        facePerformance:
          type: string
        faceWorkers:
          type: integer
        faceThreadsPerWorker:
          type: integer
        byoFaceModels:
          type: array
          items:
            $ref: '#/components/schemas/ByoFaceModel'
          description: Replaces the list when present; `[]` clears it.
        transcriptionProvider:
          type: string
        transcriptionModel:
          type: string
        transcriptionLanguage:
          type: string
          description: Applied when present; empty means auto-detect.
        transcriptionVadFilter:
          type: boolean
        transcriptionInitialPrompt:
          type: string
        transcriptionHotwords:
          type: string
        transcriptionVocalExtract:
          type: boolean
        allowPublicAccess:
          type: boolean
        defaultStartPath:
          type: string
        fasterWhisperPath:
          type: string
        discordToken:
          type: string
          description: '`<redacted>` keeps the stored token.'
        roots:
          type: array
          items:
            $ref: '#/components/schemas/StorageRoot'
          description: Replaces the storage roots when present.
    CreateJobRequest:
      type: object
      properties:
        input:
          type: string
          description: >-
            Command string: `<task-id> [option tokens...] <input>`, split on spaces with
            double-quote grouping (see the operation description).
        fields:
          type: object
          additionalProperties:
            type: string
          description: >-
            Extra options appended verbatim as `--<key> <value>` token pairs. Empty keys or values
            are skipped.
      required:
        - input
    JobSnapshot:
      type: object
      description: Response of `GET /api/job/{id}`. Every field is always present.
      properties:
        id:
          type: string
          description: Job id.
        command:
          type: string
          description: Task id.
        state:
          $ref: '#/components/schemas/JobState'
        progress_done:
          type: integer
          description: Items finished (including skips).
        progress_total:
          type: integer
          description: Total items; 0 until the input resolves.
        output_files:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Files the job registered so far; `null` when none were ever registered.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: Zero time (`0001-01-01T00:00:00Z`) until completed.
        log:
          type: array
          items:
            type: string
          description: The last `tail` log lines, oldest first.
      required:
        - id
        - command
        - state
        - progress_done
        - progress_total
        - output_files
        - created_at
        - completed_at
        - log
    JobForPathSummary:
      type: object
      properties:
        id:
          type: string
          description: Job id.
        command:
          type: string
          description: Task id.
        arguments:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Option tokens.
        state:
          $ref: '#/components/schemas/JobState'
        progress_done:
          type: integer
        progress_total:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - command
        - arguments
        - state
        - progress_done
        - progress_total
        - created_at
    TaskInfo:
      type: object
      properties:
        id:
          type: string
          description: Task id, used as a job's `command` and as the first token of `POST /create` input.
        name:
          type: string
          description: Display name.
        options:
          type: array
          items:
            $ref: '#/components/schemas/TaskOption'
          description: >-
            Option schema. Always present (possibly empty) on Windows; absent on macOS and Linux
            builds.
      required:
        - id
        - name
    TaskOption:
      type: object
      description: >-
        One option a task accepts. Passed to the job as `--<name> <value>` or `--<name>=<value>` in
        `arguments` (or as a `POST /create` `fields` entry). Unknown option tokens are ignored by
        the task.
      properties:
        name:
          type: string
          description: Option name (the flag without `--`).
        label:
          type: string
          description: Display label.
        type:
          type: string
          enum:
            - string
            - bool
            - enum
            - multi-enum
            - number
          description: >
            How the value is parsed:

            - `bool`: `--name` alone means true; `--name=true|1|yes` or a following
            `true`/`false`/`1`/`0`/`yes`/`no` token sets it explicitly.

            - `number`: parsed as a float; an unparsable value leaves the default.

            - `string`, `enum`, `multi-enum`: the following token (unless it starts with `--`) or
            the `=` value, as a string.
        choices:
          type: array
          items:
            type: string
          description: Allowed values for `enum` and `multi-enum`. Omitted when empty.
        default:
          description: >-
            Value used when the option is absent (string, boolean, number or array depending on the
            task). Omitted when the option has no default, in which case it defaults to `false`, `0`
            or an empty string by type.
        required:
          type: boolean
          description: Marked as required in the UI. Omitted when false.
        description:
          type: string
          description: Help text. Omitted when empty.
      required:
        - name
        - label
        - type
    WorkflowTask:
      type: object
      description: One DAG node; becomes one job.
      properties:
        id:
          type: string
          description: >-
            Node id, unique within the DAG and referenced by other nodes' `dependencies`. In saved
            workflows it is a template id replaced by a fresh UUID at run time; in `POST /workflow`
            it becomes the job id.
        command:
          type: string
          description: Task id (see `GET /tasks`).
        arguments:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Option tokens, already split (for example `["--apply", "all"]`).
        input:
          type: string
          description: >-
            The node's own input. At claim time each dependency's output files are appended one per
            line.
        dependencies:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Ids of nodes in the same DAG that must complete first.
        pos_x:
          type: number
          description: Editor canvas position. Omitted when 0.
        pos_y:
          type: number
          description: Editor canvas position. Omitted when 0.
      required:
        - id
        - command
    SavedWorkflowSummary:
      type: object
      properties:
        id:
          type: string
          description: Workflow id (UUID).
        name:
          type: string
          description: Unique workflow name.
      required:
        - id
        - name
    SavedWorkflow:
      type: object
      properties:
        id:
          type: string
          description: Workflow id (UUID).
        name:
          type: string
          description: Unique workflow name.
        dag:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTask'
          description: The DAG nodes.
      required:
        - id
        - name
        - dag
    SavedWorkflowInput:
      type: object
      description: Body of `POST /workflows/create` and `PUT /workflows/{id}`.
      properties:
        name:
          type: string
          description: Workflow name; must be unique.
        dag:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTask'
          description: >-
