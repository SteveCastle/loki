  /api/faces/tuning:
    get:
      tags:
        - People and Faces
      operationId: getFaceTuning
      summary: Read the face-grouping tuner.
      description: >-
        Returns the effective values used by every clustering pass: saved config values, with
        built-in defaults (`thresholdOffset` 0, `minCluster` 3, `minQuality` 0.75) substituted where
        nothing valid is saved.
      x-access: admin
      responses:
        '200':
          description: Effective tuning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceTuning'
              example:
                thresholdOffset: 0
                minCluster: 3
                minQuality: 0.75
        '405':
          description: >-
            Method other than GET or POST. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - People and Faces
      operationId: setFaceTuning
      summary: Save the face-grouping tuner.
      description: >-
        Replaces all three values in the server config (it does not merge): every field is validated
        as sent, and an omitted field reads as 0, so `minCluster` and `minQuality` must always be
        supplied. The new values apply to every later clustering pass on every client. Returns the
        effective values.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thresholdOffset:
                  type: number
                  minimum: -0.2
                  maximum: 0.3
                  description: >-
                    Added to the clustering similarity threshold. Positive values make grouping
                    stricter.
                minCluster:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Minimum faces for a new group to form.
                minQuality:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 1
                  description: Minimum face quality for clustering.
              required:
                - minCluster
                - minQuality
            example:
              thresholdOffset: 0.05
              minCluster: 4
              minQuality: 0.8
      responses:
        '200':
          description: Saved; the effective values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceTuning'
              example:
                thresholdOffset: 0.05
                minCluster: 4
                minQuality: 0.8
        '400':
          description: >-
            Invalid JSON or a value out of range (`thresholdOffset must be between -0.2 and 0.3`,
            `minCluster must be between 1 and 50`, `minQuality must be between 0 and 1`). The body
            is `{"error": "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Saving the config failed. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
