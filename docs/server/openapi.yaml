              schema:
                $ref: '#/components/schemas/Error'
  /api/duplicates/{id}/merge:
    post:
      tags:
        - Duplicate Candidates
      operationId: mergeDuplicateGroup
      summary: Merge group members into one keeper.
      description: >-
        Runs the same merge as `POST /api/media/merge-metadata`: the keeper gains the sources' tags,
        embeddings and transcript, and the sources are deleted from disk and the database (s3://
        sources and files that fail to delete are reported in `failed` and keep their rows). Member
        rows follow the deletions, so a fully merged group disappears and a partially merged one
        stays pending with what is left.


        - `keep` defaults to the group's `keeperPath` (highest resolution, then largest file, then
        the anchor). It must be a member.

        - `sources` defaults to every other active member. Excluded members are merged only when
        named. Blank entries and the keeper itself are skipped.


        Also broadcasts `people-updated` when merged sources had faces. Broadcasts a
        `duplicates-updated` event on `/stream`.
      x-access: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Group id (positive integer).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keep:
                  type: string
                  description: Path of the member to keep.
                sources:
                  type: array
                  items:
                    type: string
                  description: Member paths to merge into `keep` and delete.
            example:
              keep: D:/photos/IMG_0001.jpg
              sources:
                - D:/photos/IMG_0001 (1).jpg
      responses:
        '200':
          description: Merged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  merge:
                    $ref: '#/components/schemas/DuplicateMergeResult'
                  group:
                    oneOf:
                      - $ref: '#/components/schemas/DuplicateGroup'
                      - type: 'null'
                    description: >-
                      The group after the merge, or `null` when it no longer exists (nothing left to
                      review).
                required:
                  - merge
                  - group
              example:
                merge:
                  target: D:/photos/IMG_0001.jpg
                  sources:
                    - D:/photos/IMG_0001 (1).jpg
                  tags: 3
                  embeddings: 0
                  transcript: false
                  transcriptFile: ''
                  deleted:
                    - D:/photos/IMG_0001 (1).jpg
                  failed: null
                  facesRemoved: 1
                group: null
        '400':
          description: >-
            Invalid id or JSON; `keep` is not a member; a source is not a member; or nothing is left
            to merge. The body is `{"error": "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            No such duplicate group. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: >-
            Method other than POST. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database failure or the merge failed before deleting anything. The body is `{"error":
            "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/duplicates/{id}/dismiss:
