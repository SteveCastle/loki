  /api/stats:
    get:
      tags:
        - Library Statistics
      operationId: getLibraryStats
      summary: Library totals and metadata coverage counts.
      description: >
        Serves the latest snapshot with live task progress applied, and starts a background recount
        when the snapshot is stale. Until the first snapshot after startup (or after a database
        switch) exists, the response is just `{"ready": false}`; poll until `ready` is `true`.


        Coverage counts ignore rows whose media item no longer exists. Transcript coverage is
        counted against videos and audio only, embedding coverage against the active embedding
        model, and face-scan coverage against items scanned by any face model. Between recounts,
        live progress can make a count drift slightly; it never exceeds its denominator.
      x-access: read
      responses:
        '200':
          description: 'A snapshot, or `{"ready": false}` before the first count.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LibraryStats'
                  - type: object
                    description: No snapshot yet.
                    required:
                      - ready
                    properties:
                      ready:
                        type: boolean
                        enum:
                          - false
              example:
                ready: true
                generatedAt: 1761900000
                totalMedia: 52000
                totalVideos: 4100
                totalAudio: 300
                totalImages: 47600
                totalTranscribable: 4400
                withDescription: 31000
                withHash: 51800
                withSize: 52000
                withTags: 40100
                withDimensions: 51900
                withTranscript: 2100
                withEmbedding: 51234
                withFaceScan: 30000
                autotagModel:
                  id: wd-eva02-large-tagger-v3
                  name: WD EVA02 Large v3 (anime / illustration)
                embedModel:
                  id: siglip2-base-patch16-224
                  name: SigLIP 2 base (multimodal — image + text)
                faceModel:
                  id: sface
                  name: SFace (photos — OpenCV Zoo, shipped default)
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /create:
    post:
      tags:
        - Jobs
      operationId: createJob
      summary: Create a job from a command string.
      description: >
        Queues one job. The `input` string is split into tokens by these rules:


        - Tokens are separated by the space character only (tabs and newlines are not separators and
        stay inside tokens).

        - A double quote (`"`) toggles quoting; spaces inside quotes are kept. The quote characters
        themselves are removed. There is no escape syntax, so a token cannot contain a literal
        double quote. Quoting can start mid-token (`a"b c"d` is one token `ab cd`).

        - Empty tokens are discarded.


        The first token is the task id. If there is more than one token, the **last** token is the
        job input and the tokens in between become `arguments`. A single-token string creates a job
        with no arguments and an empty input.


        Each non-empty key/value pair of `fields` is then appended to `arguments` as two tokens,
        `--<key>` and `<value>`, verbatim (no splitting or unquoting), so values can contain spaces,
        quotes or newlines. Pairs with an empty key or empty value are skipped. Map order is not
        preserved, and any key is accepted. Task options are parsed with the last occurrence
        winning, so a `fields` entry overrides the same option given in `input`.


        The task id is not validated here: an unknown task is accepted and the job fails when it
        runs. The job is assigned to a fresh single-node workflow (its `workflow_id` is set).
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            example:
              input: describe --overwrite "D:/photos/2024 trip"
              fields:
                prompt: Describe the scene in one sentence.
      responses:
        '201':
          description: Job queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The new job's id (UUID).
                required:
                  - id
              example:
                id: 3f0c8f5e-6a0e-4c41-9a7a-2f1f3d0b8c11
        '400':
          description: The body is not valid JSON (`bad json`) or `input` contains no tokens (`Invalid input`).
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential (API-style request).
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST (`Use POST`).
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            The queue rejected the job, or the `create` broadcast failed to render (job may already
            be queued).
          content:
            text/plain:
              schema:
                type: string
  /jobs/list:
