          content:
            text/plain:
              schema:
                type: string
tags:
  - name: Authentication
    description: >
      Every non-public route runs through the server's auth middleware. A request is authenticated
      by one of these credentials, checked in this order:


      - an `X-API-Key: lk_...` header;

      - an `Authorization: Bearer <token>` header carrying either a JWT (from `POST /auth/login`) or
      an `lk_` API key (anything starting with `lk_` is checked against the API-key table, anything
      else as a JWT);

      - the `auth_token` cookie set by `POST /auth/login` (HttpOnly, SameSite=Lax, expires with the
      JWT after 365 days).


      A header credential that fails verification is not fatal by itself: the middleware falls
      through to the cookie. When nothing valid is found the response depends on the kind of
      request. It is treated as an API request, and answered `401` with the plain-text body
      `Unauthorized`, when **any** of these is true: the `Accept` header is exactly
      `application/json`, the request carries an `X-API-Key` or `Bearer` header, or the path starts
      with `/api/`. Every other request (a browser navigation) gets a `302` redirect to
      `/login?redirect=<original URI>`, or to `/setup` while first-run setup is not complete.


      Before first-run setup, the server has a temporary `admin`/`admin` account. While that is the
      only account, a request authenticated as it is refused: API requests get `403` with the JSON
      body `{"error":"setup_required","message":"Please create a new user account"}`; page requests
      are redirected to `/login?setup=true` (or `/setup`). Creating the first real user (`POST
      /auth/users` or the setup wizard) deletes the temporary account.


      Access levels on each operation (`x-access`): `public` needs no credential; `read` needs one
      unless **Allow Public Access** (`allowPublicAccess` in the config) is on, in which case
      anonymous requests pass, but write methods on mixed routes still require a credential and
      answer `401` `{"error":"unauthorized"}` without one; `admin` always needs a credential. Every
      authenticated user is an admin.


      API keys live in the library database, so switching the server to another database (`POST
      /config` with a new `dbPath`) makes existing keys and sessions invalid there.
  - name: System
    description: >
      Server health, configuration, and host actions. Configuration is read as JSON with `GET
      /api/config` (secrets redacted) and written with `POST /config`, which merges the posted
      fields into the stored configuration rather than replacing it.
  - name: Library Statistics
    description: >
      Library totals and per-metadata-type coverage counts, used by the home page's coverage cards.
      The counts come from a snapshot, never computed inline in the request: a request that finds
      the snapshot stale (older than 15 seconds on small libraries, up to 5 minutes on very large
      ones, scaled by how long the last count took) starts a background recount and is answered from
      the current snapshot. Running tasks add their completed items on top of the snapshot as they
      finish, and the merged view is also broadcast over the `/stream` Server-Sent Events channel as
      a `stats` event at most once per second.
  - name: Jobs
    description: >
      Every piece of server work runs as a job in a persistent queue. A job names a **task** (its
      `command`, one of the ids listed by `GET /tasks`), a list of option tokens (`arguments`,
      parsed by the task as `--name value` or `--name=value`) and an `input` string (usually a path,
      a newline-separated path list, or a query).


      Jobs start in `pending` and are claimed in FIFO order once every job in `dependencies` has
      completed and every concurrency bucket the job occupies (`host` plus `resources`) has a free
      slot. A job whose task id is not registered is still accepted; it fails with `error` when
      claimed and logs `Task not found: <id>`.


      Live changes to the queue are pushed over `GET /stream` (`create`, `update`, `delete`,
      `progress` and `stdout-<jobId>` events). Pollers that cannot hold an event stream open can use
      `GET /api/job/{id}`.


      All routes in this section require an admin credential (bearer JWT, `lk_` API key in
      `Authorization` or `X-API-Key`, or the `auth_token` cookie). Without one, a request that looks
      like an API call (it sends `Accept: application/json`, sends a credential header, or its path
      starts with `/api/`) gets `401` with the plain-text body `Unauthorized`; any other request is
      redirected (`302`) to `/login`. While first-run account setup is still pending, a request
      authenticated as the built-in default admin gets `403` with
      `{"error":"setup_required","message":"Please create a new user account"}` (or a redirect to
      `/login?setup=true` for browsers).


      Most handlers in this section are older ones: their error bodies are plain text
      (`text/plain`), not the JSON `Error` object.
  - name: Workflows
    description: >
      A workflow is a DAG of task nodes (`WorkflowTask`). Each node becomes one job; a node's
      `dependencies` name other nodes in the same DAG, and the job only starts once those jobs have
      completed.


      When a job with dependencies is claimed, its effective `input` is rebuilt as its
      `original_input` followed by, one per line, every `output_files` entry of each dependency (or,
      for tasks that register no output files, the dependency's log lines). When a job in a workflow
      ends in `error`, every pending job in the same workflow that depends on it (transitively) is
      cancelled. Cancelling a job by hand does not cascade: its dependents stay pending.


      `POST /workflow` runs an ad-hoc DAG once. Saved workflows (`/workflows*`) are templates stored
      in the library database (`workflows` table, names unique) that can be run any number of times
      with a runtime input.


      All routes require an admin credential; see the Jobs section for how unauthenticated requests
      are answered. Errors are plain text.
  - name: Real-Time Events
    description: >
      `GET /stream` is a Server-Sent Events feed of queue and library changes, shared by every
      connected client (there is no per-client filtering). The SPA, the admin pages and the Electron
      viewer all subscribe to it.


      Each message is written as `event: <name>` and `data: <JSON>`. The payload shapes are
      documented as component schemas (`JobListEvent`, `StdoutEvent`, `ProgressEvent`,
      `PeopleUpdatedEvent`, `DuplicatesUpdatedEvent`, `MediaPathsEvent`, `SchedulerEvent`,
      `StatsEvent`, `StreamConnectedEvent`).


      Delivery is best effort: broadcasts go through a 2048-message hub buffer and a 256-message
      buffer per client, and a message that does not fit is dropped immediately (counted as
      `dropped_broadcasts` / `dropped_client_msgs` in `GET /health`). Clients should refetch state
      after reconnecting rather than rely on replay; there are no event ids and no `Last-Event-ID`
      support.
  - name: Media Library
    description: >
      The JSON API the web viewer uses to list, search and edit library items. A media item is
      identified by its `path`: an absolute local path or an `s3://bucket/key` URL inside a
      configured storage root.


      Most of these handlers report errors through a shared helper that writes a JSON body
      (`{"error": "..."}`) but with `Content-Type: text/plain; charset=utf-8`, because it is built
      on Go's `http.Error`. Clients should parse the body as JSON regardless of the content type.
      Those responses are documented here as `text/plain` with the `Error` schema.


      Several handlers in this section do not check the HTTP method: they decode a JSON body from
      whatever method is used. The documented method is the one the clients use.


      List endpoints (`/api/media`, `/api/media/query`, `/api/media/search`) stream a JSON array of
      `MediaListItem` objects in chunks, so a million-item result never sits in server memory. If
      the database fails after the first chunk has been sent, the connection is aborted instead of
      ending the array, so a truncated list is never mistaken for a complete one.


      With **Allow Public Access** on, `read` routes are open to anonymous visitors. Routes that
      read a file or run ffprobe/ffmpeg on a path then restrict anonymous callers to paths inside a
      configured storage root or rows already in the library, and never `http(s)://` URLs; admins
      are unrestricted.
  - name: File Serving
    description: >
      Byte-serving endpoints for media files, thumbnails, HLS renditions and face crops. These are
      plain `GET` URLs meant to be used directly in `<img>`, `<video>` and HLS players.


      The `path` query parameter of `/media/file` and `/media/thumbnail` is read from the raw query
      string and decoded with path-unescaping, so a `+` stays a literal plus sign (encode spaces as
      `%20`). Only the first `path=` occurrence is used.


      Local files are served by Go's `http.ServeFile`, which supports `Range` requests (`206 Partial
      Content`) and `If-Modified-Since`. Files in an S3-compatible root are not proxied: the server
      answers `302 Found` with a presigned URL.


      For anonymous callers under Allow Public Access, paths outside every configured storage root
      are refused with `403`.
  - name: Taxonomy
    description: >
      A **category** groups **tags**. An **assignment** attaches a tag to a media item, optionally
      at a video timestamp (`0` means untimed) and with a weight used for ordering. Tag labels are
      unique across the library and each tag belongs to one category. An assignment's category
      always mirrors its tag's category.


      Read endpoints are `read` access. Every mutation is `admin`.


      Most handlers in this section do not check the HTTP method: they accept any method with the
      documented body, and the method shown is the one the web client sends. The exceptions are the
      method-dispatching paths (`/api/tags`, `/api/tags/timestamp`, `/api/categories`,
      `/api/assignments`), which act only on the listed methods and answer any other method with an
      empty `200`, and `GET /api/tags/list`, which returns `405` for other methods.


      Errors from these handlers carry a JSON body `{"error": "..."}` but are sent with
      `Content-Type: text/plain; charset=utf-8`. Mutations return `{}` on success unless noted.
  - name: Tag Groups
    description: >
      Tag groups are a purely visual level between a category and its tags: a group is identified by
      its category and label, and a tag carries at most one group label. Search and query paths
      ignore groups. A tag leaves its group when it moves to another category, and deleting a group
      never deletes its tags (they become ungrouped). A category with tag grouping turned `off`
      lists its tags flat.


      As in Taxonomy, these handlers do not check the method (except the method-dispatching
      `/api/tag-groups`), and errors are JSON `{"error": "..."}` sent as `text/plain`.
  - name: Embeddings Index
    description: >
      Vectors are stored per model in the `media_embedding` table and loaded into an exact in-memory
      cosine index for the active embedding model at startup and after each embed job. These
      endpoints inspect and maintain both. All are `admin` and enforce their HTTP method (`405`
      otherwise). Errors are JSON `{"error": "..."}` sent as `text/plain`.
  - name: People and Faces
    description: >-
      A *face* is one detection with an identity embedding, stored per media item by the face-scan
      task. A *person* is a cluster of faces, either named or auto-named `Unknown #N`; each person
      is also a tag in the `People` category, so person names work in library search, and rename,
      merge and delete cascade to those tag rows.


      A face is assigned either by clustering (`assignedBy: auto`) or by hand (`user`). User
      assignments, rejections (vetoes and cannot-links) and group bans are permanent across
      re-clustering: locking or curating a group is how you make the clusterer's result stick.
      Grouping strictness is set with `/api/faces/tuning`.


      Every manual change here broadcasts a `people-updated` event on `/stream`. Face crops are
      served by `/media/facecrop?id=`.


      Most error bodies in this section are `{"error": "..."}` sent with `Content-Type: text/plain`.
  - name: Duplicate Candidates
    description: >-
      A *duplicate group* is a cluster of media whose visual embeddings are at least a threshold
      similar to the group's *anchor* item. Groups are stars around the anchor, not chains, and a
      media path belongs to at most one group. They are produced by the review-only
      `find-duplicates` task (unlike the exact-bytes `dedupe` task, it never merges or deletes) and
      reviewed here: merge the copies, dismiss look-alikes, or exclude a single member. The
      `merge-duplicates` task is the bulk accept.


      A dismissed group, and an excluded member, keep their rows so later scans do not regroup them.
      Removing or merging media removes its member rows; a group left with fewer than two members is
      pruned, and one whose anchor is gone is re-anchored on its best remaining member. The `dupe:`
      query predicate filters the library to group members.


      Every write here broadcasts `duplicates-updated` on `/stream`. Error bodies are `{"error":
      "..."}` sent with `Content-Type: text/plain`.
  - name: Swipe
    description: >-
      Swipe is a mobile-first progressive web app served at `/swipe` for flicking through the
      library one item at a time. `/swipe/api` feeds it pages of items in several modes (shuffle,
      more like this, a personalized For You feed, text search, same person), and
      `/swipe/manifest.json` makes it installable. Errors from `/swipe/api` are plain-text messages.
  - name: Database
    description: >
      Direct access to the active library database: read-only SQL for trusted clients such as
      `lokictl`, and the web client's boot handshake.
  - name: Storage and Transfer
    description: >
      Browse and scan the configured storage roots (local folders and S3-compatible buckets), upload
      files into them, and move a curated library between servers with export and import archives.
  - name: Transform and Models
    description: |
      Helpers for the Transform flow and the model pickers in the web UI: a
      dry-run preview of the prompt a `retouch` or `reshoot` job will run, the
      extra video models configured for `reshoot`, the active description
      prompt, the models of the local Ollama install, and the optional DirectML
      runtime used by the embed task.

      All of these require an admin credential.
  - name: GPU Engines
    description: >
      Where the loki-* GPU engines (`loki-retouch`, `loki-reshoot`,

      `loki-dream`, `loki-segment`) run. This is the `engines` section of the

      server config (`EnginesConfig`) plus the dispatcher's live state, and it

      backs the GPU Engines tab of the Config page.


      - **Strategy** `local` (the default) runs every engine on this machine's GPU; `pool` runs them
      on remote workers only; `hybrid` treats this machine's GPU as one more worker.

      - **Pools** are groups of interchangeable workers: kind `nodes` (loki-worker HTTP servers this
      server calls directly) or kind `runpod` (a RunPod queue-based serverless endpoint; files
      travel through a bucket or inline).

      - **Routes** override the strategy per engine, for example `"loki-segment": "local"`. A route
      value is `local`, `pool`, `pool:<name>` or `hybrid`.

      - **localOnly** overrides the strategy and every route so all engines run here while the pools
      stay configured.


      Worker tokens, RunPod API keys and transfer-bucket keys are never sent back:

      they read as `<redacted>`, and posting `<redacted>` back keeps the stored value.
  - name: Scenes
    description: >
      The Scene editor's API. A scene is a layered composition over one still

      (an image, or a frame of a video). Each layer replaces a masked region

      of it: a **still** layer with a `loki-retouch` edit of a crop, a

      **motion** layer with a `loki-reshoot` animation of a crop, or a

      **paint** layer the user paints by hand (never generated). The engines

      take no masks, so every generation crops the layer's region from the

      flattened stills below it, runs the engine on the crop with `nolibrary`,

      and composites the result back through the layer's full-frame alpha mask

      PNG.


      - Each generation becomes a **version** of its layer; `active` picks the one shown. Motion
      generations are chained into a `scene-lock` job that freezes non-moving pixels to the still so
      region edges stay static.

      - Generations, roto tracking (`scene-track`) and exports (`scene-render`) are ordinary jobs on
      the queue. Finished jobs are folded into the document whenever the scene is read, so the
      editor polls `GET /api/scenes/{id}`.

      - The server owns the files under `<data>/scenes/<id>/`. Exports are the only files written
      beside the source (`<name>_scene.mp4` or `<name>_scene.png`) and are added to the library.

      - Selection (`/segment`) keeps one `loki-segment --serve` session per scene, on this machine
      or on a worker node.


      Scene errors are written by `httpError`: the body is the JSON `Error`

      shape but the `Content-Type` is `text/plain; charset=utf-8`. Unknown

      `{action}` segments answer a plain-text `404 page not found`, and wrong

      methods a plain-text 405.
  - name: Dependencies
    description: |
      The server's external pieces in one list: **bundled** binaries shipped
      next to the executable (FFmpeg, FFprobe, ExifTool, the ONNX tagger and
      embedder, ONNX Runtime, FFplay on Windows), **optional** command-line
      tools the user installs themselves (yt-dlp, gallery-dl, Ollama,
      DiscordChatExporter), and on-demand **models** and **tools** the server
      downloads into its `deps/models` folder (SigLIP, the WD tagger, face
      models, faster-whisper, the loki-* engines and their weights, COLMAP,
      Brush, ...).

      Access: these routes are registered **without the auth middleware**.
      The read routes (`GET /api/deps/status`, the progress stream) are always
      open, with CORS for the Electron renderer. The write routes (download,
      cancel, verify, delete) are also open by design, because the first-run
      wizard and the desktop app call them unauthenticated, **except** while
      *Allow Public Access* is on: then they need an admin credential (Bearer
      JWT, `lk_` API key or the `auth_token` cookie) and answer `401`
      `{"error":"unauthorized"}` without one. This does not depend on whether
      first-run setup is complete.

      Download state lives in memory: an install started here (or by a job
      that needs a model on first use) is tracked until the server restarts,
      and every state change is broadcast on `GET /api/deps/models/progress`.
  - name: Settings and Session
    description: >
      Free-form key/value stores held in server memory for the web viewer. Neither store is written
      to disk: both are empty after a server restart, and the session store is also cleared when the
      server switches library databases. The current web viewer keeps its settings and session in
      browser `localStorage` and no longer calls these endpoints; they remain for compatibility.


      Error bodies from these handlers are JSON (`{"error":"bad request"}`) but are sent with a
      `text/plain` content type.
  - name: Auto Scheduler
    description: >
      The auto scheduler keeps metadata generation caught up by running the combined per-item
      `process` job (with a `--scheduled` marker) whenever the machine is idle, and pausing it the
      moment the machine is needed: user requests to media, search and job routes, a queued job that
      shares its buckets, a fullscreen app, battery power, or CPU load above a threshold. Its mode
      (`off` or `auto`) is runtime-only and **not persisted**: every server start comes up `off`.
      Status changes are also broadcast on the `/stream` SSE channel as `scheduler` events.
  - name: Onboarding
    description: |
      A single flag that tells the web UI whether the first-run tour has been
      dismissed. It is stored as `onboarding.json` in the server's data
      directory. Access follows the Dependencies routes: the read is always
      open, and the two writes are open unless *Allow Public Access* is on,
      when they need an admin credential (`401` otherwise).
  - name: Setup Wizard
    description: |
      The first-run wizard at `/setup` and its JSON endpoints under
      `/setup/api/`. The wizard picks the database file, configures storage
      roots, offers model downloads (through the Dependencies endpoints) and
      finally marks setup complete.

      Gating: while the config key `setupComplete` is false every route here
      is open (there is no account to sign in with yet), and the auth
      middleware redirects unauthenticated page requests to `/setup` instead
      of `/login`. Once `setupComplete` is true the endpoints stay mounted but
      require a valid credential (Bearer JWT, `lk_` API key, or the
      `auth_token` cookie): the JSON endpoints answer `403` and the page
      redirects to `/login`.

      `setupComplete` is set by `POST /setup/api/complete`. It is also set
      automatically at startup for installs that already have a real
      (non-default) account, and when the account is provisioned from the
      `LOWKEY_ADMIN_USER` / `LOWKEY_ADMIN_PASSWORD` environment variables, so
      such installs never see the wizard.

      Errors from these endpoints are written with `http.Error`: the body is
      JSON-shaped (`{"error":"..."}`) but the `Content-Type` is `text/plain`.
  - name: Visualizations
    description: >
      Admin-only diagnostic pages served by the server itself, and the JSON APIs that feed them: a
      3D point cloud of the embedding space and a folder treemap showing where items live and how
      much of each folder the indexes cover. The index page `/viz/` links to both.
  - name: Legacy Media Browser
    description: >
      Endpoints behind the older server-rendered gallery at `/media` and the browser extensions. New
      integrations should use the Media Library endpoints instead.


      Errors from these handlers are plain text (`text/plain`), not JSON.
  - name: HTML Pages
    description: >
      Server-rendered pages and embedded static files. Admin pages redirect an unauthenticated
      browser to `/login` (or `/setup` before first-run setup completes) instead of answering `401`.
      The `/` pattern is the mux's catch-all, so any path that matches no other route renders the
      home page.
