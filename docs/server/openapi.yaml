            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/refinish:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
