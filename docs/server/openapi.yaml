        message:
          type: string
          description: Present on success.
        error:
          type: string
          description: Present on failure.
    ImportResult:
      type: object
      required:
        - imported
        - skipped
        - files
        - dest_root
      properties:
        imported:
          type: integer
          description: New media items merged in.
        skipped:
          type: integer
          description: Items already present, skipped whole.
        files:
          type: integer
          description: File bytes copied into the destination root.
        dest_root:
          type: string
          description: Path of the destination storage root.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal problems; omitted when empty.
    TreemapNode:
      type: object
      required:
        - name
        - path
        - count
        - covered
      properties:
        name:
          type: string
          description: Folder name (empty at the library root).
        path:
          type: string
          description: Folder path exactly as stored; pass it back as `path` to drill down.
        count:
          type: integer
          description: Metric rows in the subtree.
        covered:
          type: integer
          description: Distinct items in the subtree that have rows.
        direct:
          type: integer
          description: Rows for files directly in this folder. Omitted when 0.
        itemCount:
          type: integer
          description: Items in this folder's subtree (non-`items` metrics only). Omitted when 0.
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreemapNode'
          description: Largest first, up to `limit`. Omitted at the depth limit or when empty.
        otherCount:
          type: integer
          description: Rows in children beyond `limit`. Omitted when 0.
        otherDirs:
          type: integer
          description: Number of children beyond `limit`. Omitted when 0.
    Person:
      type: object
      description: >-
        A named (or auto-named `Unknown #N`) cluster of faces. Every person has a name so it can
        live in the taxonomy as a People-category tag.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: >-
            Stored name. May end in `_cluster` when a tag in another category owns the plain name;
            UIs strip the suffix for display.
        coverFaceId:
          type: integer
          format: int64
          description: >-
            Face used as the preview crop (`/media/facecrop?id=`): the chosen cover when it still
            belongs to the person, else the best face (confidence times bbox area). Omitted when the
            person has no faces.
        faceCount:
          type: integer
          description: Faces assigned to the person.
        mediaCount:
          type: integer
          description: Distinct media items containing the person.
        lockedCount:
          type: integer
          description: Faces that are user assignments (confirmed); these survive every recluster.
        createdAt:
          type: integer
          format: int64
          description: Unix seconds. Omitted when unknown.
        models:
          type: string
          description: >-
            Comma-separated recognizer id(s) of the person's faces (normally one, e.g. `anime-ccip`
            for a drawn-character cluster). Omitted when the person has no faces.
      required:
        - id
        - name
        - faceCount
        - mediaCount
        - lockedCount
    Face:
      type: object
      description: >-
        One stored face detection. Bounding-box coordinates are relative (0-1 of the image size).
        Crops are served by `/media/facecrop?id=`.
      properties:
        id:
          type: integer
          format: int64
        x:
          type: number
          description: Left edge (relative).
        'y':
          type: number
          description: Top edge (relative).
        w:
          type: number
          description: Width (relative).
        h:
          type: number
          description: Height (relative).
        score:
          type: number
          description: Detection confidence.
        frameTs:
          type: number
          description: Video frame time in seconds (0 for images).
        personId:
          type: integer
          format: int64
          description: Assigned person; 0 when unassigned.
        assignedBy:
          type: string
          enum:
            - auto
            - user
            - ''
          description: '`auto` (clustering), `user` (confirmed by hand), or empty when unassigned.'
      required:
        - id
        - x
        - 'y'
        - w
        - h
        - score
        - frameTs
        - personId
        - assignedBy
    PersonReviewFace:
      type: object
      description: One face in the person review payload.
      properties:
        id:
          type: integer
          format: int64
          description: Face id.
        path:
          type: string
          description: Media path.
        frameTs:
          type: number
          description: Video frame time in seconds (0 for images).
        detScore:
          type: number
          description: Detection confidence.
        assignedBy:
          type: string
          enum:
            - auto
            - user
          description: '`auto` (clustering) or `user` (confirmed).'
        typicality:
          type: number
          description: >-
            Cosine similarity to the group center (see the operation). Low values are the outliers
            worth reviewing first; 0 when it cannot be computed (single face or mixed-dimension
            group).
      required:
        - id
        - path
        - frameTs
        - detScore
        - assignedBy
        - typicality
    UngroupedFace:
      type: object
      description: One face not yet assigned to any person.
      properties:
        id:
          type: integer
          format: int64
          description: Face id.
        path:
          type: string
          description: Media path.
        frameTs:
          type: number
          description: Video frame time in seconds (0 for images).
        detScore:
          type: number
          description: Detection confidence.
        model:
          type: string
          description: Recognizer id.
      required:
        - id
        - path
        - frameTs
        - detScore
        - model
    FaceHitItem:
      type: object
      description: >-
        A `ScoredMediaItem` (one per media path) with the best matching face attached. `score` is
        that face's cosine similarity.
      allOf:
        - $ref: '#/components/schemas/ScoredMediaItem'
        - type: object
          properties:
            faceId:
              type: integer
              format: int64
              description: The matching face.
            face:
              type: object
              description: The matching face's relative bounding box.
              properties:
                x:
                  type: number
                'y':
                  type: number
                w:
                  type: number
                h:
                  type: number
                frameTs:
                  type: number
                  description: Video frame time in seconds.
                personId:
                  type: integer
                  format: int64
                  description: Assigned person; 0 when unassigned.
              required:
                - x
                - 'y'
                - w
                - h
                - frameTs
                - personId
          required:
            - faceId
            - face
    FaceTuning:
      type: object
      description: Face-grouping tuner (the People panel Tune sliders), stored in the server config.
      properties:
        thresholdOffset:
          type: number
          description: Added to the clustering similarity threshold, -0.2 to 0.3. Default 0.
        minCluster:
          type: integer
          description: Minimum faces for a new group, 1-50. Default 3.
        minQuality:
          type: number
          description: Minimum face quality, between 0 and 1 exclusive. Default 0.75.
      required:
        - thresholdOffset
        - minCluster
        - minQuality
    FaceStats:
      type: object
      properties:
        faces:
          type: array
          description: Per recognizer, ordered by model id.
          items:
            type: object
            properties:
              model:
                type: string
                description: Recognizer id.
              count:
                type: integer
                description: Stored faces.
              bytes:
                type: integer
                format: int64
                description: Total vector blob bytes.
            required:
              - model
              - count
              - bytes
        total_faces:
          type: integer
        total_bytes:
          type: integer
          format: int64
        scans:
          type: integer
          description: Face-scan markers (items scanned, including those with no faces).
        people:
          type: object
          properties:
            total:
              type: integer
            named:
              type: integer
              description: People with a non-empty name.
            unnamed:
              type: integer
          required:
            - total
            - named
            - unnamed
        index:
          type: object
          description: The in-memory face search index.
          properties:
            model:
              type: string
              description: Recognizer the index holds; empty when not built.
            vectors:
              type: integer
              description: Vectors in the index.
          required:
            - model
            - vectors
      required:
        - faces
        - total_faces
        - total_bytes
        - scans
        - people
        - index
    DuplicateGroup:
      type: object
      description: >-
        A cluster of media whose visual embeddings are at least `threshold` similar to the anchor
        item.
      properties:
        id:
          type: integer
          format: int64
        model:
          type: string
          description: Embedding model the scan used.
        threshold:
          type: number
          description: Similarity floor the scan used, 0-1.
        anchorPath:
          type: string
          description: The item every member score is measured against.
        keeperPath:
          type: string
          description: >-
            Default merge target: the highest-resolution active member, then the largest file, then
            the anchor, then the shortest path. The anchor when no member is active.
        status:
          type: string
          enum:
            - pending
            - dismissed
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
        updatedAt:
          type: integer
          format: int64
          description: Unix seconds.
        memberCount:
          type: integer
          description: Every member row, excluded ones included.
        activeCount:
          type: integer
          description: Members not excluded.
        minScore:
          type: number
          description: Lowest active member similarity to the anchor (how tight the group is).
        members:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateMember'
          description: Anchor first, then by similarity, excluded members last.
      required:
        - id
        - model
        - threshold
        - anchorPath
        - keeperPath
        - status
        - createdAt
        - updatedAt
        - memberCount
        - activeCount
        - minScore
        - members
      example:
        id: 311
        model: siglip2
        threshold: 0.97
        anchorPath: D:/photos/IMG_0001.jpg
        keeperPath: D:/photos/IMG_0001.jpg
        status: pending
        createdAt: 1761900000
        updatedAt: 1761900000
        memberCount: 2
        activeCount: 2
        minScore: 0.985
        members:
          - path: D:/photos/IMG_0001.jpg
            mtimeMs: 0
            width: 4032
            height: 3024
            battles: 0
            size: 3311221
            score: 1
            excluded: false
            anchor: true
            keeper: true
          - path: D:/photos/IMG_0001 (1).jpg
            mtimeMs: 0
            width: 1600
            height: 1200
            size: 402113
            score: 0.985
            excluded: false
            anchor: false
            keeper: false
    DuplicateMember:
      type: object
      description: >-
        A group member in the flat renderer item shape plus review flags. `elo`, `battles`, `width`,
        `height` and `size` are omitted when unknown.
      properties:
        path:
          type: string
        mtimeMs:
          type: integer
          description: Always 0.
        elo:
          type: number
        battles:
          type: integer
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
          format: int64
          description: File size in bytes; present only when known and non-zero.
        score:
          type: number
          description: Cosine similarity to the anchor (the anchor scores 1).
        excluded:
          type: boolean
          description: Pulled out of the group ("not a duplicate").
        anchor:
          type: boolean
          description: This member is the anchor.
        keeper:
          type: boolean
          description: This member is the default merge target.
      required:
        - path
        - mtimeMs
        - score
        - excluded
        - anchor
        - keeper
    DuplicateStats:
      type: object
      properties:
        pending:
          type: integer
          description: Pending groups.
        dismissed:
          type: integer
          description: Dismissed groups.
        members:
          type: integer
          description: Member rows across all groups.
        pendingItems:
          type: integer
          description: 'Active members of pending groups: library items still awaiting a decision.'
      required:
        - pending
        - dismissed
        - members
        - pendingItems
    DuplicateMergeResult:
      type: object
      description: What a merge changed. The same shape as the `POST /api/media/merge-metadata` response.
      properties:
        target:
          type: string
          description: The kept path.
        sources:
          type: array
          items:
            type: string
          description: Paths merged in.
        tags:
          type: integer
          format: int64
          description: Tag rows the target gained.
        embeddings:
          type: integer
          format: int64
          description: Embedding rows the target gained.
        transcript:
          type: boolean
          description: >-
            The target's transcript was filled from a source, or a source's `.vtt` sidecar was moved
            next to it.
        transcriptFile:
          type: string
          description: The moved `.vtt` path; empty when none.
        deleted:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Sources removed from disk and database. `null` when none.
        failed:
          type:
            - array
            - 'null'
          items:
            type: string
          description: >-
            Sources that could not be deleted (s3:// paths, delete errors); they keep their rows.
            `null` when none.
        facesRemoved:
          type: integer
          format: int64
          description: Face rows erased with the sources.
      required:
        - target
        - sources
        - tags
        - embeddings
        - transcript
        - transcriptFile
        - deleted
        - failed
        - facesRemoved
    SwipeMediaTag:
      type: object
      properties:
        label:
          type: string
        category:
          type: string
      required:
        - label
        - category
    SwipeMediaItem:
      type: object
      description: A media row as the Swipe app receives it.
      properties:
        path:
          type: string
        description:
          type:
            - string
            - 'null'
          description: AI description; `null` when none.
        size:
          type:
            - integer
            - 'null'
          format: int64
          description: File size in bytes.
        hash:
          type:
            - string
            - 'null'
          description: Content hash.
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        tags:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SwipeMediaTag'
          description: May be `null` when the item has no tags.
        exists:
          type: boolean
          description: Whether the file exists on disk.
        duplicateCount:
          type: integer
          format: int64
          description: Other items with the same hash.
      required:
        - path
        - description
        - size
        - hash
        - width
        - height
        - tags
        - exists
        - duplicateCount
    SwipeResponse:
      type: object
      properties:
        items:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SwipeMediaItem'
          description: The page. The shuffle mode returns `null` (not an empty array) when the pool is empty.
        has_more:
          type: boolean
          description: More items exist past this page.
        total_count:
          type: integer
          description: Not populated by this endpoint; always 0.
      required:
        - items
        - has_more
        - total_count
    SwipeManifest:
      type: object
      description: Web app manifest (fixed content).
      properties:
        name:
          type: string
        short_name:
          type: string
        description:
          type: string
        start_url:
          type: string
        display:
          type: string
        orientation:
          type: string
        background_color:
          type: string
        theme_color:
          type: string
        icons:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              sizes:
                type: string
              type:
                type: string
              purpose:
                type: string
            required:
              - src
              - sizes
              - type
              - purpose
      required:
        - name
        - short_name
        - description
        - start_url
        - display
        - orientation
        - background_color
        - theme_color
        - icons
    PromptReference:
      type: object
      description: One image, clip or audio file the model sees, with the token the prompt uses for it.
      properties:
        token:
          type: string
          description: For example `<image1>` (retouch) or `<Picture 1>`, `<Video 1>`, `<Audio 1>` (reshoot).
        path:
          type: string
        kind:
          type: string
          enum:
            - image
            - video-frame
            - video
            - audio
      required:
        - token
        - path
        - kind
    PromptPreview:
      type: object
      description: The expanded prompt of the first run of a job.
      properties:
        engine:
          type: string
          enum:
            - loki-retouch
            - loki-reshoot
        prompt:
          type: string
          description: >-
            The instruction as the engine expands it (empty when a preset needs the engine and it is
            not installed).
        modelInput:
          type: string
          description: >-
            Retouch only: the whole text-encoder turn, every reference announced by its token, then
            the prompt. Omitted when empty.
        references:
          type: array
          items:
            $ref: '#/components/schemas/PromptReference'
        runs:
          type: integer
          description: Engine runs the job makes (one per image in a retouch batch; reshoot is always 1).
        fromEngine:
          type: boolean
          description: False when the engine is not installed and the prompt was assembled by the server.
        note:
          type: string
          description: >-
            Explanation when the prompt is partial or shown for the first of several images. Omitted
            when empty.
      required:
        - engine
        - prompt
        - references
        - runs
        - fromEngine
    ReshootModelChoice:
      type: object
      properties:
        file:
          type: string
          description: Model file name; pass it as the job's `dit` option.
        label:
          type: string
          description: Display name.
        recipe:
          type: string
          enum:
            - h3
            - fast
          description: Sampling recipe the model uses.
      required:
        - file
        - label
        - recipe
    DirectMLInstallResult:
      type: object
      properties:
        installed:
          type: boolean
          description: Whether the DirectML runtime is present in the data directory.
        error:
          type: string
          description: 'POST only: why the install failed.'
      required:
        - installed
    EnginesConfig:
      type: object
      description: The `engines` section of the server config.
      properties:
        strategy:
          type: string
          enum:
            - local
            - pool
            - hybrid
          default: local
          description: >-
            Where engines run unless routed otherwise. Omitted when empty; anything unknown is saved
            as `local`.
        pools:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/WorkerPool'
          description: Worker pools; `null` when there are none.
        routes:
          type:
            - object
            - 'null'
          additionalProperties:
            type: string
          description: >-
            Per-engine override of the strategy, keyed by engine (`loki-retouch`, ...; `retouch` is
            accepted and prefixed). Values: `local`, `pool`, `pool:<name>`, `hybrid`, or `""` to
            follow the strategy. `null` when empty.
        fallback:
          type: boolean
          description: >-
            With strategy `pool`, lets a run use this machine's GPU when no pool worker is reachable
            (`hybrid` always may).
        localOnly:
          type: boolean
          description: >-
            Overrides the strategy and every route so all engines run on this machine while pools
            stay configured.
      required:
        - pools
        - routes
        - fallback
        - localOnly
    WorkerPool:
      type: object
      description: A group of interchangeable GPU workers.
      properties:
        name:
          type: string
          description: Unique (case-insensitive) pool name. Pools with a blank name are dropped.
        kind:
          type: string
          enum:
            - nodes
            - runpod
          description: '`nodes` = loki-worker HTTP servers; `runpod` = a RunPod queue-based serverless endpoint.'
        disabled:
          type: boolean
          description: Kept in the config but never used.
        engines:
          type: array
          items:
            type: string
          description: Engines this pool serves; empty means every engine its workers report.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkerNode'
          description: '`nodes` pools: the workers.'
        endpointId:
          type: string
          description: '`runpod` pools: the endpoint id. A RunPod pool without one is ignored.'
        apiKey:
          type: string
          description: '`runpod` pools: the RunPod API key. **Redacted** (`<redacted>`) in responses.'
        maxJobs:
          type: integer
          default: 4
          description: >-
            `runpod` pools: jobs in flight on the endpoint (match its max workers). <= 0 is saved as
            4.
        transfer:
          $ref: '#/components/schemas/PoolTransfer'
        provider:
          $ref: '#/components/schemas/PoolProvider'
        fromEnv:
          type: boolean
          description: >-
            Read-only: the pool comes from `LOWKEY_ENGINES` or `LOWKEY_WORKER_NODES` and is never
            written to the config file.
      required:
        - name
        - kind
    WorkerNode:
      type: object
      description: One loki-worker HTTP server.
      properties:
        name:
          type: string
          description: Display name; defaults to the URL.
        url:
          type: string
          description: Base URL (trailing `/` removed). Nodes without one are dropped.
        token:
          type: string
          description: Bearer token for the worker. **Redacted** in responses.
        disabled:
          type: boolean
          description: Stays listed but gets no work (draining).
      required:
        - url
    PoolTransfer:
      type: object
      description: >-
        The bucket serverless jobs pass files through: a configured S3 storage root by label
        (`root`), or a bucket of its own. Nodes ignore it. Without it, RunPod jobs carry files
        inline (up to 7 MB).
      properties:
        root:
          type: string
          description: Label of an S3 storage root to use.
        endpoint:
          type: string
          description: S3 endpoint URL.
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
          description: Key prefix inside the bucket.
        accessKey:
          type: string
          description: '**Redacted** in responses.'
        secretKey:
          type: string
          description: '**Redacted** in responses.'
    PoolProvider:
      type: object
      description: What `lokictl pool create` provisioned, so `lokictl pool destroy` can take it down.
      properties:
        name:
          type: string
          description: Provider, for example `runpod`.
        podIds:
          type: array
          items:
            type: string
        templateId:
          type: string
        endpointId:
          type: string
      required:
        - name
    EngineStatus:
      type: object
      description: The dispatcher's state.
      properties:
        strategy:
          type: string
          enum:
            - local
            - pool
            - hybrid
        routes:
          type: object
          additionalProperties:
            type: string
          description: The configured routes; omitted when empty.
        fallback:
          type: boolean
        localOnly:
          type: boolean
        placement:
          type: object
          additionalProperties:
            type: string
          description: >-
            Effective rule per engine (`loki-retouch`, `loki-reshoot`, `loki-dream`,
            `loki-segment`): `local`, `pool`, `pool:<name>` or `hybrid`.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/EngineTargetStatus'
          description: >-
            Every place engines can run; the first is always this machine (`key` `local`). Disabled
            pools and nodes are not listed.
      required:
        - strategy
        - fallback
        - localOnly
        - placement
        - targets
    EngineTargetStatus:
      type: object
      description: One place engines run.
      properties:
        key:
          type: string
          description: '`local`, `<pool>/<node name>` for a node, or `<pool>` for a RunPod endpoint.'
        pool:
          type: string
          description: Pool name; omitted for `local`.
        kind:
          type: string
          enum:
            - local
            - node
            - runpod
        url:
          type: string
          description: Node base URL (nodes only).
        healthy:
          type: boolean
          description: Last probe succeeded; always true for `local`.
        checked:
          type: string
          format: date-time
          description: Last probe time; omitted until probed.
        error:
          type: string
          description: Last probe error.
        running:
          type: integer
          description: Jobs this server has in flight on the target.
        slots:
          type: integer
          description: >-
            Jobs it runs at once: 1 for local, `maxJobs` for RunPod, the worker's reported slots
            (default 1) for a node.
        info:
          $ref: '#/components/schemas/WorkerInfo'
        runpod:
          $ref: '#/components/schemas/RunPodHealth'
        engines:
          type: array
          items:
            type: string
          description: The pool's `engines` restriction, when set.
        transfer:
          type: string
          description: >-
            How files reach a RunPod worker: `storage root <label>`, `bucket <name>` or `inline
            (files up to 7 MB)`.
      required:
        - key
        - kind
        - healthy
        - running
        - slots
    WorkerInfo:
      type: object
      description: A loki-worker's self-description (its `GET /v1/info`).
      properties:
        worker:
          type: string
          description: Worker name.
        version:
          type: string
        protocol:
          type: integer
          description: Wire protocol version.
        mode:
          type: string
        ready:
          type: boolean
        gpus:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              name:
                type: string
              totalMb:
                type: integer
              freeMb:
                type: integer
              busy:
                type: string
                description: Id of the job running on it.
            required:
              - index
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Engine name.
              version:
                type: string
              model:
                type: string
              path:
                type: string
                description: Executable on the worker; empty when not installed.
              states:
                type: array
                items:
                  type: string
                  enum:
                    - stopped
                    - starting
                    - idle
                    - busy
                description: State per GPU slot.
              resident:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    mb:
                      type: integer
                  required:
                    - key
                    - mb
                description: Models resident on the GPU.
              help:
                type: string
                description: The engine's `--help` text (only when requested).
            required:
              - name
        slots:
          type: integer
          description: GPU jobs run at once (one per GPU).
        running:
          type: integer
        queued:
          type: integer
        uptime:
          type: number
          description: Seconds.
        sessions:
          type: integer
          description: Open interactive sessions.
      required:
        - worker
        - version
        - protocol
        - mode
        - ready
        - gpus
        - tools
        - slots
        - running
        - queued
        - uptime
        - sessions
    RunPodHealth:
      type: object
      description: A RunPod endpoint's queue and worker counts.
      properties:
        jobs:
          type: object
          properties:
            completed:
              type: integer
            failed:
              type: integer
            inProgress:
              type: integer
            inQueue:
              type: integer
            retried:
              type: integer
          required:
            - completed
            - failed
            - inProgress
            - inQueue
            - retried
        workers:
          type: object
          properties:
            idle:
              type: integer
            initializing:
              type: integer
            ready:
              type: integer
            running:
              type: integer
            throttled:
              type: integer
            unhealthy:
              type: integer
          required:
            - idle
            - initializing
            - ready
            - running
            - throttled
            - unhealthy
      required:
        - jobs
        - workers
    LocalEngine:
      type: object
      description: One loki-* engine as installed on this machine.
      properties:
        engine:
          type: string
          description: Engine executable name.
        tool:
          $ref: '#/components/schemas/EngineDependencyItem'
        version:
          type: string
          description: The binary's `--version`, when installed.
        models:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/EngineDependencyItem'
          description: The model dependencies it runs with.
      required:
        - engine
        - tool
        - models
    EngineDependencyItem:
      type: object
      description: A dependency (tool or model) and its install state, as on the Dependencies page.
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
        feature:
          type: string
        description:
          type: string
        state:
          type: string
          description: Install state, for example `installed` or `missing`.
        version:
          type: string
        size_bytes:
          type: integer
        path:
          type: string
        error:
          type: string
        detail:
          description: Extra state detail (any JSON).
        source:
          type: string
          description: '`user` when it is the user''s own copy; omitted when managed.'
      required:
        - id
        - category
        - name
        - state
    SceneRect:
      type: object
      description: A rectangle in pixels (base-frame pixels unless stated otherwise).
      properties:
        x:
          type: integer
        'y':
          type: integer
        w:
          type: integer
        h:
          type: integer
      required:
        - x
        - 'y'
        - w
        - h
    SceneMask:
      type: object
      description: A mask as the editor draws it (opaque to the server).
      properties:
        shapes:
          description: The editor's strokes (any JSON).
        maskOpts:
          description: The editor's whole-mask settings (invert, expand, opacity; any JSON).
        feather:
          type: number
          description: Feather radius in pixels.
      required:
        - feather
    SceneGenMask:
      type: object
      description: >-
        The mask to generate with instead of the layer's own (the layer's mask without what only
        shapes the shown version). Used only when `mask` is a PNG data URL and `region` is
        non-empty.
      properties:
        shapes:
          description: Editor strokes (any JSON).
        maskOpts:
          description: Editor mask settings (any JSON).
        feather:
          type: number
          description: Clamped to 0-512.
        mask:
          type: string
          description: Full-frame PNG data URL (`data:image/png;base64,...`); alpha = coverage.
        region:
          $ref: '#/components/schemas/SceneRect'
      required:
        - mask
        - region
    SceneTrack:
      type: object
      description: A motion version's roto (server-owned).
      properties:
        jobId:
          type: string
          description: The `scene-track` job.
        state:
          $ref: '#/components/schemas/JobState'
        done:
          type: integer
        total:
          type: integer
        error:
          type: string
        prompts:
          type: array
          items:
            type: object
          description: The loki-segment `--prompts` entries it was tracked from.
        dir:
          type: string
          description: Folder of matte frames `00000.png`, ... (set once completed).
        frames:
          type: integer
          description: Number of matte frames (set once completed).
        video:
          type: string
          description: The clip with the matte as alpha (VP9 webm), for the stage.
      required:
        - jobId
        - state
        - done
        - total
        - prompts
    StitchReport:
      type: object
      description: Measurements of a stitch.
      properties:
        band:
          type: integer
        drift:
          type: number
          description: Mean displacement corrected near the edge, px.
        driftMax:
          type: number
          description: 95th percentile of the drift, px.
        tone:
          type: number
          description: Overall colour shift corrected (0-255 RGB distance).
        grainAdded:
          type: number
          description: Noise added (0-255 standard deviation).
        seamLength:
          type: integer
          description: px.
        residual:
          type: number
          description: What the seam still adds (0-255 excess gradient, mean along it).
        healPixels:
          type: integer
          description: Pixels where the seam still shows.
        skipped:
          type: string
          description: Why the stitch was skipped.
      required:
        - band
        - drift
        - driftMax
        - tone
        - grainAdded
        - seamLength
        - residual
        - healPixels
    SceneStitch:
      type: object
      description: The active still version blended into the picture under it (derived on every read).
      properties:
        path:
          type: string
          description: The stitched patch.
        seam:
          type: string
          description: Image drawing the seam for the editor.
        heal:
          type: string
          description: Where the seam still shows (input for `heal`).
        key:
          type: string
          description: Hash of the version, mask and everything below it.
        report:
          $ref: '#/components/schemas/StitchReport'
      required:
        - path
        - key
        - report
    SceneVersion:
      type: object
      description: One generation of a layer. Server-owned except `mask`.
      properties:
        path:
          type: string
          description: The file the engine produced (PNG for stills, MP4 for motion).
        region:
          $ref: '#/components/schemas/SceneRect'
        prompt:
          type: string
        duration:
          type: number
          description: 'Motion: seconds.'
        audio:
          type: boolean
          description: 'Motion: has a soundtrack.'
        note:
          type: string
          description: For example `boomerang of v2`, `re-finished v1`, `healed v3`.
        raw:
          type: string
          description: The engine's own output a finished (scene-lock) version was made from.
        jobId:
          type: string
        below:
          type: array
          items:
            type: string
          description: >-
            The stills the version was generated from, so the editor can tell when the stack under
            it changed.
        inputs:
          type: array
          items:
            type: string
          description: Images the engine was given (the crop, then references).
        track:
          $ref: '#/components/schemas/SceneTrack'
        mask:
          $ref: '#/components/schemas/SceneMask'
        stitch:
          $ref: '#/components/schemas/SceneStitch'
        created:
          type: string
          format: date-time
      required:
        - path
        - region
        - prompt
        - created
    SceneJob:
      type: object
      description: A layer's generation in flight (server-owned).
      properties:
        id:
          type: string
          description: The last job of the chain, whose output is the result.
        state:
          $ref: '#/components/schemas/JobState'
        done:
          type: integer
        total:
          type: integer
        region:
          $ref: '#/components/schemas/SceneRect'
        prompt:
          type: string
        input:
          type: string
          description: The crop sent to the engine.
        chain:
          type: array
          items:
            type: string
          description: 'Every job of the generation in order (motion: `reshoot`, then `scene-lock`).'
        requeued:
          type: integer
          description: Times a later step was queued again after being cancelled before it ran.
        step:
          type: string
          description: Command of the step running now, for example `reshoot` or `scene-lock`.
        note:
          type: string
        raw:
          type: string
        line:
          type: string
          description: The job's latest log line.
        below:
          type: array
          items:
            type: string
        refs:
          type: array
          items:
            type: string
          description: Reference files the engine was given.
        mask:
          $ref: '#/components/schemas/SceneMask'
      required:
        - id
        - state
        - done
        - total
        - region
        - prompt
        - input
    SceneLayer:
      type: object
      description: |
        One masked edit. The editor owns `name`, `kind`, `hidden`, `region`,
        `mask`, `shapes`, `maskOpts`, `feather`, `prompt`, `options` and
        `active`; `versions`, `job`, `queued` and `error` are server-owned.
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - still
            - motion
            - paint
        hidden:
          type: boolean
        region:
          $ref: '#/components/schemas/SceneRect'
        mask:
          type: string
          description: >-
            Full-frame PNG data URL (long edge <= 2048) whose alpha is the coverage, feather
            included. For paint layers, the painting itself (RGBA).
        shapes:
          description: The editor's strokes (any JSON).
        maskOpts:
          description: The editor's whole-mask settings (any JSON).
        feather:
          type: number
        prompt:
          type: string
        options:
          type: object
          additionalProperties: true
          description: >
            Editor-owned settings. Keys the server reads include:

            - `seed`, `steps` (still, default 25, 4-80), `engine` (`dream` in dream builds),
            `finish` (`sketch`, `colour`, `repose`), `paint` (id of the paint layer a finish uses),
            `grounding`, `strength`, `stitch` (false turns off edge blending), `guide` (paint layer
            kept out of the picture)

            - `refs`: array of `{layer}` or `{path}` references with an optional `note`

            - motion: `duration` (seconds, default 5, 1-15), `megapixels`, `model` (`fast`), `dit`
            (a file from `GET /api/reshoot/models`), `describe`, `sound`, `soundPrompt`, `voices`,
            `dialogue` (array of `{speaker, lang, text}`), `voiceRef`, `lock` and `detail` (default
            true), `matte`, `speed` (0.25-4), `offset`, `volume` (0-2)
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SceneVersion'
        active:
          type: integer
          minimum: -1
          description: Index into `versions` of the one shown; -1 = none.
        job:
          $ref: '#/components/schemas/SceneJob'
        queued:
          type: array
          items:
            $ref: '#/components/schemas/SceneJob'
          description: Generations started while `job` was in flight, oldest first.
        error:
          type: string
      required:
        - id
        - name
        - kind
        - region
        - mask
        - feather
        - prompt
        - versions
        - active
    SceneRender:
      type: object
      description: The latest export (server-owned).
      properties:
        jobId:
          type: string
        format:
          type: string
          enum:
            - video
            - still
        state:
          $ref: '#/components/schemas/JobState'
        done:
          type: integer
        total:
          type: integer
        output:
          type: string
          description: The exported file, once completed.
        error:
          type: string
      required:
        - jobId
        - format
        - state
        - done
        - total
    Scene:
      type: object
      description: A scene document.
      properties:
        id:
          type: string
        name:
          type: string
          description: Defaults to the source file name without extension.
        source:
          type: string
          description: Absolute path of the source image or video.
        sourceTime:
          type: number
          description: 'Video sources: seconds of the base frame.'
        base:
          type: string
          description: Path of the base frame PNG.
        width:
          type: integer
        height:
          type: integer
        layers:
          type: array
          items:
            $ref: '#/components/schemas/SceneLayer'
          description: Bottom to top.
        duration:
          type: number
          description: Export length in seconds; 0 = the longest visible motion layer (5 s when none).
        freeLoops:
          type: boolean
          description: >-
            Each motion layer loops at its own length instead of being retimed so the export loops
            seamlessly.
        render:
          $ref: '#/components/schemas/SceneRender'
        stitching:
          type: boolean
          description: Stitches are being made; poll until false.
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
      required:
        - id
        - name
        - source
        - base
        - width
        - height
        - layers
        - duration
        - created
        - updated
      example:
        id: 0b7e4c1a-3d2f-4a8e-9c61-5f2d8e7a1b90
        name: beach
        source: D:\photos\beach.jpg
        base: C:\ProgramData\Lowkey Media Server\scenes\0b7e4c1a-3d2f-4a8e-9c61-5f2d8e7a1b90\base.png
        width: 1920
        height: 1080
        layers:
          - id: l1
            name: Waves
            kind: motion
            region:
              x: 0
              'y': 600
              w: 1920
              h: 480
            mask: data:image/png;base64,iVBORw0...
            feather: 24
            prompt: gentle waves roll in
            versions: []
            active: -1
            job:
              id: 9a1c0d2e-7b3f-4e55-8a6d-2c4b1e0f9a77
              state: in_progress
              done: 3
              total: 8
              region:
                x: 0
                'y': 600
                w: 1920
                h: 480
              prompt: gentle waves roll in
              input: ...\motion-l1-1.png
              step: reshoot
        duration: 0
        created: '2026-10-31T12:00:00Z'
        updated: '2026-10-31T12:05:00Z'
    SceneUpdate:
      type: object
      description: >-
        The fields `PUT /api/scenes/{id}` reads (a full `Scene` may be sent; other fields are
        ignored).
      properties:
        name:
          type: string
          description: Blank keeps the current name.
        duration:
          type: number
          minimum: 0
          maximum: 60
          description: Clamped to 0-60.
        freeLoops:
          type: boolean
        layers:
          type: array
          description: >-
            The complete layer list, bottom to top. Entries without an `id`, with an id over 64
            characters, or repeating an id are skipped. Layers not listed are deleted.
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 64
              name:
                type: string
              kind:
                type: string
                enum:
                  - still
                  - motion
                  - paint
                description: Anything else becomes `still`.
              hidden:
                type: boolean
              region:
                $ref: '#/components/schemas/SceneRect'
              mask:
                type: string
                description: Empty, or a `data:image/png;base64,` URL; any other value keeps the stored mask.
              shapes:
                description: Any JSON.
              maskOpts:
                description: Any JSON.
              feather:
                type: number
                description: Clamped to 0-512.
              prompt:
                type: string
              options:
                type: object
                additionalProperties: true
              active:
                type: integer
                minimum: -1
                description: Ignored when out of range.
              versions:
                type: array
                description: Only each entry's `mask` is taken, matched to a stored version by `path`.
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    mask:
                      $ref: '#/components/schemas/SceneMask'
            required:
              - id
    SceneSummary:
      type: object
      description: A scene in a list (no masks).
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        base:
          type: string
        layers:
          type: integer
          description: Number of layers.
        motion:
          type: integer
          description: Number of motion layers.
        updated:
          type: string
          format: date-time
      required:
        - id
        - name
        - source
        - base
        - layers
        - motion
        - updated
    SceneRegionMap:
      type: object
      properties:
        dataUrl:
          type: string
          description: PNG data URL covering `region`; alpha = change or motion.
        region:
          $ref: '#/components/schemas/SceneRect'
      required:
        - dataUrl
        - region
    ScenePose:
      type: object
      properties:
        joints:
          type: array
          description: >-
            OpenPose's 18 joints in its order (nose, neck, right shoulder, ... left ear), frame
            pixels.
          items:
            type: object
            properties:
              x:
                type: number
              'y':
                type: number
              score:
                type: number
            required:
              - x
              - 'y'
              - score
      required:
        - joints
    SegmentRequest:
      type: object
      description: >-
        One pick. Coordinates are in the pixels of what is segmented: the picture (frame size), or
        with `layer` + `version` the clip.
      properties:
        text:
          type: string
          description: Text prompt (find objects by description).
        points:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 3
            maxItems: 3
          description: '`[x, y, 1|0]` (1 = this, 0 = not this).'
        box:
          type: array
          items:
            type: number
          description: '`[x, y, w, h]`; used only with exactly 4 numbers.'
        everything:
          type: boolean
          description: Segment every object.
        multimask:
          type: boolean
          description: Also return candidate readings (part / object / whole) for clicks and boxes.
        layer:
          type: string
          description: Motion layer id to segment a clip frame of.
        version:
          type: integer
          description: Version index of `layer`.
        frame:
          type: integer
          description: Clip frame (with `layer` + `version`).
    SegmentObject:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        score:
          type: number
        bbox:
          $ref: '#/components/schemas/SceneRect'
        mask:
          type: string
          description: PNG data URL (white, alpha = coverage) covering `rect`.
        rect:
          $ref: '#/components/schemas/SceneRect'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SegmentObject'
          description: Alternative readings, with `multimask`.
      required:
        - id
        - label
        - score
        - bbox
        - mask
        - rect
    SegmentResult:
      type: object
      properties:
        width:
          type: integer
          description: Width of what was segmented.
        height:
          type: integer
        objects:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SegmentObject'
          description: '`null` when nothing was found.'
        ms:
          type: integer
          description: Segmentation time in milliseconds.
      required:
        - width
        - height
        - objects
        - ms
    SceneDreamRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The picture to generate. Required (non-blank).
        negative:
          type: string
        size:
          type: string
          pattern: ^\d{3,4}x\d{3,4}$
          description: '`WxH`; ignored when it does not match.'
        turbo:
          type: boolean
        seed:
          type: integer
          description: Used when > 0.
      required:
        - prompt
    SceneDreamStatus:
      type: object
      properties:
        jobId:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        done:
          type: integer
        total:
          type: integer
        output:
          type: string
          description: The generated image, once completed.
        error:
          type: string
      required:
        - jobId
        - state
        - done
        - total
    DepStatusItem:
      type: object
      description: One dependency in `GET /api/deps/status`.
      properties:
        id:
          type: string
          description: Dependency id, e.g. `ffmpeg`, `yt-dlp`, `siglip2-base-patch16-224`, `loki-retouch`.
        category:
          type: string
          enum:
            - bundled
            - optional
            - model
            - tool
          description: >-
            `bundled` ships with the server; `optional` is a user-installed PATH tool; `model` and
            `tool` are downloadable from the models manifest.
        name:
          type: string
          description: Display name.
        feature:
          type: string
          description: >-
            User-facing capability this unlocks (optional, model and tool items; omitted when
            empty).
        description:
          type: string
          description: Longer explanation (optional, model and tool items; omitted when empty).
        state:
          type: string
          description: >
            Depends on `category`:

            - `bundled`: `ready`, `missing` or `broken` (the version command failed).

            - `optional`: `installed` or `not_installed`.

            - `model` / `tool`: `installed` or `missing`, or, while this server run tracks an
            install of it, the install state (`queued`, `downloading`, `extracting`, `verifying`,
            `installed`, `failed`, `cancelled`).
          enum:
            - ready
            - missing
            - broken
            - installed
            - not_installed
            - queued
            - downloading
            - extracting
            - verifying
            - failed
            - cancelled
        version:
          type: string
          description: >-
            First line of the tool's version output (bundled and optional items; omitted when
            unknown).
        size_bytes:
          type: integer
          format: int64
          description: Download size for this OS (model and tool items).
        path:
          type: string
          description: >-
            Where it lives. Bundled and optional items when found; models when installed (the
            managed folder, or for a user copy the PATH binary or weights folder).
        error:
          type: string
          description: Why a bundled item is missing or broken, or why a tracked install failed.
        detail:
          description: |
            Extra data, varying by item:
            - `optional`: an `OptionalToolHint` (always present).
            - `model` / `tool` with a tracked install: the `ModelInstall` progress object.
            - `model` / `tool` supplied by the user: `{"source": "path"}`.
            Omitted otherwise.
          oneOf:
            - $ref: '#/components/schemas/OptionalToolHint'
            - $ref: '#/components/schemas/ModelInstall'
            - type: object
              properties:
                source:
                  type: string
                  enum:
                    - path
              required:
                - source
        source:
          type: string
          enum:
            - user
          description: >-
            `user` when the item is the user's own copy, used as-is and never downloaded, replaced
            or deleted by the server. Omitted for managed items.
      required:
        - id
        - category
        - name
        - state
    OptionalToolHint:
      type: object
      description: How to install an optional tool.
      properties:
        description:
          type: string
        commands:
          type: array
          description: Per-OS install commands (omitted when none).
          items:
            type: object
            properties:
              os:
                type: string
                enum:
                  - windows
                  - darwin
                  - linux
              label:
                type: string
                description: Installer name, e.g. `winget`, `Homebrew`.
              command:
                type: string
                description: Command line or instruction.
            required:
              - os
              - label
              - command
        docs_url:
          type: string
          description: Installation docs link.
    ModelInstall:
      type: object
      description: Snapshot of one model or tool install attempt (also each progress SSE event).
      properties:
        id:
          type: string
          description: Model id.
        state:
          type: string
          enum:
            - queued
            - downloading
            - extracting
            - verifying
            - installed
            - failed
            - cancelled
          description: >-
            `extracting` means archive members are being unpacked; byte counts then refer to the
            unpacked data, not the download.
        current_file:
          type: string
          description: >-
            File being processed; an archive being unpacked is reported as `<name> (extracting)`.
            Omitted when empty.
        bytes_done:
          type: integer
          format: int64
          description: Bytes processed of the current step.
        bytes_total:
          type: integer
          format: int64
          description: Total bytes of the current step (0 when unknown).
        error:
          type: string
          description: Failure message when `state` is `failed`. Omitted otherwise.
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - state
        - bytes_done
        - bytes_total
        - started_at
        - updated_at
    ModelVerifyResult:
      type: object
      description: Result of `POST /api/deps/models/{id}/verify`.
      properties:
        id:
          type: string
        source:
          type: string
          enum:
            - user
          description: Set when the checked copy is the user's own. Omitted for managed downloads.
        location:
          type: string
          description: Where the user's copy lives. Only with `source`.
        note:
          type: string
          description: Explanation that only presence and size are checked for a user copy. Only with `source`.
        files:
          type: object
          description: |
            Map of relative file path (or, for a user-supplied tool, the
            binary's file name) to a result: `ok`, `missing`,
            `ok (extracted from checksum-verified archive)`, `ok (on PATH)`,
            a checksum error message, or a size-mismatch note.
          additionalProperties:
            type: string
      required:
        - id
        - files
    SetupModelGroup:
      type: object
      description: A feature card in the wizard's model step, mapping to downloadable model ids.
      properties:
        id:
          type: string
          description: |
            `visual-search`, `autotag`, `faces`, `transcription` everywhere;
            `ai-image-editing`, `ai-video`, `ai-select` on Windows and Linux;
            `ai-generate` on Windows and Linux in Dream builds; `splats` on
            Windows only.
        title:
          type: string
        desc:
          type: string
        recommended:
          type: boolean
          description: Pre-selected in the wizard.
        sizeBytes:
          type: integer
          format: int64
          description: Sum of the models' download sizes for this OS, from the manifest.
        models:
          type: array
          items:
            type: string
          description: Model ids to download via `POST /api/deps/models/{id}/download`.
      required:
        - id
        - title
        - desc
        - recommended
        - sizeBytes
        - models
    SetupStorageRoot:
      type: object
      description: A storage root as saved in the config (`roots`).
      properties:
        type:
          type: string
          enum:
            - local
            - s3
          description: Empty is treated as `local` on save.
        path:
          type: string
          description: Absolute folder (local roots).
        label:
          type: string
          description: Display name.
        default:
          type: boolean
          description: Destination for uploads and downloads.
        endpoint:
          type: string
          description: S3 endpoint URL.
        region:
          type: string
        bucket:
          type: string
          description: Bucket name (required for S3 roots).
        prefix:
          type: string
          description: Key prefix inside the bucket.
        accessKey:
          type: string
        secretKey:
          type: string
          description: Redacted to `•••` in `GET /setup/api/state`.
        thumbnailPrefix:
          type: string
          description: Key prefix for thumbnails.
    SetupState:
      type: object
      description: Response of `GET /setup/api/state`.
      properties:
        setupComplete:
          type: boolean
          description: Whether first-run setup has been completed.
        defaultDBPath:
          type: string
          description: The database path the server uses when none is configured.
        activeDBPath:
          type: string
          description: The configured `dbPath` (may be empty).
        dataDir:
          type: string
          description: The server's data directory.
        homeDir:
          type: string
          description: Home directory of the user the server runs as (empty if unknown).
        os:
          type: string
          description: 'Go `GOOS`: `windows`, `darwin`, `linux`.'
        roots:
          type: array
          description: >-
            Configured storage roots (empty array when none), with any S3 `secretKey` replaced by
            `•••`.
          items:
            $ref: '#/components/schemas/SetupStorageRoot'
        hasRealUsers:
          type: boolean
          description: The active database has an account other than the bootstrap default admin.
        authed:
          type: boolean
          description: The request carried a valid credential.
        deps:
          type: array
          description: Same as `GET /api/deps/status`.
          items:
            $ref: '#/components/schemas/DepStatusItem'
        modelGroups:
          type: array
          items:
            $ref: '#/components/schemas/SetupModelGroup'
      required:
        - setupComplete
        - defaultDBPath
        - activeDBPath
        - dataDir
        - homeDir
        - os
        - roots
        - hasRealUsers
        - authed
        - deps
        - modelGroups
    SetupBrowseResult:
      type: object
      description: A folder listing for the wizard's picker.
      properties:
        path:
          type: string
          description: The cleaned path listed (empty for the starting locations).
        parent:
          type:
            - string
            - 'null'
          description: >-
            Folder to go "up" to. Empty string at a drive or filesystem root (meaning the starting
            locations); `null` when listing the starting locations.
        entries:
          type: array
          description: Subfolders (or starting locations), sorted by name.
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
                description: Absolute path.
            required:
              - name
              - path
        exists:
          type: boolean
          description: The folder exists (always true for the starting locations).
        writable:
          type: boolean
          description: A temp file could be created in the folder. False for the starting locations.
      required:
        - path
        - parent
        - entries
        - exists
        - writable
    OnboardingState:
      type: object
      properties:
        shown:
          type: boolean
          description: The tour has been shown and dismissed.
        dismissed_at:
          type: string
          format: date-time
          description: When it was dismissed (UTC). Omitted when not dismissed.
      required:
        - shown
  parameters:
    JobIdPath:
      name: id
      in: path
      required: true
      description: Job id (UUID, or the node id given to `POST /workflow`).
      schema:
        type: string
    DepModelId:
      name: id
      in: path
      required: true
      description: >-
        Model or tool id from the models manifest (the `id` of a `model` or `tool` item in `GET
        /api/deps/status`).
      schema:
        type: string
        example: siglip2-base-patch16-224
  responses:
    DepsUnauthorized:
      description: Only while *Allow Public Access* is on, when the request has no admin credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    SetupForbidden:
      description: Setup is complete and the request carries no valid credential.
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: setup is complete; authentication required
security:
  - bearer: []
  - apiKey: []
  - cookie: []
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Exchange a username and password for a JWT.
      description: >
        On success the JWT is returned in the body and also set as the `auth_token` cookie
        (HttpOnly, SameSite=Lax, `Path=/`, expiring after 365 days, the same lifetime as the token).
        CORS on this route echoes a `chrome-extension://` or `moz-extension://` origin, otherwise
        allows `http://localhost:1212`, with credentials. `OPTIONS` answers `200` with no body.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: alice
              password: correct-horse
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: '`auth_token=<jwt>; Path=/; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - token
                  - setup_required
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  token:
                    type: string
                    description: 'The JWT. Use it as `Authorization: Bearer <token>`.'
                  setup_required:
                    type: boolean
                    description: >-
                      True when the login used the temporary `admin` account and it is still the
                      only account. Requests made with this token are refused until a real user is
                      created.
              example:
                status: ok
                token: eyJhbGciOiJIUzI1NiIs...
                setup_required: false
        '400':
          description: Body is not valid JSON. Plain text `Invalid JSON`.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: >-
            Wrong username or password (or a database error during lookup). The body is the text
            `{"error":"Invalid credentials"}` sent with a `text/plain` content type.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST or OPTIONS. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logout
      summary: Clear the session cookie.
      description: >
        Expires the `auth_token` cookie. It does not revoke the JWT itself: a copy of the token held
        elsewhere stays valid until it expires. Any method other than POST and OPTIONS (for example
        a browser `GET /auth/logout`) clears the cookie and answers `302` to `/login`.
      x-access: public
      security: []
      responses:
        '200':
          description: Cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        '302':
          description: Returned for non-POST methods. Redirects to `/login`.
  /auth/status:
    get:
      tags:
        - Authentication
      operationId: getAuthStatus
      summary: Report whether the request carries a valid credential.
      description: >
        Never fails: an invalid credential reports `loggedIn: false`. Header credentials are checked
        first. When the credential is the `auth_token` cookie, the response also carries the
        session's JWT in `token`, so the embedded web viewer can use it as a Bearer token. The
        handler does not check the method; every method except OPTIONS behaves like GET.
      x-access: public
      security: []
      responses:
        '200':
          description: Credential status.
          content:
            application/json:
              schema:
                type: object
                required:
                  - loggedIn
                  - publicAccess
                properties:
                  loggedIn:
                    type: boolean
                  username:
                    type: string
                    description: Present when `loggedIn` is true.
                  publicAccess:
                    type: boolean
                    description: Whether Allow Public Access is on.
                  defaultStartPath:
                    type: string
                    description: >-
                      The configured default start path for the viewer. Present when `loggedIn` is
                      true.
                  token:
                    type: string
                    description: The cookie session's JWT. Present only when the credential was the cookie.
              examples:
                header:
                  value:
                    loggedIn: true
                    username: alice
                    publicAccess: false
                    defaultStartPath: D:\Media
                anonymous:
                  value:
                    loggedIn: false
                    publicAccess: false
  /auth/users:
    get:
      tags:
        - Authentication
      operationId: listUsers
      summary: List user accounts.
      description: >-
        The route skips the auth middleware so the first account can be created before any
        credential exists (see POST); the handler itself requires a valid credential (header or
        cookie) to list users.
      x-access: admin
      security: []
      responses:
        '200':
          description: Users, ordered by username.
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type:
                      - array
                      - 'null'
                    description: '`null` when the users table is empty.'
                    items:
                      $ref: '#/components/schemas/AuthUser'
              example:
                users:
                  - id: 2
                    username: alice
                    created_at: 1735689600
        '401':
          description: No valid credential (header or cookie).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
        '500':
          description: Database error. Plain text.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - Authentication
      operationId: createUser
      summary: Create a user account.
      description: >
        Open without a credential only while setup is required (the temporary `admin` account is the
        only account). After that the caller must present a valid credential (header or cookie).
        Creating a user also deletes the temporary `admin` account if it still exists. The username
        `admin` is reserved.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Must not be `admin` or an existing username.
                password:
                  type: string
            example:
              username: bob
              password: s3cret-pass
      responses:
        '201':
          description: Created. The body is `{"status":"created"}` (no `Content-Type` header is set).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - created
        '400':
          description: Invalid JSON, or `username`/`password` empty. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: >-
            Setup is complete and the request has no valid credential. Body is the text
            `{"error":"unauthorized"}` with a `text/plain` content type.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Username taken, reserved name `admin`, or database error. Plain-text message.
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - Authentication
      operationId: deleteUser
      summary: Delete a user account and revoke its API keys.
      description: >-
        Requires a valid credential (header or cookie). The last remaining user cannot be deleted.
        Deleting a username that does not exist still answers `200`.
      x-access: admin
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted. The body is `{"status":"deleted"}` (no `Content-Type` header is set).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - deleted
        '400':
          description: '`username` missing. Plain text.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: No valid credential (header or cookie).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unauthorized
        '500':
          description: '`cannot delete the last user`, or a database error. Plain text.'
          content:
            text/plain:
              schema:
                type: string
  /auth/keys:
    get:
      tags:
        - Authentication
      operationId: listAPIKeys
      summary: List API keys (without their secret values).
      x-access: admin
      responses:
        '200':
          description: Every key, for every user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
              example:
                keys:
                  - id: 3
                    username: alice
                    name: ci
                    prefix: lk_ab12cd34
                    created_at: 1735689600
                    last_used_at: 1735776000
        '500':
          description: Database error. Plain text.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - Authentication
      operationId: createAPIKey
      summary: Create an API key. The plaintext key is returned only once.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Label for the key. Must not be blank.
                username:
                  type: string
                  description: >-
                    User the key acts as. Defaults to the authenticated caller. Any existing user
                    may be named.
            example:
              name: ci
              username: alice
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - key
                  - id
                  - name
                  - username
                  - prefix
                properties:
                  status:
                    type: string
                    enum:
                      - created
                  key:
                    type: string
                    description: 'The full key: `lk_` followed by 64 hex characters. Not retrievable later.'
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  username:
                    type: string
                  prefix:
                    type: string
                    description: First 11 characters of the key (`lk_` + 8 hex), stored for identification.
              example:
                status: created
                key: lk_ab12cd34...
                id: 3
                name: ci
                username: alice
                prefix: lk_ab12cd34
        '400':
          description: >-
            Invalid JSON, blank `name`, no username resolvable, or the named user does not exist.
            Plain text.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            Database error, or the user is the temporary `admin` account (keys cannot be created for
            it). Plain text.
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags:
        - Authentication
      operationId: deleteAPIKey
      summary: Revoke an API key.
      x-access: admin
      parameters:
        - name: id
          in: query
          required: true
          description: Key id from the listing.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Revoked (also returned when no key had that id).
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - deleted
        '400':
          description: '`id` missing or not an integer. Plain text `Key id required`.'
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Database error. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /auth/cli/authorize:
    get:
      tags:
        - Authentication
      operationId: cliAuthorizePage
      summary: Browser approval page for the CLI loopback login flow.
      description: >
        Step 1 of the RFC 8252 loopback flow with PKCE used by `lokictl login` and the viewer's
        "Sign in with browser". The client listens on `127.0.0.1:<port>`, generates a PKCE verifier
        and opens this page. Only the `auth_token` cookie session counts here (header credentials
        are ignored). With no session the browser is redirected to `/login?redirect=<this URL>`. The
        page shows the key name and user, and posts the same parameters back to this URL with
        `action=approve` or `action=deny`.
      x-access: public
      security:
        - cookie: []
      parameters:
        - name: port
          in: query
          required: true
          description: Loopback port the client listens on.
          schema:
            type: integer
            minimum: 1
            maximum: 65535
        - name: state
          in: query
          required: true
          description: Opaque client state, echoed back on the callback.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,128}$
        - name: code_challenge
          in: query
          required: true
          description: base64url (no padding) SHA-256 of the PKCE verifier (S256).
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
        - name: name
          in: query
          required: false
          description: >-
            Name for the API key that will be minted. Control characters are stripped; truncated to
            64 bytes.
          schema:
            type: string
            default: lokictl
            maxLength: 64
      responses:
        '200':
          description: 'The approval page (`Cache-Control: no-store`).'
          content:
            text/html:
              schema:
                type: string
        '302':
          description: No browser session. Redirects to `/login?redirect=...`.
        '400':
          description: '`invalid port`, `invalid state` or `invalid code_challenge`. Plain text.'
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The session belongs to the temporary `admin` account. Plain text.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - Authentication
      operationId: cliAuthorizeDecision
      summary: Approve or deny the CLI login and redirect to the loopback callback.
      description: >
        Submitted by the approval page. The redirect target is always built server-side as
        `http://127.0.0.1:<port>/callback`. On approve, a one-time authorization code bound to the
        session user, the PKCE challenge and the key name is minted (single use, expires after 2
        minutes) and the browser is sent to `...callback?code=<code>&state=<state>`. On deny (any
        `action` other than `approve`), it is sent to
        `...callback?error=access_denied&state=<state>`. If the browser sends an `Origin` header,
        its host must equal the request `Host`.
      x-access: public
      security:
        - cookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - port
                - state
                - code_challenge
                - action
              properties:
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                state:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{8,128}$
                code_challenge:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
                name:
                  type: string
                  default: lokictl
                  maxLength: 64
                action:
                  type: string
                  enum:
                    - approve
                    - deny
      responses:
        '303':
          description: >-
            Redirect to the loopback callback with `code` and `state`, or `error=access_denied` and
            `state`.
        '400':
          description: Unparseable form or invalid `port`/`state`/`code_challenge`. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Approve without a valid `auth_token` cookie. Plain text `Not logged in`.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Cross-origin post, or the session is the temporary `admin` account. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Could not create the code. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /auth/cli/token:
    post:
      tags:
        - Authentication
      operationId: cliExchangeToken
      summary: Exchange a CLI authorization code and PKCE verifier for a new API key.
      description: >
        Step 2 of the loopback flow. The code is consumed on the first attempt whether or not the
        verifier matches. On success a new `lk_` API key is minted for the approving user, named
        after the `name` given to the authorize page.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - code_verifier
              properties:
                code:
                  type: string
                  description: The code from the callback.
                code_verifier:
                  type: string
                  pattern: ^[A-Za-z0-9._~-]{43,128}$
                  description: >-
                    PKCE verifier; SHA-256 of it, base64url-encoded without padding, must equal the
                    `code_challenge`.
            example:
              code: 9f2c...e1
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: Key minted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - key
                  - username
                  - name
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  key:
                    type: string
                    description: The plaintext `lk_` API key.
                  username:
                    type: string
                  name:
                    type: string
                    description: The key's name.
              example:
                status: ok
                key: lk_ab12cd34...
                username: alice
                name: lokictl@host
        '400':
          description: >-
            `Invalid JSON`, `Invalid code_verifier`, `Invalid or expired code`, or `code_verifier
            does not match`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Not POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Key creation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
