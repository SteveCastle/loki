  /api/duplicates/{id}/exclude:
    post:
      tags:
        - Duplicate Candidates
      operationId: excludeDuplicateMember
      summary: Pull one member out of a group, or put it back.
      description: >-
        An excluded member keeps its row (so it is never regrouped with the same partners) but is
        never merged by default. When fewer than two active members remain the group is dismissed
        automatically; when the anchor is excluded the group is re-anchored on an active member.
        Broadcasts a `duplicates-updated` event on `/stream`.
      x-access: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Group id (positive integer).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Member path (trimmed).
                excluded:
                  type: boolean
                  default: true
                  description: '`false` puts the member back.'
              required:
                - path
            example:
              path: D:/photos/lookalike.jpg
              excluded: true
      responses:
        '200':
          description: Updated group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  group:
                    oneOf:
                      - $ref: '#/components/schemas/DuplicateGroup'
                      - type: 'null'
                    description: The group after the change; `null` if it no longer exists.
                required:
                  - id
                  - group
        '400':
          description: >-
            Invalid id, invalid JSON, or `path` missing (`bad request: path required`). The body is
            `{"error": "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            The path is not a member of the group. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: >-
            Method other than POST. The body is `{"error": "..."}` but is sent with `Content-Type:
            text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            Database or internal failure. The body is `{"error": "..."}` but is sent with
            `Content-Type: text/plain`.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /swipe/api:
    get:
      tags:
        - Swipe
      operationId: getSwipeItems
      summary: A page of items for the Swipe app.
      description: >-
        The `mode` parameter picks how items are chosen. Any other value (or none) uses the shuffle.


        - Omitted: **shuffle**. With no `q`, a seeded sample of the whole library (`seed` 0 or
        omitted means fresh randomness). With `q`, the library search query filters the pool: pure
        tag queries (`tag:"X"`, OR/AND of tags) shuffle with `seed`; other queries are ordered by
        SQL `RANDOM()` on every request, so their pages are not stable.

        - `similar`: ranked by visual-embedding similarity to `anchor` (active embedding model),
        nearest first.

        - `feed`: the personalized "For You" feed built from the user's swipe favorites (the tag
        configured in the `swipeFeed` config section). The server keeps one feed sequence per
        `session` (and per orientation) so pages compose. `exploit`, `fresh`, `bridge` and
        `wildcard` override the configured lane weights for this request.

        - `text`: the library ranked by SigLIP text-to-image similarity to `q` (required). Query
        vectors are cached for 15 minutes so paging does not re-encode.

        - `face`: ranked by face similarity to the largest face in `anchor` (scanned on the fly when
        it has no stored faces), one entry per media item.


        In `similar`, `text` and `face` modes the ranking is deterministic, the anchor is excluded,
        and missing-media and off-orientation items are filtered before paging, so offsets index a
        stable list.
      x-access: read
      parameters:
        - name: mode
          in: query
          required: false
          description: Selection mode; see the description. Unrecognized values fall back to the shuffle.
          schema:
            type: string
            enum:
              - similar
              - feed
              - text
              - face
        - name: q
          in: query
          required: false
          description: >-
            Shuffle mode: library search query filter. `text` mode: the search text (required,
            trimmed).
          schema:
            type: string
        - name: anchor
          in: query
          required: false
          description: Media path. Required for `similar` and `face`; excluded from its own results.
          schema:
            type: string
        - name: seed
          in: query
          required: false
          description: >-
            Shuffle mode only. Same seed, same order (for unfiltered and tag-filtered pools). 0
            means fresh randomness.
          schema:
            type: integer
            format: int64
            default: 0
        - name: session
          in: query
          required: false
          description: '`feed` mode: client session id keying the server-side feed sequence.'
          schema:
            type: string
            default: default
        - name: exploit
          in: query
          required: false
          description: >-
            `feed` mode: weight override for the nearest-neighbours-of-your-taste lane. Must be >=
            0.
          schema:
            type: number
            minimum: 0
        - name: fresh
          in: query
          required: false
          description: '`feed` mode: weight override for the neighbours-of-the-latest-like lane. Must be >= 0.'
          schema:
            type: number
            minimum: 0
        - name: bridge
          in: query
          required: false
          description: '`feed` mode: weight override for the between-interests "surprising" lane. Must be >= 0.'
          schema:
            type: number
            minimum: 0
        - name: wildcard
          in: query
          required: false
          description: '`feed` mode: weight override for the uniform-random lane. Must be >= 0.'
          schema:
            type: number
            minimum: 0
        - name: orientation
          in: query
          required: false
          description: >-
            Restrict to `portrait` (width <= height) or `landscape` (width >= height); items without
            dimensions are excluded when set. Any other value (including `both`) means unrestricted.
            Case-insensitive.
          schema:
            type: string
            enum:
              - portrait
              - landscape
        - name: offset
          in: query
          required: false
          description: Page offset.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size. Values outside 1-50 use the default.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeResponse'
              example:
                items:
                  - path: D:/photos/beach.jpg
                    description: A beach at sunset.
                    size: 2483112
                    hash: a1b2c3
                    width: 4032
                    height: 3024
                    tags:
                      - label: beach
                        category: Places
                    exists: true
                    duplicateCount: 0
                has_more: true
                total_count: 0
        '400':
          description: '`anchor` missing for `similar`/`face`, or `q` empty for `text`. Plain-text message.'
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than GET (`Use GET`).
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            Search, feed or database failure, including no face found in the `face` anchor and the
            text model not being installed. Plain-text message.
          content:
            text/plain:
              schema:
                type: string
  /swipe/manifest.json:
    get:
      tags:
        - Swipe
      operationId: getSwipeManifest
      summary: PWA manifest for the Swipe app.
      description: >-
        A fixed web app manifest. Registered without any auth middleware, so it is served to anyone,
        and it answers every HTTP method the same way.
      x-access: public
      security: []
      responses:
        '200':
          description: The manifest.
          content:
            application/manifest+json:
              schema:
                $ref: '#/components/schemas/SwipeManifest'
              example:
                name: Lowkey Media Server Swipe
                short_name: Swipe
                description: Swipe through your media library
                start_url: /swipe
                display: standalone
                orientation: portrait
                background_color: '#000000'
                theme_color: '#000000'
                icons:
                  - src: /static/icon-192.png
                    sizes: 192x192
                    type: image/png
                    purpose: any maskable
                  - src: /static/icon-512.png
                    sizes: 512x512
                    type: image/png
                    purpose: any maskable
  /api/db/query:
    post:
      tags:
        - Database
      operationId: queryDatabase
      summary: Run one read-only SQL statement.
      description: >
        Built for `lokictl` and other trusted API clients. Two layers keep it read-only:

        - The statement must be a single `SELECT` or `WITH` (leading `--` and `/* */` comments and
        one trailing `;` are allowed). Any other `;` rejects the query, including one inside a
        string literal, so pass data through `args`.

        - It runs on a connection with `PRAGMA query_only=ON`, so SQLite refuses any write however
        it is phrased.


        BLOB cells are returned as `{"blob_bytes": n}` instead of their contents. All errors,
        including `405`, are `application/json`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sql
              properties:
                sql:
                  type: string
                  description: One SELECT or WITH statement.
                args:
                  type: array
                  items: {}
                  description: Positional values for `?` placeholders. JSON numbers bind as floating point.
                limit:
                  type: integer
                  default: 1000
                  maximum: 10000
                  description: Row cap. Zero or negative means the default; values above 10000 are clamped.
                timeout_ms:
                  type: integer
                  default: 5000
                  maximum: 30000
                  description: >-
                    Statement timeout in milliseconds. Zero or negative means the default; values
                    above 30000 are clamped.
            example:
              sql: SELECT path, size FROM media WHERE path LIKE ? ORDER BY size DESC
              args:
                - '%/2024/%'
              limit: 100
              timeout_ms: 5000
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBQueryResult'
              example:
                columns:
                  - path
                  - size
                rows:
                  - - D:\Photos\2024\big.mov
                    - 4831838208
                  - - D:\Photos\2024\a.jpg
                    - 5242880
                row_count: 2
                truncated: false
                elapsed_ms: 3
        '400':
          description: >-
            Body is not valid JSON (`bad json`); the statement is not a single SELECT/WITH; or
            SQLite rejected or aborted the query (syntax error, write attempt, timeout), with
            SQLite's message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            No database connection available, read-only mode could not be set, or reading the result
            failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/db/load:
    post:
      tags:
        - Database
      operationId: loadDatabase
      summary: Web client boot handshake (no-op).
      description: >
        The desktop viewer's "load database" call, mirrored for the web client. On the server it
        does **nothing**: the body is parsed and `{}` is returned, and the server keeps using its
        configured database. It is `read` access so anonymous boots work in public view-only mode.
        The method is not checked.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Database path the client asked for. Ignored.
            example:
              path: D:\Library\dream.sqlite
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: Body missing or not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/fs/list:
    post:
      tags:
        - Storage and Transfer
      operationId: listDirectory
      summary: List a directory inside a storage root.
      description: >
        An empty `path` lists the configured storage roots themselves (each with `type` `local` or
        `s3`, and `parent` `null`). Otherwise lists the directory's entries through the backend that
        owns it. `parent` is `null` at a root. `roots` is always an empty array. The method is not
        checked.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Directory to list; empty for the roots.
            example:
              path: D:\Photos
      responses:
        '200':
          description: Directory listing.
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - parent
                  - roots
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/FSEntry'
                  parent:
                    type:
                      - string
                      - 'null'
                    description: Parent directory, or `null` at a root.
                  roots:
                    type: array
                    items:
                      type: string
                    description: Always empty.
              example:
                entries:
                  - name: '2024'
                    path: D:\Photos\2024
                    isDir: true
                    mtimeMs: 1704067200000
                    size: 0
                  - name: a.jpg
                    path: D:\Photos\a.jpg
                    isDir: false
                    mtimeMs: 1704067200000
                    size: 5242880
                parent: D:\
                roots: []
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`path` is not within any configured storage root.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Listing failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/fs/scan:
    post:
      tags:
        - Storage and Transfer
      operationId: scanDirectory
      summary: List the media files in a directory.
      description: >
        Returns the media files under `path` (only direct children unless `recursive`). When `path`
        is a file, its parent directory is scanned and `cursor` is that file's index in `library`
        (otherwise `0`). For S3 paths a trailing `/` marks a folder.


        For **admin** callers, every scanned file is also added to the library (new media rows, and
        missing sizes backfilled). Anonymous public-access visitors get the listing without any
        write. The method is not checked.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Directory to scan, or a file to scan the directory of.
                recursive:
                  type: boolean
                  description: Include subdirectories. Default `false`.
            example:
              path: D:\Photos\a.jpg
              recursive: false
      responses:
        '200':
          description: Media files.
          content:
            application/json:
              schema:
                type: object
                required:
                  - library
                  - cursor
                properties:
                  library:
                    type: array
                    items:
                      type: object
                      required:
                        - path
                        - mtimeMs
                        - size
                      properties:
                        path:
                          type: string
                        mtimeMs:
                          type: number
                          description: Modification time in milliseconds since the epoch.
                        size:
                          type: integer
                          description: Bytes.
                  cursor:
                    type: integer
                    description: Index of the requested file when `path` was a file, else `0`.
              example:
                library:
                  - path: D:\Photos\a.jpg
                    mtimeMs: 1704067200000
                    size: 5242880
                  - path: D:\Photos\b.jpg
                    mtimeMs: 1704067300000
                    size: 4194304
                cursor: 0
        '400':
          description: Body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`path` is empty or not within any configured storage root.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Scan failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/upload:
    post:
      tags:
        - Storage and Transfer
      operationId: uploadFiles
      summary: Upload files into a storage root.
      description: >
        Stores each `files` part under the destination directory, keeping its base name and adding
        `_1`, `_2`, ... before the extension when the name is taken. Parts that fail to open or
        store are skipped (logged); the request fails only when none succeed. Unless `autoIngest` is
        `false`, an `ingest` workflow is then queued for the destination directory. The request body
        is capped at 10 GB.


        **Platform difference:** on Linux and macOS the `destination` field is ignored and files
        always go to `uploads/` (a relative key) in the default storage root, and the ingest job's
        input is `uploads/`.
      x-access: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more file parts.
                destination:
                  type: string
                  description: >-
                    Directory inside a configured storage root (local path or `s3://` prefix).
                    Default: `uploads/` under the default root. Windows only.
                autoIngest:
                  type: string
                  description: '`false` to skip the ingest job. Any other value, or omitted, queues it.'
      responses:
        '200':
          description: At least one file stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              example:
                success: true
                files:
                  - D:\Library/uploads/a.jpg
                  - D:\Library/uploads/a_1.jpg
                message: Uploaded 2 file(s)
        '400':
          description: >-
            The multipart form could not be parsed (including over 10 GB), `destination` is outside
            every storage root, or no `files` parts were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
              example:
                success: false
                files: null
                error: No files provided
        '405':
          description: Method other than POST.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: No storage root is configured, or no file could be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /api/export:
    get:
      tags:
        - Storage and Transfer
      operationId: exportLibrary
      summary: Download a .lokiexport archive of the tagged library.
      description: >
        Streams a gzip-compressed tar, sent as an attachment named
        `lowkey-export-YYYYMMDD-HHMMSS.lokiexport`. It holds every media item that has at least one
        tag, plus the whole taxonomy and the embeddings, faces and people referencing those items:

        - `manifest.json`: format version, creation time, the source's storage roots and the item
        count.

        - `library.db`: a SQLite database with only the selected rows, each media path replaced by a
        flat, collision-free key (the file's base name, disambiguated with `-1`, `-2`, ...).

        - `files/<key>`: each item's bytes. Files that cannot be read are skipped, but their rows
        stay.


        Thumbnails are not included; they regenerate after import. Errors after streaming has begun
        cannot change the status and leave a truncated archive.
      x-access: admin
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="lowkey-export-<timestamp>.lokiexport"`'
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          description: No tagged media to export.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Selecting items or building the export database failed.
          content:
            text/plain:
              schema:
                type: string
  /api/import:
    post:
      tags:
        - Storage and Transfer
      operationId: importLibrary
      summary: Merge a .lokiexport archive into this library.
      description: >
        Extracts the archive (rejecting members that escape the extraction folder), rebases every
        file key onto the destination root, copies the file bytes there, and merges by media item:
        an item already present is skipped whole; a new item brings its media row, tags, embeddings,
        faces and file. Taxonomy and tag groups merge without overwriting what exists. Face and
        person ids are remapped so curation references stay valid. The embedding and face search
        indexes are rebuilt afterwards; failures there become `warnings`. The request body is capped
        at 50 GB.
      x-access: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The .lokiexport archive.
                destRoot:
                  type: string
                  description: >-
                    Storage root to import into, matched against each root's path or name. Omitted
                    or unmatched: the default root.
      responses:
        '200':
          description: Imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
              example:
                imported: 1200
                skipped: 34
                files: 1198
                dest_root: s3://media/library
        '400':
          description: >-
            The form could not be parsed (including over 50 GB), `file` is missing, no storage root
            is configured, or the archive is not a valid tar.gz or contains unsafe member paths.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: >-
            The merge failed, including an archive newer than this server supports or one without
            `library.db`.
          content:
            text/plain:
              schema:
                type: string
  /api/transform/prompt:
    post:
      tags:
        - Transform and Models
      operationId: previewTransformPrompt
      summary: Preview the prompt a retouch or reshoot job will run.
      description: |
        Takes exactly the body `POST /create` takes and queues nothing. The
        job's arguments go through the same planning as the task, and the
        engine itself expands the prompt (`--show-prompt`, which loads no
        models), so presets, `--append`, living-photo expansion and reference
        tokens read exactly as they will run. When the engine is routed to a
        worker, the worker's engine answers.

        `input` is parsed like `/create`: the first token is the task id
        (`retouch` or `reshoot`), the last token is the input (newline-separated
        file paths; quote it if it contains spaces), and the tokens between are
        options. Each non-empty `fields` entry is appended as `--<key> <value>`.

        If the engine is not installed, a free-form prompt is returned as it
        will be sent (`fromEngine: false`, with a `note`); preset prompts
        cannot be expanded without the engine. A batch is shown for its first
        image (`runs` > 1).
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: '`<task> [options...] <input>`, as for `POST /create`. Needs at least two tokens.'
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Extra options appended as `--<key> <value>`; empty keys or values are skipped.
              required:
                - input
            example:
              input: retouch --preset=restore "D:/photos/a.jpg"
              fields:
                prompt: Remove the scratches.
      responses:
        '200':
          description: The expanded prompt of the job's first run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptPreview'
              example:
                engine: loki-retouch
                prompt: Remove the scratches.
                modelInput: |-
                  <|im_start|>system
                  Comprehend and analyze the provided prompt.<|im_end|>
                  ...
                references:
                  - token: <image1>
                    path: D:\photos\a.jpg
                    kind: image
                runs: 1
                fromEngine: true
        '400':
          description: >-
            Body is not JSON (`bad json`) or `input` has fewer than two tokens (`Invalid input`).
            Plain text.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Method other than POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: >-
            The request cannot be previewed (unknown task, a query input instead of files, no input
            files, no prompt or preset, no image to edit, missing reference inputs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >-
            The engine failed (for example `--show-prompt` exited with an error or a video frame
            could not be sampled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reshoot/models:
    get:
      tags:
        - Transform and Models
      operationId: listReshootModels
      summary: List the extra loki-reshoot diffusion models a job can pick.
      description: |
        The config's `reshootModels` list, cleaned up: blank and duplicate
        files (case-insensitive) dropped, `recipe` is `h3` unless configured as
        `fast`, and `label` defaults to the file name without its extension.
        The built-in H3 and FastH3 Omni models are always available and are not
        listed. A job selects one with the `dit` option (the file).
      x-access: admin
      responses:
        '200':
          description: The configured models (an empty array when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReshootModelChoice'
                required:
                  - models
              example:
                models:
                  - file: 10eros_beta7.safetensors
                    label: 10Eros beta7
                    recipe: fast
        '405':
          description: Method other than GET. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/prompts/describe:
    get:
      tags:
        - Transform and Models
      operationId: getDescribePrompt
      summary: Get the configured description prompt.
      description: >-
        Returns `describePrompt` from the config, used by the web UI as the placeholder of the
        custom-prompt panel. Sent with `Cache-Control: no-store`.
      x-access: admin
      responses:
        '200':
          description: The active prompt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
                    description: The configured describe prompt (may be empty).
                required:
                  - prompt
              example:
                prompt: Describe this image in detail.
        '405':
          description: Method other than GET. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /ollama/models:
    get:
      tags:
        - Transform and Models
      operationId: listOllamaModels
      summary: List the models of the local Ollama install.
      description: |
        Runs `ollama ls --quiet` on the server host (falling back to parsing
        the first column of `ollama ls`) and returns the model names, in order,
        de-duplicated. It does not query a remote Ollama URL: the `ollama`
        executable must be on the server's PATH.
      x-access: admin
      responses:
        '200':
          description: Model references such as `llama3:latest` (an empty array when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: string
                required:
                  - models
              example:
                models:
                  - llama3:latest
                  - qwen2.5vl:7b
        '405':
          description: Method other than GET. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: '`ollama ls` failed or is not installed (`failed to list ollama models`). Plain text.'
          content:
            text/plain:
              schema:
                type: string
  /api/embedding/directml/install:
    get:
      tags:
        - Transform and Models
      operationId: getDirectMLRuntimeStatus
      summary: Report whether the DirectML ONNX runtime is installed.
      description: Windows builds only; the route is not registered on Linux or macOS.
      x-access: admin
      responses:
        '200':
          description: Install state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectMLInstallResult'
              example:
                installed: false
    post:
      tags:
        - Transform and Models
      operationId: installDirectMLRuntime
      summary: Download and install the DirectML ONNX runtime.
      description: |
        Downloads and installs the optional GPU (DirectML) ONNX Runtime into the
        data directory so the embed task can use `provider=directml`. Runs
        synchronously. A failed install still answers 200, with `error` set.
        Windows builds only.
      x-access: admin
      responses:
        '200':
          description: The install state afterwards, plus `error` when the install failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectMLInstallResult'
              example:
                installed: true
        '405':
          description: Method other than GET or POST (`method not allowed`). Plain text.
          content:
            text/plain:
              schema:
                type: string
  /workers:
    get:
      tags:
        - GPU Engines
      operationId: redirectWorkersPage
      summary: Old Workers page; redirects to the Config page's GPU Engines tab.
      x-access: admin
      responses:
        '302':
          description: Redirect to `/config#engines`.
          headers:
            Location:
              schema:
                type: string
                example: /config#engines
  /api/engines:
    get:
      tags:
        - GPU Engines
      operationId: getEngines
      summary: Get the engines config (secrets redacted) and the dispatcher's live status.
      description: >-
        The status is the last known state; nothing is probed. Use `POST /api/engines/check` to
        probe now.
      x-access: admin
      parameters:
        - name: local
          in: query
          required: false
          description: >-
            `1` adds `local`, this machine's engine installs. Reading an engine's version runs it
            once (`--version`, cached per file).
          schema:
            type: string
            enum:
              - '1'
      responses:
        '200':
          description: Config and status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/EnginesConfig'
                  status:
                    $ref: '#/components/schemas/EngineStatus'
                  local:
                    type: array
                    items:
                      $ref: '#/components/schemas/LocalEngine'
                    description: >-
                      Only with `?local=1`. One entry per engine in display order (`loki-retouch`,
                      `loki-reshoot`, `loki-dream` in dream builds, `loki-segment`).
                required:
                  - config
                  - status
              example:
                config:
                  strategy: hybrid
                  pools:
                    - name: lab
                      kind: nodes
                      nodes:
                        - name: gpu1
                          url: http://10.0.0.5:8080
                          token: <redacted>
                      maxJobs: 4
                  routes:
                    loki-segment: local
                  fallback: false
                  localOnly: false
                status:
                  strategy: hybrid
                  routes:
                    loki-segment: local
                  fallback: false
                  localOnly: false
                  placement:
                    loki-retouch: hybrid
                    loki-reshoot: hybrid
                    loki-dream: hybrid
                    loki-segment: local
                  targets:
                    - key: local
                      kind: local
                      healthy: true
                      running: 0
                      slots: 1
                    - key: lab/gpu1
                      pool: lab
                      kind: node
                      url: http://10.0.0.5:8080
                      healthy: true
                      checked: '2026-10-31T12:00:00Z'
                      running: 1
                      slots: 2
    put:
      tags:
        - GPU Engines
      operationId: replaceEngines
      summary: Replace the engines section of the config and apply it.
      description: >
        Replaces the whole `engines` section, saves it to the config file and

        applies it at once (dispatcher targets and the GPU bucket size), then

        probes every worker (up to 20 s) and returns the new state.


        - A secret posted as `<redacted>` keeps the stored value: pools are matched by `name`
        (case-insensitive), nodes by `url` (ignoring a trailing `/`). A placeholder with nothing to
        restore is saved as empty.

        - A pool posted without `provider` keeps the stored one.

        - Routes present before and missing now are cleared (saved as `""`, meaning follow the
        strategy).

        - The section is normalized: unknown `strategy` becomes `local`; pools with a blank or
        duplicate name are dropped; any `kind` other than `runpod` becomes `nodes`; nodes without a
        `url` are dropped and an unnamed node is named after its URL; `maxJobs` <= 0 becomes 4;
        route keys are lowercased and prefixed `loki-` when needed.

        - Pools supplied by the environment (`fromEnv`) are never written to the config file.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnginesConfig'
            example:
              strategy: pool
              fallback: true
              localOnly: false
              routes:
                segment: local
              pools:
                - name: cloud
                  kind: runpod
                  endpointId: abc123xyz
                  apiKey: <redacted>
                  maxJobs: 2
                  transfer:
                    root: s3-media
      responses:
        '200':
          description: The saved config (secrets redacted) and the freshly probed status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/EnginesConfig'
                  status:
                    $ref: '#/components/schemas/EngineStatus'
                required:
                  - config
                  - status
        '400':
          description: >-
            Body is not valid JSON (`bad json: ...`). JSON `Error` body with a `text/plain` content
            type.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The config file could not be saved. JSON `Error` body with a `text/plain` content type.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/engines/check:
    post:
      tags:
        - GPU Engines
      operationId: checkEngines
      summary: Probe every worker now and return the status.
      description: Probes every pool target (up to 30 s in total). No request body.
      x-access: admin
      responses:
        '200':
          description: The dispatcher status after probing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineStatus'
  /api/engines/warm:
    post:
      tags:
        - GPU Engines
      operationId: warmEngines
      summary: Preload engines' models on the workers.
      description: |
        Asks the workers of one pool (every pool when `pool` is empty) to fetch
        and load the engines' models ahead of the first job. Worker nodes get a
        warm request; RunPod endpoints get a warm job (which also downloads the
        models to their volume). The local GPU is not warmed. Times out after
        one minute.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pool:
                  type: string
                  description: Pool name (case-insensitive); empty for every pool.
                engines:
                  type: array
                  items:
                    type: string
                  description: Engines to warm, for example `loki-retouch`. Must not be empty.
                model:
                  type: string
                  description: Optional model to warm (passed to the worker).
              required:
                - engines
            example:
              pool: lab
              engines:
                - loki-retouch
                - loki-reshoot
      responses:
        '200':
          description: >-
            One note per target, `<key>: warming <engines>` or `<key>: <error>`. `null` when no
            target matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                required:
                  - notes
              example:
                notes:
                  - 'lab/gpu1: warming loki-retouch, loki-reshoot'
        '400':
          description: Bad JSON or empty `engines`. JSON `Error` body with a `text/plain` content type.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/engines/probe:
    post:
      tags:
        - GPU Engines
      operationId: probeWorker
      summary: Check a worker before adding it.
      description: |
        For `kind: runpod`, asks the RunPod endpoint `endpointId` for its health
        with `apiKey`; for any other kind, asks the loki-worker at `url` for its
        info with `token`. String fields are trimmed. Times out after 30 s.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - nodes
                    - runpod
                  description: '`runpod` probes an endpoint; anything else probes a node.'
                url:
                  type: string
                  description: Node base URL (nodes).
                token:
                  type: string
                  description: Node bearer token (nodes).
                endpointId:
                  type: string
                  description: RunPod endpoint id (runpod).
                apiKey:
                  type: string
                  description: RunPod API key (runpod).
            example:
              kind: nodes
              url: http://10.0.0.5:8080
              token: s3cret
      responses:
        '200':
          description: Reachable. `info` is a `WorkerInfo` for a node or a `RunPodHealth` for an endpoint.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  info:
                    oneOf:
                      - $ref: '#/components/schemas/WorkerInfo'
                      - $ref: '#/components/schemas/RunPodHealth'
                required:
                  - ok
                  - info
        '400':
          description: Body is not JSON (`bad json`). JSON `Error` body with a `text/plain` content type.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The worker or endpoint could not be reached or refused the credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes:
    get:
      tags:
        - Scenes
      operationId: listScenes
      summary: List scenes, optionally only those started from one source.
      x-access: admin
      parameters:
        - name: source
          in: query
          required: false
          description: >-
            Source file path; compared case-insensitively after making it absolute. Omit for every
            scene.
          schema:
            type: string
      responses:
        '200':
          description: Scenes, most recently changed first (an empty array when none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SceneSummary'
        '405':
          description: Method other than GET or POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - Scenes
      operationId: openOrCreateScene
      summary: Open the latest scene for a source, or start a new one.
      description: |
        Unless `fresh` is true, returns the most recently changed scene started
        from `source` if there is one. Otherwise creates a scene: the base frame
        is the image (HEIC included) or, for a video, the frame at `time`
        seconds, normalized to PNG.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Absolute path of an image or video.
                time:
                  type: number
                  description: 'Video only: seconds into the clip (negative becomes 0). Ignored for images.'
                fresh:
                  type: boolean
                  description: Always start a new scene.
              required:
                - source
            example:
              source: D:/photos/beach.jpg
              fresh: false
      responses:
        '200':
          description: The scene document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: >-
            Missing `source` or bad JSON (`needs a source path`), source not found, not an image or
            video, or ffmpeg failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
    get:
      tags:
        - Scenes
      operationId: getScene
      summary: Get a scene, with finished jobs folded in.
      description: >-
        Reconciles finished generation, track and export jobs into the document (saving it if
        anything changed) and derives version stitches, starting any that are due. Poll this while
        jobs run.
      x-access: admin
      responses:
        '200':
          description: The scene document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          description: Unknown or malformed scene id.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET, PUT or DELETE. Plain text.
          content:
            text/plain:
              schema:
                type: string
    put:
      tags:
        - Scenes
      operationId: updateScene
      summary: Save the editor's fields of a scene.
      description: |
        Only editor-owned fields are taken; versions, jobs, errors and the
        export stay the server's, so a save can never drop a generation that
        finished meanwhile. Layers are replaced in the posted order (bottom to
        top). **Layers missing from the body are deleted**, their jobs
        cancelled and their files removed.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneUpdate'
            example:
              name: Beach
              duration: 0
              freeLoops: false
              layers:
                - id: l1
                  name: Waves
                  kind: motion
                  region:
                    x: 0
                    'y': 600
                    w: 1920
                    h: 480
                  mask: data:image/png;base64,iVBORw0...
                  feather: 24
                  prompt: gentle waves roll in
                  options:
                    duration: 5
                    lock: true
                  active: 0
      responses:
        '200':
          description: The saved scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: Bad JSON (`bad json`) or the save failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Scenes
      operationId: deleteScene
      summary: Delete a scene and its files.
      description: >-
        Cancels every layer's generations and removes the scene folder. Exports beside the source
        are kept.
      x-access: admin
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
        '404':
          description: Unknown scene.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/render:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
    post:
      tags:
        - Scenes
      operationId: renderScene
      summary: Export the scene beside its source.
      description: |
        Queues a `scene-render` job and records it in the scene's `render`.
        `video` writes `<name>_scene.mp4` with every motion layer looping;
        `still` writes `<name>_scene.png`, a flattened PNG of the still edits
        and the first frame of the motion. The output goes beside the source
        (the scene folder if that folder is gone), with a numbered name on
        conflict, and is added to the library. The body is optional.
      x-access: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                    - video
                    - still
                  default: video
                  description: Anything other than `still` means `video`.
            example:
              format: video
      responses:
        '200':
          description: The scene, with `render` pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: An export is already pending or running, or the job could not be queued.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/scenes/{id}/segment:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
    post:
      tags:
        - Scenes
      operationId: segmentScene
      summary: Find objects in the scene picture (or a motion version's frame) with loki-segment.
      description: |
        Answers one pick of the Select tool with SAM 3.1 masks the editor adds
        to a layer. Without `layer` and `version` it segments the picture as the
        editor shows it (every visible still and paint layer flattened over the
        base, cached until the layers change), in frame pixels. With `layer` +
        `version` it segments frame `frame` of that motion version's clip, in
        clip pixels.

        Uses one `loki-segment --serve` session per scene (started on demand,
        closed when idle or when a GPU-heavy job needs the GPU). When
        `loki-segment` is routed to a pool, the session runs on a worker node;
        serverless endpoints cannot hold one.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
            example:
              points:
                - - 640
                  - 360
                  - 1
              multimask: true
      responses:
        '200':
          description: The objects found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResult'
        '400':
          description: >-
            Bad JSON, `loki-segment` unavailable (not installed, no reachable worker node), or the
            segmenter failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene, or `layer`/`version` is not a motion version of it.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/scene-dream:
    post:
      tags:
        - Scenes
      operationId: queueSceneDream
      summary: Generate a new picture to start a scene from (dream builds only).
      description: |
        Queues a `dream` job (loki-dream) with no input; the image lands in the
        library's Generated folder. Poll `GET /api/scene-dream/{job}`, then
        start a scene from its `output`. Registered only in servers built with
        `-tags dream` (`LOKI_DREAM=1`); otherwise this path is not served.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneDreamRequest'
            example:
              prompt: a lighthouse on a cliff at dusk
              size: 1344x768
      responses:
        '200':
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDreamStatus'
              example:
                jobId: 5f0c2f7e-1b2a-4c55-9d1e-0a6f3b9c2d11
                state: pending
                done: 0
                total: 0
        '400':
          description: Bad JSON, empty `prompt` (`describe the picture first`), or the job could not be queued.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/scene-dream/{job}:
    parameters:
      - name: job
        in: path
        required: true
        description: The `jobId` from `POST /api/scene-dream`.
        schema:
          type: string
    get:
      tags:
        - Scenes
      operationId: getSceneDreamStatus
      summary: Report a scene-dream job (dream builds only).
      description: >-
        The handler does not check the method; any method gets the same answer. Registered only in
        dream builds.
      x-access: admin
      responses:
        '200':
          description: >-
            The job's state; `output` once completed, `error` (its last meaningful log line) once
            errored or cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDreamStatus'
        '404':
          description: No such job, or the job is not a `dream` job (message `scene not found`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/generate:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
    post:
      tags:
        - Scenes
      operationId: generateSceneLayer
      summary: Queue the layer's next generation.
      description: |
        Served by the `/api/scenes/{id}/layers/{lid}/{action}` route with
        `action` = `generate`.

        Crops the layer's region from the stills below it (stitched, as the
        stage shows them) and queues the engine job, behind any generation of
        the layer already in flight (up to 8 running + queued). Still layers
        run `retouch` (or `dream` when `options.engine` is `dream` in dream
        builds; a `colour` finish runs `scene-recolour` first); motion layers
        run `reshoot` followed by `scene-lock`. Paint layers cannot be
        generated. The body is optional: `mask` generates with that mask
        instead of the layer's own (used only when it is a PNG data URL with a
        non-empty region).
      x-access: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mask:
                  $ref: '#/components/schemas/SceneGenMask'
      responses:
        '200':
          description: The scene, with the new generation as the layer's `job` or appended to `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: >-
            Paint layer, still layer without a prompt or finish (`describe the edit first`), empty
            region (`draw the area to change first`), bad references, cropping failed, or the job
            could not be queued.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene or layer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The layer already has 8 generations in flight.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/pose:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
    post:
      tags:
        - Scenes
      operationId: detectSceneLayerPose
      summary: Detect the body pose of the character in a box.
      description: |
        Served by the `/api/scenes/{id}/layers/{lid}/{action}` route with
        `action` = `pose`. Reads the pose (RTMPose, OpenPose's 18 joints) of the
        person in `box` in the picture as layer `lid` sees it (every layer
        under it flattened), for the mannequin of a repose layer. Starts the
        `rtmpose-body` model install if needed.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                box:
                  $ref: '#/components/schemas/SceneRect'
              required:
                - box
            example:
              box:
                x: 400
                'y': 120
                w: 300
                h: 700
      responses:
        '200':
          description: The joints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenePose'
        '400':
          description: >-
            Missing or invalid body, box smaller than 8 px (`select the character first ...`), model
            not installed yet, or detection failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: Scene id (a UUID; ids not matching `^[a-f0-9-]{8,64}$` answer 404).
        schema:
          type: string
      - name: lid
        in: path
        required: true
        description: Layer id (chosen by the editor).
        schema:
          type: string
    post:
      tags:
        - Scenes
      operationId: cancelSceneLayerJobs
      summary: Cancel one of the layer's generations, or all of them.
      description: |
        Served by the `/api/scenes/{id}/layers/{lid}/{action}` route with
        `action` = `cancel`. Cancels every step of the generation whose
        `SceneJob.id` is `job` (running or queued), or every generation when
        `job` is empty or the body is omitted. Cancelling the running one starts
        the next queued. Clears the layer's `error`. An unknown layer id is not
        an error.
      x-access: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  type: string
                  description: The generation's `SceneJob.id`; empty for all.
      responses:
        '200':
          description: The scene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          description: Unknown scene.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
