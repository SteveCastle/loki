    post:
      tags:
        - System
      operationId: legacyLaunchJob
      summary: Legacy single-task job launch.
      description: >
        Queues a one-task workflow. The struct has no JSON tags, so the canonical keys are `Command`
        and `Arguments`; Go's case-insensitive decoding also accepts `command` and `arguments`. The
        **last** element of `Arguments` is the task input; the rest are the task's option tokens.
        Prefer `POST /create`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Arguments
              properties:
                Command:
                  type: string
                  description: Task id.
                Arguments:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Option tokens followed by the input as the final element.
            example:
              Command: metadata
              Arguments:
                - '--type=hash'
                - D:\Media\clip.mp4
      responses:
        '201':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    description: Id of the created job (empty string if none was created).
        '400':
          description: '`bad json`, or `Arguments` empty. Plain text.'
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The workflow could not be queued. Plain text.
          content:
            text/plain:
              schema:
                type: string
