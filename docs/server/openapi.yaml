      tags:
        - System
      operationId: getHealth
      summary: Liveness, server version, SSE connection stats and job counts.
      description: >
        Registered without the auth middleware, so it needs no credential even though it reports job
        counts. Sets fully permissive CORS headers (`Access-Control-Allow-Origin: *`); `OPTIONS`
        answers `200`. Paused jobs are counted in `jobs.total` but in no per-state bucket.
      x-access: public
