            Not a dream build, not a still layer, version not shown, layer not stitched, stitch not
            ready, or nothing to heal.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown scene or layer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The layer already has 8 generations in flight.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/scenes/{id}/layers/{lid}/versions/{n}/change:
