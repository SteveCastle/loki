            application/json:
              schema:
                type: object
                properties:
                  faceId:
                    type: integer
                    format: int64
                  personId:
                    type: integer
                    format: int64
                  cannotLinks:
                    type: integer
                    description: Cannot-link constraints recorded.
                required:
                  - faceId
                  - personId
                  - cannotLinks
              example:
                faceId: 5120
                personId: 12
                cannotLinks: 8
        '400':
          description: >-
            Invalid face id, invalid JSON, or the face is unassigned and no `personId` was given.
            The body is `{"error": "..."}` but is sent with `Content-Type: text/plain`.
          content:
            text/plain:
