        path:
          type: string
        isDir:
          type: boolean
        mtimeMs:
          type: number
          description: Modification time in milliseconds since the epoch (`0` for roots).
        size:
          type: integer
          description: Bytes; `0` for directories.
        type:
          type: string
          enum:
            - local
            - s3
          description: Present only when listing the roots.
    UploadResult:
      type: object
      required:
        - success
        - files
      properties:
        success:
          type: boolean
        files:
          type:
            - array
            - 'null'
          items:
            type: string
