          $ref: '#/components/responses/DepsUnauthorized'
  /setup:
    get:
      tags:
        - Setup Wizard
      operationId: getSetupPage
      summary: The first-run setup wizard page.
      description: |
        Server-rendered HTML. Open while setup is incomplete; afterwards it
        needs a valid credential and unauthenticated requests are redirected
        to `/login`.
      x-access: public
      responses:
        '200':
          description: The wizard page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Setup is complete and the request carries no valid credential; redirects to `/login`.
          headers:
            Location:
              schema:
                type: string
                example: /login
        '500':
          description: Template rendering failed. Plain-text message.
          content:
            text/plain:
              schema:
                type: string
  /setup/api/state:
    get:
      tags:
        - Setup Wizard
      operationId: getSetupState
      summary: Everything the wizard needs to render its steps.
      x-access: public
      responses:
        '200':
          description: Wizard state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
              example:
                setupComplete: false
                defaultDBPath: C:\ProgramData\Lowkey Media Server\media.db
                activeDBPath: C:\ProgramData\Lowkey Media Server\media.db
                dataDir: C:\ProgramData\Lowkey Media Server
                homeDir: C:\Users\me
                os: windows
                roots:
                  - type: local
                    path: D:\Media
                    label: Media
                    default: true
                  - type: s3
                    label: archive
                    endpoint: https://s3.example.com
                    bucket: archive
                    accessKey: AKIA...
                    secretKey: •••
                hasRealUsers: false
                authed: false
                deps: []
                modelGroups:
                  - id: visual-search
                    title: Visual & text search
                    desc: Find media by describing it, or by visual similarity to another image.
                    recommended: true
                    sizeBytes: 1505518412
                    models:
                      - siglip2-base-patch16-224
        '403':
          $ref: '#/components/responses/SetupForbidden'
  /setup/api/browse:
    post:
      tags:
        - Setup Wizard
      operationId: setupBrowse
      summary: List folders on the server host for the wizard's folder picker.
      description: |
        Unlike `/api/fs/list`, this browses the whole machine, because its job
        is picking locations before any storage root exists. Only
        directories are listed, hidden (dot) folders are skipped, and entries
        are sorted case-insensitively.

        An empty `path` returns the starting locations: Home, App data, and
        every drive letter that exists (Windows) or `/` (elsewhere). A path
        that does not exist is not an error: it returns `exists: false` so
        the picker can offer to create it. A folder that exists but cannot be
        listed returns `exists: true` with no entries.
      x-access: public
      requestBody:
        required: true
        description: A JSON body is required (send `{}` for the starting locations).
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: >-
                    Absolute folder path to list; empty or omitted for the starting locations.
                    Trimmed and cleaned.
            example:
              path: D:\
      responses:
        '200':
          description: The folder listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupBrowseResult'
              example:
                path: D:\
                parent: ''
                entries:
                  - name: Media
                    path: D:\Media
                  - name: Photos
                    path: D:\Photos
                exists: true
                writable: true
        '400':
          description: >-
            Body is not valid JSON (`bad request`), the path is not absolute, or it names a file
            rather than a folder.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/SetupForbidden'
  /setup/api/mkdir:
    post:
      tags:
        - Setup Wizard
      operationId: setupMkdir
      summary: Create a folder (and any missing parents) on the server host.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Absolute path of the folder to create. Trimmed.
              required:
                - path
            example:
              path: D:\Media\Library
      responses:
        '200':
          description: >-
            Created (or already present); the listing of the new folder, same shape as `POST
            /setup/api/browse`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupBrowseResult'
        '400':
          description: >-
            Body is not valid JSON, `path` is empty or not absolute, or the folder could not be
            created (`could not create folder: ...`).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/SetupForbidden'
  /setup/api/database:
    post:
      tags:
        - Setup Wizard
      operationId: setupDatabase
      summary: Open (or create) the SQLite library database and make it the active one.
      description: |
        If `path` is an existing folder, or ends with a path separator, the
        database goes inside it as `media.db`. The server switches to that
        database immediately (creating it if needed) and saves it as `dbPath`
        in the config. `hasRealUsers` in the response reflects the newly
        opened database, so the wizard can skip account creation for a
        library that already has an account.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: >-
                    Absolute path of the database file, or of a folder to put `media.db` in. Trimmed
                    and cleaned.
              required:
                - path
            example:
              path: D:\Lowkey\
      responses:
        '200':
          description: The database is open and saved in the config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: The database file actually opened (with `media.db` appended for a folder).
                  existed:
                    type: boolean
                    description: Whether the file was already there before this call.
                  hasRealUsers:
                    type: boolean
                    description: Whether the database has an account other than the bootstrap default admin.
                required:
                  - path
                  - existed
                  - hasRealUsers
              example:
                path: D:\Lowkey\media.db
                existed: false
                hasRealUsers: false
        '400':
          description: Body is not valid JSON, or `path` is empty or not absolute.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/SetupForbidden'
        '500':
          description: >-
            The database could not be opened (`could not open database: ...`), or it opened but the
            config could not be saved.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /setup/api/storage/test-s3:
    post:
      tags:
        - Setup Wizard
      operationId: setupTestS3
      summary: Test an S3-compatible bucket connection without saving anything.
      description: Builds an S3 client from the body and pings the bucket, with a 10 second timeout.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  description: S3 endpoint URL; empty for AWS.
                region:
                  type: string
                bucket:
                  type: string
                  description: Bucket name (required, non-blank).
                prefix:
                  type: string
                  description: Key prefix inside the bucket.
                accessKey:
                  type: string
                secretKey:
                  type: string
              required:
                - bucket
            example:
              endpoint: http://localhost:9000
              region: us-east-1
              bucket: media
              accessKey: minio
              secretKey: minio123
      responses:
        '200':
          description: The bucket is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
              example:
                ok: true
        '400':
          description: >-
            Body is not valid JSON, `bucket is required`, or `connection failed: ...` (client
            creation or ping failed).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/SetupForbidden'
  /setup/api/storage:
    post:
      tags:
        - Setup Wizard
      operationId: setupStorage
      summary: Replace the configured storage roots.
      description: |
        Validates every root, then saves the list as the config's `roots`
        and swaps the live storage registry (no restart needed). The
        submitted list replaces the existing one entirely.

        - `type` `local` (or empty, which becomes `local`) needs an absolute
          `path`; the folder is created if missing.
        - `type` `s3` needs a `bucket`. A `secretKey` of `•••` (the
          redaction placeholder from `GET /setup/api/state`) keeps the stored
          secret of the existing S3 root with the same `bucket` and
          `endpoint`.
        - An empty `label` defaults to the bucket name (S3) or the folder's
          base name (local).
        - When no root has `default: true`, the first root becomes the
          default.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roots:
                  type: array
                  description: At least one root.
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SetupStorageRoot'
              required:
                - roots
            example:
              roots:
                - type: local
                  path: D:\Media
                  label: Media
                  default: true
                - type: s3
                  endpoint: http://localhost:9000
                  region: us-east-1
                  bucket: archive
                  accessKey: minio
                  secretKey: •••
      responses:
        '200':
          description: Saved and applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  roots:
                    type: integer
                    description: Number of roots saved.
                required:
                  - status
                  - roots
              example:
                status: ok
                roots: 2
        '400':
          description: |
            Body is not valid JSON; no roots (`add at least one storage
            location`); a local root without an absolute path or whose folder
            could not be created; an S3 root without a bucket; an unknown
            `type`; or the storage registry rejected the roots (messages
            joined with `; `).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/SetupForbidden'
        '500':
          description: The config could not be saved.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /setup/api/complete:
    post:
      tags:
        - Setup Wizard
      operationId: setupComplete
      summary: Mark first-run setup complete.
      description: |
        Sets `setupComplete` in the config. Nothing is validated (it does not
        check that an account, database or storage root exists). From then
        on the wizard routes need a credential and unauthenticated page
        requests go to `/login`. No request body.
      x-access: public
      responses:
        '200':
          description: Setup is complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
              example:
                status: ok
        '403':
          $ref: '#/components/responses/SetupForbidden'
        '500':
          description: The config could not be saved.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /viz/embeddings:
    get:
      tags:
        - Visualizations
      operationId: embeddingsVizPage
      summary: 3D embedding point cloud page.
      description: >-
        A WebGL scatter of the embedding space, built from `GET /api/embeddings/projection`. Orbit
        and zoom, hover points for previews, and switch models to compare how each clusters the
        library.
      x-access: admin
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/embeddings/projection:
    get:
      tags:
        - Visualizations
      operationId: getEmbeddingProjection
      summary: PCA projection of a model's embeddings to 3D.
      description: >
        Vectors are normalized and projected onto their first three principal components. Rows whose
        dimension differs from the first row's are dropped. When more rows remain than `limit`, a
        deterministic stride sample is taken so reloads show the same cloud. `paths[i]` is the item
        for `points[i]`. Any model with stored rows works, including ones no longer in the registry.
        A model with no rows returns empty arrays.
      x-access: admin
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Model id. Default the active embedding model.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 4000
          description: Maximum points. Values above 20000 are clamped.
      responses:
        '200':
          description: The projection.
          content:
            application/json:
              schema:
                type: object
                required:
                  - model
                  - dim
                  - total
                  - count
                  - variance
                  - paths
                  - points
                properties:
                  model:
                    type: string
                  dim:
                    type: integer
                    description: Vector dimension (0 when there are no rows).
                  total:
                    type: integer
                    description: Rows considered before sampling.
                  count:
                    type: integer
                    description: Points returned.
                  variance:
                    type: array
                    items:
                      type: number
                    minItems: 3
                    maxItems: 3
                    description: Fraction of total variance explained by each of the three axes.
                  paths:
                    type: array
                    items:
                      type: string
                  points:
                    type: array
                    items:
                      type: array
                      items:
                        type: number
                      minItems: 3
                      maxItems: 3
                    description: '`[x, y, z]` per point.'
              example:
                model: siglip2-base-patch16-224
                dim: 768
                total: 51234
                count: 2
                variance:
                  - 0.081
                  - 0.054
                  - 0.039
                paths:
                  - D:\Photos\a.jpg
                  - D:\Photos\b.jpg
                points:
                  - - 0.12
                    - -0.03
                    - 0.2
                  - - -0.08
                    - 0.15
                    - 0.01
        '400':
          description: '`limit` is not a positive integer.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Loading embeddings failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /viz/treemap:
    get:
      tags:
        - Visualizations
      operationId: treemapVizPage
      summary: Library treemap page.
      description: >-
        A squarified treemap of the library by folder, sized by any metric from `GET
        /api/treemap/metrics`, with drill-down through `GET /api/treemap`.
      x-access: admin
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/treemap:
    get:
      tags:
        - Visualizations
      operationId: getTreemap
      summary: Per-folder row counts for one metric.
      description: >
        Every metric is a row count, not bytes: media items, tag assignments, or one model's
        embedding or face rows, aggregated over each folder on the item's path (both `/` and `\`
        separate segments). The tree is cached per metric for 2 minutes. For metrics other than
        `items`, each node also carries `itemCount` (items in that folder) so coverage can be
        computed.
      x-access: admin
      parameters:
        - name: metric
          in: query
          required: false
          schema:
            type: string
            default: items
          description: '`items`, `tags`, `embed:<model>` or `face:<model>`.'
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Folder to root the response at, exactly as a node's `path` (default the library root).
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 3
          description: Levels of children to include. Values above 8 are clamped.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 100
          description: >-
            Children per node, largest first; the rest collapse into `otherCount`/`otherDirs`.
            Values above 2000 are clamped.
      responses:
        '200':
          description: The subtree.
          content:
            application/json:
              schema:
                type: object
                required:
                  - metric
                  - path
                  - total
                  - node
                properties:
                  metric:
                    type: string
                  path:
                    type: string
                  total:
                    type: integer
                    description: Rows in the whole library for this metric.
                  totalItems:
                    type: integer
                    description: Items in the whole library. Absent for the `items` metric.
                  node:
                    $ref: '#/components/schemas/TreemapNode'
              example:
                metric: embed:siglip2-base-patch16-224
                path: D:\Photos
                total: 51234
                totalItems: 52000
                node:
                  name: Photos
                  path: D:\Photos
                  count: 30100
                  covered: 30100
                  itemCount: 30500
                  children:
                    - name: '2024'
                      path: D:\Photos\2024
                      count: 12000
                      covered: 12000
                      direct: 12000
                      itemCount: 12400
                  otherCount: 40
                  otherDirs: 3
        '400':
          description: Unknown `metric`, or `depth`/`limit` not a positive integer.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`path` is not a folder in the tree.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/treemap/metrics:
    get:
      tags:
        - Visualizations
      operationId: listTreemapMetrics
      summary: Metrics a treemap can be drawn by, with library-wide counts.
      description: >-
        Always `items` and `tags`, then one `embed:<model>` per model with stored embeddings and one
        `face:<model>` per model with stored faces.
      x-access: admin
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - metrics
                properties:
                  metrics:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - label
                        - count
                      properties:
                        id:
                          type: string
                          description: Value for `GET /api/treemap?metric=`.
                        label:
                          type: string
                          description: Display label.
                        count:
                          type: integer
                          description: Rows for this metric.
              example:
                metrics:
                  - id: items
                    label: Items
                    count: 52000
                  - id: tags
                    label: Tags
                    count: 310000
                  - id: embed:siglip2-base-patch16-224
                    label: Embeddings · siglip2-base-patch16-224
                    count: 51234
        '405':
          description: Method other than GET.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Database error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /media/api:
    get:
      tags:
        - Legacy Media Browser
      operationId: listLegacyMediaItems
      summary: Paged items for the legacy gallery, or one item by path.
      description: >
        With `path` and `single=true`, returns the one item with that path (`items` is `null` when
        there is none).


        Otherwise returns a page of items ordered by path. `q` uses the gallery's search language:
        `key:value` terms (keys from `GET /media/suggest?kind=filters`, such as `tag`, `category`,
        `path`, `description`, `width`, `tagcount`, `exists`, `orientation`), comparisons like
        `width>1000` or `tagcount:>2`, `*` wildcards, `AND`, `OR`, `NOT`, parentheses, and implicit
        AND between terms. A query that fails to parse (for example a bare word with no `key:`) is
        ignored and every item is returned.
      x-access: admin
      parameters:
        - name: offset
          in: query
          required: false
          description: Items to skip. Invalid values mean `0`.
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          description: Page size. Values outside 1 to 100 use the default.
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - name: q
          in: query
          required: false
          description: Search expression.
          schema:
            type: string
          example: tag:sunset AND width>1000
        - name: path
          in: query
          required: false
          description: >-
            Media path for a single-item lookup (read from the raw query string and path-unescaped).
            Ignored unless `single=true`.
          schema:
            type: string
        - name: single
          in: query
          required: false
          description: '`true` together with `path` looks up one item.'
          schema:
            type: string
            enum:
              - 'true'
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - has_more
                  - total_count
                properties:
                  items:
                    type:
                      - array
                      - 'null'
                    items:
                      $ref: '#/components/schemas/LegacyMediaItem'
                  has_more:
                    type: boolean
                    description: More items exist after this page.
                  total_count:
                    type: integer
                    description: Total matching items (for a single lookup, `0` or `1`).
              example:
                items:
                  - path: D:/photos/x.jpg
                    description: A red car.
                    size: 2527291
                    hash: 9f2c1d0e
                    width: 1920
                    height: 1080
                    tags:
                      - label: sunset
                        category: Scene
                    exists: true
                    duplicateCount: 0
                has_more: true
                total_count: 5210
        '400':
          description: '`path` is badly encoded.'
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not `GET`.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The query failed.
          content:
            text/plain:
              schema:
                type: string
  /media/suggest:
    get:
      tags:
        - Legacy Media Browser
      operationId: suggestLegacyMediaTerms
      summary: Typeahead suggestions for the gallery search box.
      x-access: read
      parameters:
        - name: kind
          in: query
          required: true
          description: |
            What to suggest (case-insensitive):
            - `filters`: the search keys (ignores `prefix` and `limit`).
            - `tag`: tags whose label contains `prefix`, with their categories.
            - `category`: category labels.
            - `path`: media paths.
            - `pathdir`: folders.
          schema:
            type: string
            enum:
              - filters
              - tag
              - category
              - path
              - pathdir
        - name: prefix
          in: query
          required: false
          description: Text typed so far.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum suggestions. Values outside 1 to 200 use the default.
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Suggestions. `kind=tag` adds `tags`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - suggestions
                properties:
                  suggestions:
                    type:
                      - array
                      - 'null'
                    items:
                      type: string
                    description: >-
                      Suggested strings. For `kind=tag`, the distinct labels of `tags` (`null` when
                      there are none).
                  tags:
                    type:
                      - array
                      - 'null'
                    description: Only for `kind=tag`.
                    items:
                      $ref: '#/components/schemas/LegacyMediaTag'
              example:
                tags:
                  - label: sunset
                    category: Scene
                suggestions:
                  - sunset
        '400':
          description: Missing or unknown `kind`.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not `GET`.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The query failed.
          content:
            text/plain:
              schema:
                type: string
  /media/tag:
    post:
      tags:
        - Legacy Media Browser
      operationId: updateLegacyMediaTag
      summary: Add or remove one tag on one item.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - media_path
                - tag_label
                - category_label
                - action
              properties:
                media_path:
                  type: string
                  description: Media path.
                tag_label:
                  type: string
                  description: Tag label.
                category_label:
                  type: string
                  description: The tag's category.
                action:
                  type: string
                  enum:
                    - add
                    - remove
            example:
              media_path: D:/photos/x.jpg
              tag_label: sunset
              category_label: Scene
              action: add
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        '400':
          description: Invalid JSON, a required field empty, or `action` not `add`/`remove`.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: The method is not `POST`.
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: The update failed.
          content:
            text/plain:
              schema:
                type: string
  /media/has-tag:
