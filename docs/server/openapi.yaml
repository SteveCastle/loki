  /stats:
    get:
      tags:
        - HTML Pages
      operationId: statsPage
      summary: Metadata coverage page (macOS and Linux builds only).
      description: >-
        Server-rendered page with library totals and how many items have a description, hash, size
        and tags. Registered only by the macOS and Linux servers; on Windows the path falls through
        to the home page. Other methods return `405` (plain text).
      x-access: admin
      responses:
        '200':
          description: The page.
