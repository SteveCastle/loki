      summary: '"Not them": permanently veto a face from a person.'
      description: >-
        Records a veto against the person plus cannot-links against the group's exemplar faces, and
        unassigns the face. No clustering pass will put the face back in that group, even after the
        group is dissolved and re-forms. `personId` defaults to the face's current person. A JSON
        body is required (send `{}` to use the default). Broadcasts a `people-updated` event on
        `/stream`.
