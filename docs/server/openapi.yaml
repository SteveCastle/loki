      responses:
        '200':
          description: Health report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: healthy
                version: 2.37.0
                timestamp: 1767225600
                stream:
                  active_connections: 2
                  total_messages: 150
                  max_connections: 1000
                  dropped_broadcasts: 0
                  dropped_client_msgs: 0
                  rejected_connections: 0
                jobs:
                  total: 10
                  pending: 2
                  in_progress: 1
                  completed: 5
                  cancelled: 1
                  error: 1
        '405':
          description: Method other than GET or OPTIONS. Plain text.
          content:
            text/plain:
              schema:
                type: string
  /api/config:
    get:
      tags:
        - System
      operationId: getConfig
      summary: The active configuration as JSON, with secrets redacted.
      description: >
        Reloads the config file and returns it. Every non-empty secret is replaced by the literal
        `<redacted>`: `jwtSecret`, `discordToken`, `runpodApiKey`, `lmstudioApiKey`,
        `llamacppApiKey`, `strataApiKey`, storage-root `accessKey`/`secretKey`, and engine pool API
        keys and node tokens. Empty secrets stay empty (and storage-root credentials, being
        `omitempty`, are then absent). `POST /config` treats `<redacted>` as "keep the stored
        value", so a read-modify-write round trip is safe.
      x-access: admin
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
        '405':
