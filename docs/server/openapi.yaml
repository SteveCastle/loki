          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/tags:
    post:
      tags:
        - Media Library
      operationId: getMediaTags
      summary: Tag assignments of one item.
      description: >
        Every row of the item's tag assignments, one per tag and video timestamp. An unknown path
        returns an empty list.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/photos/x.jpg
      responses:
        '200':
          description: The item's tags.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaTagAssignment'
              example:
                tags:
                  - tag_label: sunset
                    category_label: Scene
                    weight: 1
                    time_stamp: 0
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The query failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/gif-metadata:
    post:
      tags:
        - Media Library
      operationId: getGifMetadata
      summary: Frame count and duration of an animated image or video, via ffprobe.
      description: >
        Runs `ffprobe -count_frames` on the first video stream. When ffprobe fails or reports no
        stream the response is JSON `null` with status `200`.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPathRequest'
            example:
              path: D:/gifs/loop.gif
      responses:
        '200':
          description: The probe result, or `null`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GifMetadata'
                  - type: 'null'
              example:
                frameCount: 48
                duration: 1.92
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Anonymous caller and the path is outside every storage root and not a library row (or is
            an `http(s)://` URL).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/preview:
    post:
      tags:
        - Media Library
      operationId: getMediaPreviewPath
      summary: Server-side path of an item's thumbnail, generating it if missing.
      description: >
        Returns the thumbnail's location as a JSON string: a local filesystem path on the server, or
        an `s3://` URL for media in a bucket. To fetch the image bytes use `GET /media/thumbnail`
        instead.


        Lookup order: the path recorded in the item's thumbnail column (if the file or object still
        exists), then for local media the deterministic cache path on disk, then generation
        (throttled). Results are written back to the item's row.


        `cache` that is not a string, or an empty string, returns `null` without doing anything. A
        string that is not one of the three column names is treated as `thumbnail_path_600`. Without
        a configured database path, local media returns `null`.


        The handler does not check the method; clients send `POST`.
      x-access: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Media path.
                cache:
                  description: Thumbnail column, or `false` to skip.
                  oneOf:
                    - $ref: '#/components/schemas/ThumbnailCache'
                    - type: boolean
                timeStamp:
                  type: number
                  description: >-
                    Video frame time in seconds. `0` (default) uses the default frame; a non-zero
                    value gets its own cache file.
                  default: 0
            example:
              path: D:/videos/clip.mp4
              cache: thumbnail_path_600
              timeStamp: 12.5
      responses:
        '200':
          description: The thumbnail path, or `null`.
          content:
            application/json:
              schema:
                type:
                  - string
                  - 'null'
              example: C:\ProgramData\Lowkey Media Server\thumbnail_path_600\3b5d...e1.mp4
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Anonymous caller and the path is outside every storage root and not a library row (or is
            an `http(s)://` URL).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Thumbnail generation failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/description:
    post:
      tags:
        - Media Library
      operationId: setMediaDescription
      summary: Set an item's description.
      description: >
        Writes `description` to the item's row. An empty string stores an empty description. A path
        with no row changes nothing and still returns `200`.


        The handler does not check the method; clients send `POST`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Media path.
                description:
                  type: string
                  description: New description text.
            example:
              path: D:/photos/x.jpg
              description: A red car parked by the sea.
      responses:
        '200':
          description: Always an empty object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
              example: {}
        '400':
          description: The body is not valid JSON.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The update failed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Error'
  /api/media/transcript:
    post:
      tags:
        - Media Library
      operationId: setMediaTranscript
      summary: Set or clear an item's transcript.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: Media path.
                transcript:
                  type: string
                  description: >-
                    New transcript (for example WebVTT text). An empty or missing value stores an
                    empty string.
            example:
              path: D:/videos/talk.mp4
              transcript: |-
                WEBVTT

                00:00.000 --> 00:02.000
                Hello
      responses:
