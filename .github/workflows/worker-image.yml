name: Worker image

# Builds the loki-worker container (the four CUDA engines + the loki-worker
# node agent, tools/worker/Dockerfile) and publishes it to GitHub Container
# Registry, where RunPod, AWS and any Docker host pull it from:
#
#   ghcr.io/stevecastle/loki-worker:latest        newest master build
#   ghcr.io/stevecastle/loki-worker:<version>     a release (package.json version, also on v* tags)
#   ghcr.io/stevecastle/loki-worker:sha-<commit>  every build, for pinning
#
# Pull requests build the image without pushing it. Hosted runners have no
# GPU: compiling the CUDA kernels needs only nvcc, which the build image has.
# The first push creates the package private; make it public once under the
# repository's Packages settings so cloud providers can pull it without
# registry credentials (or give them a read:packages token).
on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'tools/loki-*/**'
      - 'tools/worker/**'
      - 'media-server/workerapi/**'
      - 'media-server/cmd/loki-worker/**'
      - 'media-server/go.mod'
      - 'media-server/go.sum'
      - '.github/workflows/worker-image.yml'
  pull_request:
    paths:
      - 'tools/loki-*/**'
      - 'tools/worker/**'
      - 'media-server/workerapi/**'
      - 'media-server/cmd/loki-worker/**'
      - '.github/workflows/worker-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to GHCR'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: loki-worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: media-server/go.mod
          cache-dependency-path: media-server/go.sum
      - name: Test the worker and its contract
        working-directory: media-server
        run: go test ./workerapi/ ./cmd/loki-worker/

  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # the CUDA devel image plus four release builds need more than the
      # runner's default free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loki-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      - name: Build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: tools/worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: loki-worker:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=loki-worker
          cache-to: type=gha,scope=loki-worker,mode=max

      # Hosted runners have no GPU; every binary must still start and say
      # what it is (the engines touch CUDA only when a run begins).
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh loki-worker:ci -c '
            set -e
            loki-worker --version
            for e in loki-retouch loki-reshoot loki-dream loki-segment; do $e --version; $e --help | grep -q -- "--worker"; done
            ffmpeg -hide_banner -version | head -1
          '

      - name: Push
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: tools/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=loki-worker
