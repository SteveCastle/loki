name: AI CLI tools

# Fast feedback for the standalone CUDA CLIs under tools/ and the loki-worker image built from them. The same
# builds also run inside release.yml (jobs "Build AI tools" and "Publish worker image"), where they can never
# block a release; this workflow is where a broken build shows up as a red check on the PR.
#
# Pull requests only (plus a manual run for a branch without one): a `push` trigger as well would build every
# commit of a PR branch twice, once per event. master is covered by release.yml.
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'media-server/workerapi/**'
      - 'media-server/cmd/loki-worker/**'
      - '.github/actions/build-ai-tool/**'
      - '.github/actions/worker-image/**'
      - '.github/workflows/tools.yml'
  workflow_dispatch:

permissions:
  contents: read

# a newer commit on the same PR supersedes the run in progress
concurrency:
  group: tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.tool }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: loki-retouch, os: windows-2022, target: windows-amd64 }
          - { tool: loki-retouch, os: ubuntu-latest, target: linux-amd64 }
          - { tool: loki-reshoot, os: windows-2022, target: windows-amd64 }
          - { tool: loki-reshoot, os: ubuntu-latest, target: linux-amd64 }
          - { tool: loki-segment, os: windows-2022, target: windows-amd64 }
          - { tool: loki-segment, os: ubuntu-latest, target: linux-amd64 }
          - { tool: loki-dream, os: windows-2022, target: windows-amd64 }
          - { tool: loki-dream, os: ubuntu-latest, target: linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build, test, package
        id: tool
        uses: ./.github/actions/build-ai-tool
        with:
          tool: ${{ matrix.tool }}
          target: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.tool }}-${{ matrix.target }}
          path: |
            tools/${{ matrix.tool }}/dist/${{ steps.tool.outputs.archive }}
            tools/${{ matrix.tool }}/dist/${{ steps.tool.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # The worker image from the Linux builds above (no second compile), smoke-tested, not pushed.
  worker-image:
    name: loki-worker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: media-server/go.mod
          cache-dependency-path: media-server/go.sum

      - name: Test loki-worker and its contract
        working-directory: media-server
        run: go test ./workerapi/... ./cmd/loki-worker/

      - name: Build and smoke-test the image
        uses: ./.github/actions/worker-image
        with:
          version: pr-${{ github.event.pull_request.number || github.run_number }}
